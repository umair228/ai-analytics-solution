name: CI

# Deterministic accuracy gate — no GPU/LLM required. Runs the Django system
# check and the analytics / agent / NL->SQL golden test suites on every push
# and PR. The model-dependent evals (eval_astm retrieval, eval_domain) run
# separately where an index / LLM endpoint is available.
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_ENGINE: sqlite          # don't require a LIMS during unit tests
      DOCSEARCH_DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # neuralprophet 0.9.0 requires <=3.12
          cache: pip

      - name: System deps (unixODBC for pyodbc build)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -c .docsearch-constraints.txt -r requirements.txt

      - name: Download spaCy model (NL->SQL engine)
        run: python -m spacy download en_core_web_sm
        continue-on-error: true   # engine falls back to lightweight parser if absent

      - name: Django system check
        run: python manage.py check

      - name: Golden + unit tests (analytics + agent + NL->SQL)
        run: python manage.py test analytics ai -v2

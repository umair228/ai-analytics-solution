name: CI

# Deterministic accuracy gate — no GPU/LLM required. Runs the Django system
# check and the analytics / agent / NL->SQL golden + docsearch/RAG authz suites on every push
# and PR. The model-dependent evals (eval_astm retrieval, eval_domain) run
# separately where an index / LLM endpoint is available.
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_ENGINE: sqlite          # don't require a LIMS during unit tests
      DOCSEARCH_DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # neuralprophet 0.9.0 requires <=3.12
          cache: pip

      - name: System deps (unixODBC for pyodbc build)
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -c .docsearch-constraints.txt -r requirements.txt

      - name: Download spaCy model (NL->SQL engine)
        run: python -m spacy download en_core_web_sm
        continue-on-error: true   # engine falls back to lightweight parser if absent

      - name: Django system check
        run: python manage.py check

      # Every app, not a subset. `semantics` (certified metrics/router) and
      # `replication` (the LIMS replica) were previously in neither CI nor
      # `make test`, and `core` now carries the audit-trail controls — a
      # governance control that isn't gated is a claim, not a control.
      - name: Unit + golden + authz + governance tests (all apps)
        run: python manage.py test -v2

      # A traceability matrix rots the moment someone renames a test, and every
      # matrix ever written in a word processor is wrong within a month. This one is
      # code, so CI can prove it still points at tests that exist.
      - name: Traceability matrix intact (CSV / GAMP 5)
        run: python manage.py qualify --matrix

      # The Operational Qualification, as a downloadable artefact per commit. This is the
      # thing an assessor actually asks for — "show me the qualification record for the
      # version you deployed" — and until now the only way to get one was for somebody to
      # run a command on a laptop and paste the output somewhere.
      - name: Operational Qualification report
        env:
          DIS_GIT_SHA: ${{ github.sha }}
          DIS_VERSION: ${{ github.ref_name }}
        run: python manage.py qualify --json --out VALIDATION_SUMMARY.md

      - name: Upload the OQ report
        if: always()          # a FAILED qualification is the one you most want to read
        uses: actions/upload-artifact@v4
        with:
          name: oq-report-${{ github.sha }}
          path: |
            validation/oq_report.json
            VALIDATION_SUMMARY.md
          if-no-files-found: warn

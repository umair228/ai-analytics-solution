name: build-push

# Build the DIS backend image and push it to GHCR.
#
# Release gate (keeps the live EGPC pilot isolated from day-to-day merges):
#   * pushes to main publish ONLY immutable tags (main-<short sha>). There is no
#     ':latest' and NO deploy dispatch, so merging to main can never change a server.
#   * a deployment is a deliberate release: push the tag 'egpc-vX.Y.Z' on BOTH app
#     repos; each build publishes that exact tag and dispatches a deploy of exactly
#     that tag for its own service to umair228/dis-deploy (which refuses anything else).
#   * 'fmms-vX.Y.Z' tags publish the PMSv2 reporting images (mirrored into the
#     client's registry by hand; never deployed by this path).
#   * 'v*' tags still publish versioned images (no deploy).
on:
  push:
    branches: [main]
    tags: ["v*", "egpc-v*", "fmms-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/umair228/dis-api

jobs:
  build:
    runs-on: ubuntu-latest
    # DEPLOY_DISPATCH_TOKEN (a PAT with 'repo' scope on dis-deploy) enables the deploy
    # dispatch for egpc-v* release tags; without it releases are deployed manually.
    env:
      DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # never publish a moving 'latest' (metadata-action adds one to semver tags by default)
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=main-,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image runs its own Operational Qualification at build time and carries the
          # report. These name the build it is evidence about — without them the report
          # says "unknown", which is honest but useless to an assessor.
          build-args: |
            DIS_GIT_SHA=${{ github.sha }}
            DIS_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger deploy on dis-deploy (egpc-v* release tags only)
        if: startsWith(github.ref, 'refs/tags/egpc-v') && env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: umair228/dis-deploy
          event-type: deploy
          client-payload: '{"service": "api", "tag": "${{ github.ref_name }}", "sha": "${{ github.sha }}"}'

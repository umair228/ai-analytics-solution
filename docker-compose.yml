# DIS enterprise stack.
#   CPU/standard:   docker compose up -d --build
#   With local GPU: docker compose --profile gpu up -d --build   (starts vLLM too)
# Production LLM serving is vLLM (the `vllm` service / an external GPU node);
# point the api's LLM_BASE_URL at it in .env.prod.
services:

  # ── PostgreSQL + pgvector (app metadata + RAG vectors) ──────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       dse
      POSTGRES_USER:     dse
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD:-dse}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django / gunicorn API (the DIS agent + tools) ──────────────────────────
  api:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ai/status/').status<500 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Scheduled dataset refresh / alerts (every 5 min) ───────────────────────
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "while true; do
               python manage.py run_scheduled_refreshes || true;
               sleep 300;
             done"

  # ── Web tier: built SPA + reverse proxy + static/media (replaces bare nginx) ─
  web:
    build:
      context: ../interactive-analytics-dse
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - media:/app/media:ro
      - static:/app/staticfiles:ro

  # ── vLLM inference (GPU) — enabled with the "gpu" profile / external node ───
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    restart: unless-stopped
    command: >
      --model Qwen/Qwen2.5-14B-Instruct-AWQ
      --quantization awq
      --max-model-len 16384
      --gpu-memory-utilization 0.92
      --port 8000
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hfcache:/root/.cache/huggingface
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

volumes:
  pgdata:
  media:
  static:
  hfcache:

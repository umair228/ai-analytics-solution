services:

  # ── PostgreSQL metadata database ──────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       dse
      POSTGRES_USER:     dse
      POSTGRES_PASSWORD: dse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django / gunicorn API ─────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"

  # ── Scheduled dataset refresh (every 5 min) ───────────────────────────────
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "while true; do
               python manage.py run_scheduled_refreshes;
               sleep 300;
             done"

  # ── Nginx reverse proxy + static file server ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/app/media:ro
      - static:/app/staticfiles:ro
      # Mount the built React app (docker build copies it here, or bind-mount
      # the dist/ folder after running:  npm run build)
      - ./frontend-dist:/usr/share/nginx/html:ro

volumes:
  pgdata:
  media:
  static:

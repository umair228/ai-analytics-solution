services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dse
      POSTGRES_USER: dse
      POSTGRES_PASSWORD: dse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SSL_REDIRECT: "False"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      PG_DB_NAME: dse
      PG_DB_USER: dse
      PG_DB_PASSWORD: dse
      PG_DB_HOST: db
      PG_DB_PORT: "5432"
      DSE_FERNET_KEY: ""
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:

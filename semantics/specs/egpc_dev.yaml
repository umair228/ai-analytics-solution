# Curated semantic layer for the EGPC LabWare LIMS (the data dictionary).
# Load with:  python manage.py load_semantic_layer --datasource EGPC_DEV
# `datasource:` is matched against DataSource.name (case-insensitive).
#
# This is the accuracy-defining artifact: encodings, casts, do_not_group, the
# certified joins (LabWare declares no FKs) and certified metrics. Curate it;
# the loader verifies every table/column/join still exists in the live schema.
datasource: EGPC_DEV

notes: |
  Time series: use SAMPLE.LOGIN_DATE (full 3-year history); RESULT.ENTERED_ON is a
  narrower entry window. Turnaround hours = DATEDIFF(hour, SAMPLE.LOGIN_DATE,
  SAMPLE.DATE_COMPLETED). SAMPLE.STATUS codes: A=Authorized, C=Complete,
  X=Cancelled, R=Rejected, U=Unreceived, I=In Progress, P=Pending, D=Disposed.
  Off-spec means IN_SPEC='F'. There is no usable per-result instrument; attribute
  by operator (RESULT.ENTERED_BY) instead.

tables:
  SAMPLE:
    description: One row per sample logged into the LIMS (login register).
    synonyms: [sample, samples, login, registration, batch]
    columns:
      SAMPLE_NUMBER: {description: Primary key for a sample.}
      TEXT_ID: {description: Human-readable sample id.}
      PRODUCT: {description: Product / grade / material of the sample., synonyms: [product, grade, material, stream]}
      SAMPLE_TYPE: {description: SCHEDULED / CUSTOMER / UNSCHEDULED / TANK_SAMPLE / SPECIAL.}
      STATUS: {description: Workflow status code., encoding: "A=Authorized, C=Complete, X=Cancelled, R=Rejected, U=Unreceived, I=In Progress, P=Pending, D=Disposed"}
      IN_SPEC: {description: Whether the sample is within specification., encoding: "T=in-spec, F=off-spec", synonyms: [in spec, off spec, out of spec, conforming]}
      LOGIN_DATE: {description: When the sample was logged (use for time series).}
      DATE_COMPLETED: {description: When analysis completed (for turnaround).}
      CHANGED_ON: {description: Last-modified timestamp (replication watermark).}

  RESULT:
    description: Individual test results; each belongs to a sample.
    synonyms: [result, results, reading, measurement, analyte]
    columns:
      SAMPLE_NUMBER: {description: FK to SAMPLE.}
      RESULT_NUMBER: {description: Result id within the sample.}
      ANALYSIS: {description: The analysis / test method code., synonyms: [test, analysis, method, parameter]}
      NAME: {description: Component / analyte name.}
      NUMERIC_ENTRY: {description: Numeric result stored as TEXT — cast before maths., needs_cast: true, synonyms: [value, reading, measurement]}
      UNITS: {description: Units of the result.}
      IN_SPEC: {description: Whether the result is within spec., encoding: "T=in-spec, F=off-spec", synonyms: [off spec, out of spec, failed]}
      ENTERED_BY: {description: Operator user-id who entered the result (use for by-analyst/operator breakdowns; join LIMS_USERS for a name)., synonyms: [operator, analyst, technician, entered by]}
      ENTERED_ON: {description: When the result was entered.}
      CHANGED_ON: {description: Last-modified timestamp (replication watermark).}

  TEST:
    description: Tests requested per sample (links a sample to its analyses).
    synonyms: [test, tests]
    columns:
      SAMPLE_NUMBER: {description: FK to SAMPLE.}
      TEST_NUMBER: {description: Test id within the sample.}
      ANALYSIS: {description: Analysis / method code.}
      STATUS: {description: Test status code.}
      INSTRUMENT: {description: Instrument — essentially EMPTY in EGPC; do not group on it., do_not_group: true}

joins:
  # NB: "on" is quoted — a bare YAML `on:` key parses as the boolean True.
  - {left: RESULT, right: SAMPLE, "on": [[SAMPLE_NUMBER, SAMPLE_NUMBER]],
     description: A result belongs to a sample.}
  - {left: TEST, right: SAMPLE, "on": [[SAMPLE_NUMBER, SAMPLE_NUMBER]],
     description: A test belongs to a sample.}

metrics:
  - key: oos_rate_by_product
    name: Out-of-spec rate by product
    synonyms: ["out of spec rate by product", "off spec rate by product",
               "which product has the worst out of specification rate",
               "worst product for off spec",
               "highest out of specification rate", "out of specification rate highest",
               "out of specification rate is highest", "out of spec rate highest",
               "product out of specification rate", "off spec rate by product"]
    description: In-spec vs off-spec result counts and off-spec % per product, worst first.
    sql: |
      SELECT s.PRODUCT AS product,
             COUNT(*) AS results,
             SUM(CASE WHEN r.IN_SPEC='F' THEN 1 ELSE 0 END) AS off_spec,
             ROUND(100.0*SUM(CASE WHEN r.IN_SPEC='F' THEN 1 ELSE 0 END)/COUNT(*), 2) AS off_spec_pct
      FROM dbo.RESULT r
      JOIN dbo.SAMPLE s ON r.SAMPLE_NUMBER = s.SAMPLE_NUMBER
      GROUP BY s.PRODUCT
      HAVING COUNT(*) >= 200
      ORDER BY off_spec_pct DESC

  - key: oos_by_operator
    name: Out-of-spec results by operator
    synonyms: ["off spec by operator", "out of spec by analyst",
               "which operator has the most off spec", "off spec by technician"]
    description: Off-spec result count and rate by the analyst who entered the result.
    sql: |
      SELECT r.ENTERED_BY AS operator,
             COUNT(*) AS results,
             SUM(CASE WHEN r.IN_SPEC='F' THEN 1 ELSE 0 END) AS off_spec,
             ROUND(100.0*SUM(CASE WHEN r.IN_SPEC='F' THEN 1 ELSE 0 END)/COUNT(*), 2) AS off_spec_pct
      FROM dbo.RESULT r
      GROUP BY r.ENTERED_BY
      ORDER BY off_spec DESC

  - key: sulphur_by_product
    name: Average sulphur by product
    synonyms: ["average sulphur by product", "sulphur by product",
               "average sulphur value for each product", "average sulfur by product",
               "sulphur content by product", "sulfur by product"]
    description: Average and max total-sulphur result per product (analyte spelled SULFUR).
    sql: |
      SELECT TOP 50 s.PRODUCT AS product,
             COUNT(*) AS results,
             ROUND(AVG(TRY_CONVERT(float, r.NUMERIC_ENTRY)), 4) AS avg_sulphur,
             ROUND(MAX(TRY_CONVERT(float, r.NUMERIC_ENTRY)), 4) AS max_sulphur,
             MAX(r.UNITS) AS units
      FROM dbo.RESULT r
      JOIN dbo.SAMPLE s ON r.SAMPLE_NUMBER = s.SAMPLE_NUMBER
      WHERE (r.ANALYSIS LIKE 'SULFUR%' OR r.NAME LIKE '%Sulfur%')
        AND r.NUMERIC_ENTRY IS NOT NULL AND s.PRODUCT IS NOT NULL
      GROUP BY s.PRODUCT
      ORDER BY avg_sulphur DESC

  - key: oos_total
    name: Total out-of-spec results
    synonyms: ["how many results are out of specification", "how many off spec results",
               "how many results out of spec", "total off spec results",
               "number of out of specification results", "count of off spec results"]
    description: Count of out-of-spec results across EGPC (RESULT.IN_SPEC='F').
    sql: |
      SELECT COUNT(*) AS off_spec_results FROM dbo.RESULT WHERE IN_SPEC = 'F'

  - key: oos_by_test_count
    name: Out-of-spec results by test
    synonyms: ["greatest number of samples gone out of specification",
               "which test has the most out of spec", "out of spec by test",
               "off spec by test", "out of specification by test",
               "test with the most out of spec results"]
    description: Out-of-spec result count per analysis/test (RESULT.IN_SPEC='F'), worst first.
    sql: |
      SELECT TOP 30 ANALYSIS AS analysis, COUNT(*) AS off_spec
      FROM dbo.RESULT WHERE IN_SPEC = 'F'
      GROUP BY ANALYSIS ORDER BY off_spec DESC

  - key: oos_by_product_count
    name: Out-of-spec results by product (count)
    synonyms: ["greatest number of out of spec results", "most out of spec results by product",
               "product with the most out of spec results", "most off spec results by product"]
    description: Out-of-spec result COUNT per product (RESULT.IN_SPEC='F'), most first.
    sql: |
      SELECT TOP 30 s.PRODUCT AS product, COUNT(*) AS off_spec
      FROM dbo.RESULT r JOIN dbo.SAMPLE s ON r.SAMPLE_NUMBER = s.SAMPLE_NUMBER
      WHERE r.IN_SPEC = 'F'
      GROUP BY s.PRODUCT ORDER BY off_spec DESC

  - key: top5_tests
    name: Top tests by volume
    synonyms: ["top 5 tests most used", "5 most used tests", "most used tests",
               "top tests by volume", "most common tests"]
    description: The highest-volume analyses by result count.
    sql: |
      SELECT TOP 5 ANALYSIS AS analysis, COUNT(*) AS results
      FROM dbo.RESULT GROUP BY ANALYSIS ORDER BY results DESC

  - key: most_used_product
    name: Most-tested product
    synonyms: ["most used to conduct testing", "most tested product",
               "product most used for testing", "which product is tested most"]
    description: The product with the most samples logged.
    sql: |
      SELECT TOP 5 PRODUCT AS product, COUNT(*) AS samples
      FROM dbo.SAMPLE GROUP BY PRODUCT ORDER BY samples DESC

  - key: unscheduled_count
    name: Unscheduled sample count
    synonyms: ["how many unscheduled samples", "number of unscheduled samples",
               "unscheduled samples registered", "count of unscheduled samples"]
    description: Number of samples with SAMPLE_TYPE='UNSCHEDULED'.
    sql: |
      SELECT COUNT(*) AS unscheduled_samples FROM dbo.SAMPLE WHERE SAMPLE_TYPE = 'UNSCHEDULED'

  - key: cancelled_count
    name: Cancelled sample count
    synonyms: ["how many samples were cancelled", "number of cancelled samples",
               "count of cancelled samples", "cancelled samples"]
    description: Number of cancelled samples (SAMPLE.STATUS='X').
    sql: |
      SELECT COUNT(*) AS cancelled_samples FROM dbo.SAMPLE WHERE STATUS = 'X'

  - key: cetane_range
    name: Cetane Index range
    synonyms: ["range of cetane index", "cetane index range", "cetane index in diesel",
               "cetane number range", "min and max cetane"]
    description: Min/max/mean of the Cetane Index analysis (verify the analysis code against the data).
    sql: |
      SELECT ROUND(MIN(TRY_CONVERT(float, NUMERIC_ENTRY)), 2) AS min_value,
             ROUND(MAX(TRY_CONVERT(float, NUMERIC_ENTRY)), 2) AS max_value,
             ROUND(AVG(TRY_CONVERT(float, NUMERIC_ENTRY)), 2) AS mean_value,
             COUNT(*) AS n
      FROM dbo.RESULT
      WHERE (ANALYSIS LIKE '%CETANE%' OR NAME LIKE '%Cetane%') AND NUMERIC_ENTRY IS NOT NULL

  - key: octane_range
    name: Octane Number (RON) range
    synonyms: ["range of octane number", "octane number range", "octane rating range",
               "ron range", "min and max octane"]
    description: Min/max/mean of the Octane Number (RON) analysis (verify the analysis code against the data).
    sql: |
      SELECT ROUND(MIN(TRY_CONVERT(float, NUMERIC_ENTRY)), 2) AS min_value,
             ROUND(MAX(TRY_CONVERT(float, NUMERIC_ENTRY)), 2) AS max_value,
             ROUND(AVG(TRY_CONVERT(float, NUMERIC_ENTRY)), 2) AS mean_value,
             COUNT(*) AS n
      FROM dbo.RESULT
      WHERE ANALYSIS = 'OCTANE_NO' AND NUMERIC_ENTRY IS NOT NULL

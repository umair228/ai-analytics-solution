# Fabrication demo pack: boards over a GENERATED fabrication company.
#
# Demonstration data only (seed_fabrication.build_warehouse): invented figures for the
# areas a fabrication company manages and the client's system does not hold yet: the shop
# floor, weld quality, NCRs, purchasing, dispatch, earned value, change orders and safety,
# and the business around them (tenders and the order book, invoices and cash, stock,
# maintenance and equipment certificates, the workforce and its qualifications). The data
# source is flagged demo, so every board here shows "Demonstration data".
#
#   manage.py seed_fabrication_demo        (builds the data, registers the source, installs this)
#
# SQLite SQL. The data date is data_info.data_date; "now" in a query means that date.
pack: fabrication-demo
version: 1
datasources:
  default: "Fabrication demo (generated data)"
visibility: org
share_with_group: ""

datasets:
  # ================================================================ HEADLINE SERIES
  - key: fd_delivery_monthly
    name: "FAB · On-time delivery by month (rolling 3 months)"
    datasource: default
    sql: |
      SELECT month, shipped, on_time,
             ROUND(100.0 * SUM(on_time) OVER w / SUM(shipped) OVER w, 1) AS on_time_pct
      FROM (SELECT substr(actual_ship, 1, 7) AS month, COUNT(*) AS shipped,
                   SUM(CASE WHEN days_late <= 3 THEN 1 ELSE 0 END) AS on_time
            FROM shipments WHERE status = 'Shipped' AND substr(actual_ship, 1, 7) < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
            GROUP BY substr(actual_ship, 1, 7))
      WINDOW w AS (ORDER BY month ROWS 2 PRECEDING)
      ORDER BY month

  - key: fd_weld_monthly
    name: "FAB · Weld repair rate by month"
    datasource: default
    sql: |
      SELECT substr(welded_on, 1, 7) AS month, COUNT(*) AS welds,
             SUM(CASE WHEN result = 'Rejected' THEN 1 ELSE 0 END) AS repairs,
             ROUND(100.0 * SUM(CASE WHEN result = 'Rejected' THEN 1 ELSE 0 END) / COUNT(*), 2) AS repair_pct
      FROM welds
      WHERE substr(welded_on, 1, 7) < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
      GROUP BY substr(welded_on, 1, 7)
      HAVING COUNT(*) >= 300
      ORDER BY month

  - key: fd_ncr_open
    name: "FAB · Open NCRs"
    datasource: default
    sql: |
      SELECT COUNT(*) AS open_ncrs,
             SUM(CASE WHEN severity = 'Critical' THEN 1 ELSE 0 END) AS critical,
             SUM(CASE WHEN days_open > 30 THEN 1 ELSE 0 END) AS older_than_30_days
      FROM ncrs WHERE status = 'Open'

  - key: fd_ncr_monthly
    name: "FAB · NCRs raised and closed by month, cost of poor quality"
    datasource: default
    sql: |
      SELECT m.month, COALESCE(r.raised, 0) AS [Raised], COALESCE(c.closed, 0) AS [Closed],
             COALESCE(r.cost_sar, 0) AS cost_sar
      FROM (SELECT DISTINCT substr(raised_on, 1, 7) AS month FROM ncrs WHERE substr(raised_on, 1, 7) < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')) m
      LEFT JOIN (SELECT substr(raised_on, 1, 7) AS month, COUNT(*) AS raised, SUM(cost_sar) AS cost_sar
                 FROM ncrs GROUP BY 1) r ON r.month = m.month
      LEFT JOIN (SELECT substr(closed_on, 1, 7) AS month, COUNT(*) AS closed
                 FROM ncrs WHERE closed_on IS NOT NULL GROUP BY 1) c ON c.month = m.month
      ORDER BY m.month

  - key: fd_supplier_monthly
    name: "FAB · Supplier on-time delivery by month (rolling 3 months)"
    datasource: default
    sql: |
      SELECT month, received, on_time,
             ROUND(100.0 * SUM(on_time) OVER w / SUM(received) OVER w, 1) AS on_time_pct
      FROM (SELECT substr(received_on, 1, 7) AS month, COUNT(*) AS received,
                   SUM(CASE WHEN days_late = 0 THEN 1 ELSE 0 END) AS on_time
            FROM purchase_orders WHERE status = 'Received' AND substr(received_on, 1, 7) < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
            GROUP BY substr(received_on, 1, 7))
      WINDOW w AS (ORDER BY month ROWS 2 PRECEDING)
      ORDER BY month

  - key: fd_hse_monthly
    name: "FAB · Safety by month (TRIR rolling 12 months)"
    datasource: default
    sql: |
      SELECT month, man_hours, near_misses, first_aid, recordables, lost_time, trir_12m, ltifr_12m,
             trir_12m AS [Recordable injury rate], ltifr_12m AS [Lost-time injury rate]
      FROM (SELECT month, man_hours, near_misses, first_aid, recordables, lost_time,
                   ROUND(SUM(recordables) OVER w * 200000.0 / SUM(man_hours) OVER w, 2) AS trir_12m,
                   ROUND(SUM(lost_time) OVER w * 200000.0 / SUM(man_hours) OVER w, 2) AS ltifr_12m,
                   ROW_NUMBER() OVER (ORDER BY month) AS n
            FROM hse_monthly
            WHERE month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
            WINDOW w AS (ORDER BY month ROWS 11 PRECEDING))
      -- the first six months have too few hours behind a 12-month rate to mean much
      WHERE n > 6
      ORDER BY month

  - key: fd_days_since_lti
    name: "FAB · Days since the last lost-time injury"
    datasource: default
    sql: |
      SELECT CAST(julianday((SELECT value FROM data_info WHERE key = 'data_date'))
                  - julianday(MAX(occurred_on)) AS INTEGER) AS days_since
      FROM hse_incidents WHERE classification = 'Lost time'

  # ================================================================ SHOP FLOOR
  - key: fd_wc_load
    name: "FAB · Work-centre load, last 12 weeks and next 8 (% of capacity)"
    datasource: default
    sql: |
      SELECT w.work_center, w.week_start,
             CAST(strftime('%d', w.week_start) AS INTEGER) || ' ' ||
               CASE strftime('%m', w.week_start) WHEN '01' THEN 'Jan' WHEN '02' THEN 'Feb' WHEN '03' THEN 'Mar'
                 WHEN '04' THEN 'Apr' WHEN '05' THEN 'May' WHEN '06' THEN 'Jun' WHEN '07' THEN 'Jul'
                 WHEN '08' THEN 'Aug' WHEN '09' THEN 'Sep' WHEN '10' THEN 'Oct' WHEN '11' THEN 'Nov'
                 ELSE 'Dec' END AS week,
             CAST(ROUND(100.0 * w.load_hours / w.capacity_hours) AS INTEGER) AS load_pct,
             CASE w.work_center WHEN 'Cutting bay' THEN 1 WHEN 'Rolling & forming' THEN 2 WHEN 'Fit-up' THEN 3
               WHEN 'Welding bay' THEN 4 WHEN 'NDT' THEN 5 WHEN 'Heat treatment' THEN 6 WHEN 'Testing' THEN 7
               WHEN 'Blast & paint' THEN 8 ELSE 9 END AS route_order
      FROM wc_weekly w
      WHERE julianday(w.week_start) BETWEEN julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 84
                                       AND julianday((SELECT value FROM data_info WHERE key = 'data_date')) + 56
      ORDER BY route_order, week_start

  - key: fd_welding_load
    name: "FAB · Welding bay load by week (% of capacity)"
    datasource: default
    sql: |
      SELECT week_start, CAST(ROUND(100.0 * load_hours / capacity_hours) AS INTEGER) AS load_pct
      FROM wc_weekly
      WHERE work_center = 'Welding bay'
        AND julianday(week_start) <= julianday((SELECT value FROM data_info WHERE key = 'data_date')) + 28
      ORDER BY week_start

  - key: fd_wip
    name: "FAB · Items waiting at each operation (work in progress)"
    datasource: default
    sql: |
      SELECT operation, MIN(seq) AS route_order, COUNT(*) AS items,
             CAST(ROUND(AVG(waiting_days)) AS INTEGER) AS avg_days
      FROM (SELECT o.operation, o.seq, o.status,
                   LAG(o.status) OVER (PARTITION BY o.item_no ORDER BY o.seq) AS prev_status,
                   julianday((SELECT value FROM data_info WHERE key = 'data_date'))
                     - julianday(COALESCE(o.actual_start, o.planned_start)) AS waiting_days
            FROM operations o JOIN projects p ON p.project_no = o.project_no
            WHERE p.status <> 'On hold')
      WHERE status = 'In progress' OR (status = 'Not started' AND prev_status = 'Done')
      GROUP BY operation
      ORDER BY route_order

  - key: fd_throughput_weekly
    name: "FAB · Items finished per week, against plan"
    datasource: default
    sql: |
      SELECT wk AS week_start, SUM(planned) AS [Planned], SUM(finished) AS [Finished]
      FROM (SELECT date(planned_finish, 'weekday 1', '-7 days') AS wk, 1 AS planned, 0 AS finished
            FROM operations WHERE operation = 'Final inspection'
            UNION ALL
            SELECT date(actual_finish, 'weekday 1', '-7 days'), 0, 1
            FROM operations WHERE operation = 'Final inspection' AND status = 'Done')
      WHERE julianday(wk) BETWEEN julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 182
                              AND julianday((SELECT value FROM data_info WHERE key = 'data_date'))
      GROUP BY wk
      ORDER BY week_start

  - key: fd_late_ops_by_wc
    name: "FAB · Operations running late now, by work centre"
    datasource: default
    sql: |
      SELECT o.work_center, COUNT(*) AS late_operations,
             CAST(ROUND(AVG(o.days_late)) AS INTEGER) AS avg_days_late
      FROM operations o JOIN projects p ON p.project_no = o.project_no
      WHERE o.status IN ('In progress', 'Not started') AND o.days_late > 0 AND p.status <> 'On hold'
      GROUP BY o.work_center
      ORDER BY late_operations DESC

  - key: fd_hours_by_wc
    name: "FAB · Planned against actual hours by work centre, last 90 days"
    datasource: default
    sql: |
      SELECT work_center, ROUND(SUM(planned_hours)) AS [Planned hours], ROUND(SUM(actual_hours)) AS [Actual hours]
      FROM operations
      WHERE status = 'Done'
        AND julianday(actual_finish) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 90
      GROUP BY work_center
      ORDER BY SUM(planned_hours) DESC

  # ================================================================ QUALITY
  - key: fd_weld_by_process
    name: "FAB · Weld repair rate by welding process, last 6 months"
    datasource: default
    sql: |
      SELECT process, COUNT(*) AS welds,
             ROUND(100.0 * SUM(CASE WHEN result = 'Rejected' THEN 1 ELSE 0 END) / COUNT(*), 2) AS repair_pct
      FROM welds
      WHERE julianday(welded_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 182
      GROUP BY process
      ORDER BY repair_pct DESC

  - key: fd_welders
    name: "FAB · Welders with the highest repair rate, last 6 months (150+ welds)"
    datasource: default
    sql: |
      SELECT welder, COUNT(*) AS welds,
             ROUND(100.0 * SUM(CASE WHEN result = 'Rejected' THEN 1 ELSE 0 END) / COUNT(*), 2) AS repair_pct
      FROM welds
      WHERE julianday(welded_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 182
      GROUP BY welder
      HAVING COUNT(*) >= 150
      ORDER BY repair_pct DESC

  - key: fd_ncr_pareto
    name: "FAB · NCRs by category, last 12 months (Pareto)"
    datasource: default
    sql: |
      SELECT category, ncrs,
             CAST(ROUND(100.0 * SUM(ncrs) OVER (ORDER BY ncrs DESC, category ROWS UNBOUNDED PRECEDING)
                        / SUM(ncrs) OVER ()) AS INTEGER) AS cumulative_pct
      FROM (SELECT category, COUNT(*) AS ncrs FROM ncrs
            WHERE julianday(raised_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365
            GROUP BY category)
      ORDER BY ncrs DESC, category

  - key: fd_ncr_root_cause
    name: "FAB · NCR root causes, last 12 months"
    datasource: default
    sql: |
      SELECT root_cause, COUNT(*) AS ncrs, ROUND(SUM(cost_sar)) AS cost_sar
      FROM ncrs
      WHERE julianday(raised_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365
      GROUP BY root_cause
      ORDER BY ncrs DESC

  - key: fd_ncr_open_matrix
    name: "FAB · Open NCRs by severity and age"
    datasource: default
    sql: |
      SELECT severity,
             CASE severity WHEN 'Critical' THEN 1 WHEN 'Major' THEN 2 ELSE 3 END AS severity_order,
             age_band, MIN(band_order) AS band_order, COUNT(*) AS ncrs
      FROM (SELECT severity,
                   CASE WHEN days_open <= 7 THEN '0-7 days' WHEN days_open <= 30 THEN '8-30 days'
                        WHEN days_open <= 90 THEN '31-90 days' ELSE 'over 90 days' END AS age_band,
                   CASE WHEN days_open <= 7 THEN 1 WHEN days_open <= 30 THEN 2
                        WHEN days_open <= 90 THEN 3 ELSE 4 END AS band_order
            FROM ncrs WHERE status = 'Open')
      GROUP BY severity, age_band
      ORDER BY severity_order, band_order

  # ================================================================ SUPPLY CHAIN
  - key: fd_supplier_late
    name: "FAB · Suppliers by share of lines delivered late, last 12 months"
    datasource: default
    sql: |
      SELECT supplier, COUNT(*) AS lines,
             ROUND(100.0 * SUM(CASE WHEN days_late > 0 THEN 1 ELSE 0 END) / COUNT(*), 1) AS late_pct,
             CAST(ROUND(AVG(CASE WHEN days_late > 0 THEN days_late END)) AS INTEGER) AS avg_days_late
      FROM purchase_orders
      WHERE status = 'Received'
        AND julianday(received_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365
      GROUP BY supplier
      HAVING COUNT(*) >= 8
      ORDER BY late_pct DESC

  - key: fd_po_late_matrix
    name: "FAB · Purchase-order lines by category and lateness"
    datasource: default
    sql: |
      SELECT category, lateness, MIN(band_order) AS band_order, COUNT(*) AS lines,
             SUM(COUNT(*)) OVER (PARTITION BY category) AS category_lines
      FROM (SELECT category,
                   CASE WHEN days_late = 0 THEN 'On time' WHEN days_late <= 7 THEN '1-7 days late'
                        WHEN days_late <= 21 THEN '8-21 days late' ELSE 'over 21 days late' END AS lateness,
                   CASE WHEN days_late = 0 THEN 1 WHEN days_late <= 7 THEN 2 WHEN days_late <= 21 THEN 3 ELSE 4 END AS band_order
            FROM purchase_orders WHERE status IN ('Received', 'Overdue'))
      GROUP BY category, lateness
      ORDER BY category_lines DESC, category, band_order

  - key: fd_po_overdue
    name: "FAB · Overdue purchase-order lines"
    datasource: default
    sql: |
      SELECT COUNT(*) AS overdue_lines, ROUND(SUM(value_sar)) AS overdue_value_sar,
             CAST(ROUND(AVG(days_late)) AS INTEGER) AS avg_days_late
      FROM purchase_orders WHERE status = 'Overdue'

  - key: fd_spend_category
    name: "FAB · Purchasing spend by category, last 12 months (SAR)"
    datasource: default
    sql: |
      SELECT category, ROUND(SUM(value_sar)) AS value_sar, COUNT(*) AS lines
      FROM purchase_orders
      WHERE julianday(ordered_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365
      GROUP BY category
      ORDER BY value_sar DESC

  # ================================================================ PROJECT CONTROLS
  - key: fd_evm_portfolio
    name: "FAB · Active projects: earned value, cumulative (SAR)"
    datasource: default
    sql: |
      SELECT e.week_start, ROUND(SUM(e.pv_sar)) AS [Planned value], ROUND(SUM(e.ev_sar)) AS [Earned value],
             ROUND(SUM(e.ac_sar)) AS [Actual cost]
      FROM evm_weekly e JOIN projects p ON p.project_no = e.project_no
      WHERE p.status = 'Active'
      GROUP BY e.week_start
      ORDER BY week_start

  - key: fd_projects
    name: "FAB · Projects: cost and schedule performance"
    datasource: default
    sql: |
      SELECT p.project_no, p.project_no || ' · ' || p.client || ' · ' || p.product_type AS project,
             p.client, p.product_type, p.status, p.project_manager, p.contract_value_sar,
             CASE WHEN e.ev_sar >= 0.05 * p.budget_cost_sar THEN ROUND(e.ev_sar / NULLIF(e.ac_sar, 0), 2) END AS cpi,
             CASE WHEN e.ev_sar >= 0.05 * p.budget_cost_sar THEN ROUND(e.ev_sar / NULLIF(e.pv_sar, 0), 2) END AS spi,
             ROUND(100.0 * e.ev_sar / p.budget_cost_sar, 1) AS pct_complete,
             CAST(julianday(p.forecast_finish) - julianday(p.planned_finish) AS INTEGER) AS slip_days,
             p.planned_finish, p.forecast_finish,
             (SELECT COUNT(*) FROM ncrs n WHERE n.project_no = p.project_no AND n.status = 'Open') AS open_ncrs,
             (SELECT COUNT(*) FROM change_orders c WHERE c.project_no = p.project_no) AS change_orders
      FROM projects p
      JOIN evm_weekly e ON e.project_no = p.project_no
       AND e.week_start = (SELECT MAX(week_start) FROM evm_weekly x WHERE x.project_no = p.project_no)
      ORDER BY slip_days DESC, p.project_no

  - key: fd_projects_active
    name: "FAB · Active projects: cost and schedule performance"
    datasource: default
    sql: |
      SELECT p.project_no, p.project_no || ' · ' || p.client || ' · ' || p.product_type AS project,
             p.client, p.product_type, p.status, p.project_manager, p.contract_value_sar,
             CASE WHEN e.ev_sar >= 0.05 * p.budget_cost_sar THEN ROUND(e.ev_sar / NULLIF(e.ac_sar, 0), 2) END AS cpi,
             CASE WHEN e.ev_sar >= 0.05 * p.budget_cost_sar THEN ROUND(e.ev_sar / NULLIF(e.pv_sar, 0), 2) END AS spi,
             ROUND(100.0 * e.ev_sar / p.budget_cost_sar, 1) AS pct_complete,
             CAST(julianday(p.forecast_finish) - julianday(p.planned_finish) AS INTEGER) AS slip_days,
             p.planned_finish, p.forecast_finish,
             (SELECT COUNT(*) FROM ncrs n WHERE n.project_no = p.project_no AND n.status = 'Open') AS open_ncrs,
             (SELECT COUNT(*) FROM change_orders c WHERE c.project_no = p.project_no) AS change_orders
      FROM projects p
      JOIN evm_weekly e ON e.project_no = p.project_no
       AND e.week_start = (SELECT MAX(week_start) FROM evm_weekly x WHERE x.project_no = p.project_no)
      WHERE p.status = 'Active'
      ORDER BY slip_days DESC, p.project_no

  - key: fd_portfolio_index
    name: "FAB · Active projects: CPI and SPI by week"
    datasource: default
    sql: |
      SELECT e.week_start, ROUND(SUM(e.ev_sar) / SUM(e.ac_sar), 3) AS [CPI],
             ROUND(SUM(e.ev_sar) / SUM(e.pv_sar), 3) AS [SPI]
      FROM evm_weekly e JOIN projects p ON p.project_no = e.project_no
      WHERE p.status = 'Active' AND e.pv_sar > 0
        AND julianday(e.week_start) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 182
      GROUP BY e.week_start
      ORDER BY week_start

  - key: fd_co_by_reason
    name: "FAB · Change orders by reason (approved value, SAR)"
    datasource: default
    sql: |
      SELECT reason, COUNT(*) AS change_orders, ROUND(SUM(CASE WHEN status = 'Approved' THEN value_sar ELSE 0 END)) AS approved_sar
      FROM change_orders GROUP BY reason ORDER BY approved_sar DESC

  - key: fd_co_pending
    name: "FAB · Change orders waiting for a decision"
    datasource: default
    sql: |
      SELECT COUNT(*) AS pending, ROUND(SUM(value_sar)) AS pending_value_sar,
             CAST(ROUND(AVG(days_to_decide)) AS INTEGER) AS avg_days_waiting
      FROM change_orders WHERE status = 'Pending'

  # ================================================================ SAFETY
  - key: fd_incidents_by_type
    name: "FAB · Incidents by type, last 12 months"
    datasource: default
    sql: |
      SELECT incident_type, COUNT(*) AS incidents,
             SUM(CASE WHEN classification IN ('Recordable', 'Lost time') THEN 1 ELSE 0 END) AS recordable
      FROM hse_incidents
      WHERE julianday(occurred_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365
      GROUP BY incident_type
      ORDER BY incidents DESC

  - key: fd_incident_pyramid
    name: "FAB · Incidents by severity, last 12 months"
    datasource: default
    sql: |
      SELECT classification, CASE classification WHEN 'Near miss' THEN 1 WHEN 'First aid' THEN 2
                                  WHEN 'Recordable' THEN 3 ELSE 4 END AS level, COUNT(*) AS incidents
      FROM hse_incidents
      WHERE julianday(occurred_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365
      GROUP BY classification
      ORDER BY level

  # ================================================================ AGAINST TARGET
  # The scorecard: each measure is the LATEST point of the series its own board shows
  # (the same SQL as fd_delivery_monthly, fd_supplier_monthly, fd_weld_monthly,
  # fd_welding_load, fd_portfolio_index and fd_hse_monthly; a pack test checks they agree),
  # the point before it, and the target and action floor management set for it.
  - key: fd_scorecard
    name: "FAB · Plant scorecard: latest figures against target"
    datasource: default
    sql: |
      SELECT measure, sort_order, value, previous, target, floor, unit, direction, compared_with
      FROM (
        SELECT * FROM (
          SELECT 1 AS sort_order, 'Shipments on time (3 months)' AS measure, on_time_pct AS value,
                 LAG(on_time_pct) OVER (ORDER BY month) AS previous, 90 AS target, 80 AS floor,
                 '%' AS unit, 'higher_better' AS direction, 'vs month before' AS compared_with, month AS period
          FROM (SELECT month, ROUND(100.0 * SUM(on_time) OVER w / SUM(shipped) OVER w, 1) AS on_time_pct
                FROM (SELECT substr(actual_ship, 1, 7) AS month, COUNT(*) AS shipped,
                             SUM(CASE WHEN days_late <= 3 THEN 1 ELSE 0 END) AS on_time
                      FROM shipments WHERE status = 'Shipped' AND substr(actual_ship, 1, 7) < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
                      GROUP BY substr(actual_ship, 1, 7))
                WINDOW w AS (ORDER BY month ROWS 2 PRECEDING))
          ORDER BY period DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 2, 'Supplier lines on time (3 months)', on_time_pct, LAG(on_time_pct) OVER (ORDER BY month),
                 85, 75, '%', 'higher_better', 'vs month before', month
          FROM (SELECT month, ROUND(100.0 * SUM(on_time) OVER w / SUM(received) OVER w, 1) AS on_time_pct
                FROM (SELECT substr(received_on, 1, 7) AS month, COUNT(*) AS received,
                             SUM(CASE WHEN days_late = 0 THEN 1 ELSE 0 END) AS on_time
                      FROM purchase_orders WHERE status = 'Received' AND substr(received_on, 1, 7) < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
                      GROUP BY substr(received_on, 1, 7))
                WINDOW w AS (ORDER BY month ROWS 2 PRECEDING))
          ORDER BY month DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 3, 'Weld repair rate', repair_pct, LAG(repair_pct) OVER (ORDER BY month),
                 2.5, NULL, '%', 'lower_better', 'vs month before', month
          FROM (SELECT substr(welded_on, 1, 7) AS month,
                       ROUND(100.0 * SUM(CASE WHEN result = 'Rejected' THEN 1 ELSE 0 END) / COUNT(*), 2) AS repair_pct
                FROM welds
                WHERE substr(welded_on, 1, 7) < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
                GROUP BY substr(welded_on, 1, 7)
                HAVING COUNT(*) >= 300)
          ORDER BY month DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 4, 'Welding bay load, 4 weeks ahead', load_pct, LAG(load_pct) OVER (ORDER BY week_start),
                 85, 100, '%', 'lower_better', 'vs week before', week_start
          FROM (SELECT week_start, CAST(ROUND(100.0 * load_hours / capacity_hours) AS INTEGER) AS load_pct
                FROM wc_weekly
                WHERE work_center = 'Welding bay'
                  AND julianday(week_start) <= julianday((SELECT value FROM data_info WHERE key = 'data_date')) + 28)
          ORDER BY week_start DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 5, 'Cost performance (CPI), running projects', cpi, LAG(cpi) OVER (ORDER BY week_start),
                 1.0, 0.9, 'ratio', 'higher_better', 'vs week before', week_start
          FROM (SELECT e.week_start, ROUND(SUM(e.ev_sar) / SUM(e.ac_sar), 3) AS cpi
                FROM evm_weekly e JOIN projects p ON p.project_no = e.project_no
                WHERE p.status = 'Active' AND e.pv_sar > 0
                  AND julianday(e.week_start) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 182
                GROUP BY e.week_start)
          ORDER BY week_start DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 6, 'Schedule performance (SPI), running projects', spi, LAG(spi) OVER (ORDER BY week_start),
                 1.0, 0.9, 'ratio', 'higher_better', 'vs week before', week_start
          FROM (SELECT e.week_start, ROUND(SUM(e.ev_sar) / SUM(e.pv_sar), 3) AS spi
                FROM evm_weekly e JOIN projects p ON p.project_no = e.project_no
                WHERE p.status = 'Active' AND e.pv_sar > 0
                  AND julianday(e.week_start) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 182
                GROUP BY e.week_start)
          ORDER BY week_start DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 7, 'Recordable injury rate (TRIR, 12 months)', trir_12m, LAG(trir_12m) OVER (ORDER BY month),
                 2.0, 3.0, 'ratio', 'lower_better', 'vs month before', month
          FROM (SELECT month, n, ROUND(SUM(recordables) OVER w * 200000.0 / SUM(man_hours) OVER w, 2) AS trir_12m
                FROM (SELECT month, recordables, man_hours, ROW_NUMBER() OVER (ORDER BY month) AS n
                      FROM hse_monthly
                      WHERE month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date'))
                WINDOW w AS (ORDER BY month ROWS 11 PRECEDING))
          WHERE n > 6
          ORDER BY month DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 8, 'Planned maintenance on time (3 months)', pm_on_time_3m, LAG(pm_on_time_3m) OVER (ORDER BY month),
                 90, 80, '%', 'higher_better', 'vs month before', month
          FROM v_maintenance_month
          ORDER BY month DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 9, 'Welders'' overtime', welder_overtime_pct, LAG(welder_overtime_pct) OVER (ORDER BY month),
                 10, 20, '%', 'lower_better', 'vs month before', month
          FROM v_labour_month
          ORDER BY month DESC LIMIT 1)
        UNION ALL
        SELECT * FROM (
          SELECT 10, 'Plate yield', yield_pct, LAG(yield_pct) OVER (ORDER BY month),
                 82, 78, '%', 'higher_better', 'vs month before', month
          FROM plate_yield_monthly
          WHERE month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
          ORDER BY month DESC LIMIT 1)
        UNION ALL
        SELECT 11, 'Mandatory training in date', ROUND(100.0 * SUM(up_to_date) / COUNT(*), 1), NULL,
               95, 85, '%', 'higher_better', NULL, NULL
        FROM v_certificates WHERE kind = 'Training'
      )
      ORDER BY sort_order

  # Each running project (past 5% complete, as for CPI) as a share of its budget: what it
  # has spent, what the work done is worth (earned) and what the plan said by now.
  - key: fd_project_cost
    name: "FAB · Running projects: spent against earned, % of budget"
    datasource: default
    sql: |
      SELECT p.project_no, p.client || ' · ' || p.product_type AS project_name,
             ROUND(100.0 * e.ac_sar / p.budget_cost_sar, 1) AS spent_pct,
             ROUND(100.0 * e.ev_sar / p.budget_cost_sar, 1) AS earned_pct,
             -- needs action past a cost index of 0.9 (spent more than earned / 0.9), as the scorecard
             ROUND(100.0 * e.ev_sar / p.budget_cost_sar / 0.9, 1) AS act_above_pct,
             ROUND(e.ac_sar / e.ev_sar, 3) AS spent_per_earned
      FROM projects p
      JOIN evm_weekly e ON e.project_no = p.project_no
       AND e.week_start = (SELECT MAX(week_start) FROM evm_weekly x WHERE x.project_no = p.project_no)
      WHERE p.status = 'Active' AND e.ev_sar >= 0.05 * p.budget_cost_sar
      ORDER BY spent_per_earned DESC, p.project_no

  - key: fd_project_schedule
    name: "FAB · Running projects: work done against plan, % of budget"
    datasource: default
    sql: |
      SELECT p.project_no, p.client || ' · ' || p.product_type AS project_name,
             ROUND(100.0 * e.ev_sar / p.budget_cost_sar, 1) AS earned_pct,
             ROUND(100.0 * e.pv_sar / p.budget_cost_sar, 1) AS planned_pct,
             -- needs action below a schedule index of 0.9, as the scorecard
             ROUND(0.9 * 100.0 * e.pv_sar / p.budget_cost_sar, 1) AS act_below_pct,
             ROUND(100.0 * (e.pv_sar - e.ev_sar) / p.budget_cost_sar, 1) AS behind_pts
      FROM projects p
      JOIN evm_weekly e ON e.project_no = p.project_no
       AND e.week_start = (SELECT MAX(week_start) FROM evm_weekly x WHERE x.project_no = p.project_no)
      WHERE p.status = 'Active' AND e.ev_sar >= 0.05 * p.budget_cost_sar
      ORDER BY behind_pts DESC, p.project_no

  # Spend by supplier (lines ordered in the last 12 months, as fd_spend_category), for
  # the Pareto: which few suppliers take most of the money.
  - key: fd_spend_supplier
    name: "FAB · Purchasing spend by supplier, last 12 months (SAR)"
    datasource: default
    sql: |
      SELECT supplier, category, ROUND(SUM(value_sar)) AS value_sar, COUNT(*) AS lines
      FROM purchase_orders
      WHERE julianday(ordered_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365
      GROUP BY supplier, category
      ORDER BY value_sar DESC, supplier

  # ================================================================ REGISTERS
  - key: fd_reg_ncrs
    name: "FAB · NCR register"
    datasource: default
    sql: |
      SELECT n.ncr_no, n.project_no, n.project_no || ' · ' || p.client AS project, n.category, n.severity,
             n.detected_at, n.root_cause, n.status, n.raised_on, n.closed_on, n.days_open, n.cost_sar,
             CASE WHEN n.status = 'Closed' THEN 'Closed'
                  WHEN n.days_open <= 7 THEN '0-7 days' WHEN n.days_open <= 30 THEN '8-30 days'
                  WHEN n.days_open <= 90 THEN '31-90 days' ELSE 'over 90 days' END AS age_band,
             -- the windows the boards count in, so a list behind a figure counts what it counts
             CASE WHEN julianday(n.raised_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365 THEN 1 ELSE 0 END AS raised_last_12m
      FROM ncrs n JOIN projects p ON p.project_no = n.project_no
      ORDER BY raised_on DESC, ncr_no

  - key: fd_reg_pos
    name: "FAB · Purchase-order register"
    datasource: default
    sql: |
      SELECT po_line, project_no, supplier, category, status, ordered_on, promised_on, received_on,
             value_sar, days_late,
             CASE WHEN status = 'Open' THEN 'Not due yet' WHEN days_late = 0 THEN 'On time'
                  WHEN days_late <= 7 THEN '1-7 days late' WHEN days_late <= 21 THEN '8-21 days late'
                  ELSE 'over 21 days late' END AS lateness,
             CASE WHEN julianday(ordered_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365 THEN 1 ELSE 0 END AS ordered_last_12m,
             CASE WHEN status = 'Received' AND days_late > 0
                   AND julianday(received_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365 THEN 1 ELSE 0 END AS late_last_12m
      FROM purchase_orders
      ORDER BY ordered_on DESC, po_line

  - key: fd_reg_welds
    name: "FAB · Weld log"
    datasource: default
    sql: |
      SELECT weld_no, project_no, item_no, welder, process, ndt_method, welded_on, result, repairs,
             substr(welded_on, 1, 7) AS month,
             CASE WHEN julianday(welded_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 182 THEN 1 ELSE 0 END AS welded_last_6m,
             CASE WHEN EXISTS (SELECT 1 FROM qualifications q WHERE q.person_id = w.welder AND q.process = w.process
                                AND w.welded_on > q.expires_on) THEN 1 ELSE 0 END AS on_lapsed_qualification
      FROM welds w
      ORDER BY welded_on DESC, weld_no

  - key: fd_reg_operations
    name: "FAB · Shop operations"
    datasource: default
    sql: |
      SELECT o.op_id, o.item_no, o.project_no, o.operation, o.work_center, o.status,
             o.planned_start, o.planned_finish, o.actual_start, o.actual_finish,
             o.planned_hours, o.actual_hours, o.days_late,
             CASE WHEN o.days_late = 0 THEN 'On time' WHEN o.days_late <= 7 THEN '1-7 days late'
                  WHEN o.days_late <= 21 THEN '8-21 days late' ELSE 'over 21 days late' END AS lateness,
             -- as fd_late_ops_by_wc counts "running late now", and fd_wip "waiting here"
             CASE WHEN o.status IN ('In progress', 'Not started') AND o.days_late > 0
                   AND p.status <> 'On hold' THEN 1 ELSE 0 END AS late_now,
             CASE WHEN p.status <> 'On hold'
                   AND (o.status = 'In progress' OR (o.status = 'Not started'
                        AND LAG(o.status) OVER (PARTITION BY o.item_no ORDER BY o.seq) = 'Done'))
                  THEN 1 ELSE 0 END AS waiting
      FROM operations o JOIN projects p ON p.project_no = o.project_no
      ORDER BY planned_start DESC, op_id

  # ================================================================ BUSINESS: ORDER BOOK, REVENUE, CASH
  # The warehouse's views hold the business rules (v_business_month, v_invoices, v_tenders,
  # v_stock_now, v_maintenance, v_maintenance_month, v_labour_month, v_certificates), so a
  # figure and the list behind it read one definition. Closed months only.
  - key: fd_business_month
    name: "FAB · Business by month: revenue against plan, margin, order book, cash, receivables"
    datasource: default
    sql: |
      SELECT month, revenue_sar, plan_sar, cost_sar, revenue_vs_plan_pct, margin_12m_pct, margin_plan_pct,
             receivables_sar, overdue_sar, overdue_share_pct, dso_days, cash_sar, intake_12m_sar,
             revenue_12m_sar, book_to_bill, order_book_sar, months_of_work, win_rate_12m,
             revenue_sar AS [Revenue], plan_sar AS [Plan]
      FROM v_business_month
      -- from October 2025: the 12-month measures need most of a year behind them (the
      -- company's projects in this data start in 2025)
      WHERE month >= '2025-10' AND month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
      ORDER BY month

  # The business scorecard: the latest closed month of fd_business_month against target,
  # and the month before (a pack test checks they agree).
  - key: fd_business_scorecard
    name: "FAB · Business scorecard: latest month against target"
    datasource: default
    sql: |
      SELECT k.sort_order, k.measure,
             CASE k.sort_order WHEN 1 THEN c.revenue_vs_plan_pct WHEN 2 THEN c.margin_12m_pct WHEN 3 THEN c.book_to_bill
                  WHEN 4 THEN c.months_of_work WHEN 5 THEN c.win_rate_12m WHEN 6 THEN c.dso_days
                  ELSE c.overdue_share_pct END AS value,
             CASE k.sort_order WHEN 1 THEN c.p1 WHEN 2 THEN c.p2 WHEN 3 THEN c.p3 WHEN 4 THEN c.p4 WHEN 5 THEN c.p5
                  WHEN 6 THEN c.p6 ELSE c.p7 END AS previous,
             CASE k.sort_order WHEN 2 THEN c.margin_plan_pct ELSE k.target END AS target,
             k.floor, k.unit, k.direction, 'vs month before' AS compared_with
      FROM (SELECT b.*, LAG(revenue_vs_plan_pct) OVER (ORDER BY month) AS p1, LAG(margin_12m_pct) OVER (ORDER BY month) AS p2,
                   LAG(book_to_bill) OVER (ORDER BY month) AS p3, LAG(months_of_work) OVER (ORDER BY month) AS p4,
                   LAG(win_rate_12m) OVER (ORDER BY month) AS p5, LAG(dso_days) OVER (ORDER BY month) AS p6,
                   LAG(overdue_share_pct) OVER (ORDER BY month) AS p7
            FROM v_business_month b
            WHERE month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
            ORDER BY month DESC LIMIT 1) c
      CROSS JOIN (SELECT 1 AS sort_order, 'Revenue this year against plan' AS measure, 100 AS target, 92 AS floor,
                         '%' AS unit, 'higher_better' AS direction
                  UNION ALL SELECT 2, 'Gross margin (12 months)', NULL, 18, '%', 'higher_better'
                  UNION ALL SELECT 3, 'Orders won against revenue (12 months)', 1.0, 0.8, 'ratio', 'higher_better'
                  UNION ALL SELECT 4, 'Order book, months of work', 9, 6, 'months', 'higher_better'
                  UNION ALL SELECT 5, 'Win rate (12 months)', 25, 18, '%', 'higher_better'
                  UNION ALL SELECT 6, 'Days sales outstanding', 60, 75, 'd', 'lower_better'
                  UNION ALL SELECT 7, 'Receivables overdue', 10, 20, '%', 'lower_better') k
      ORDER BY sort_order

  - key: fd_intake_quarterly
    name: "FAB · Orders won and revenue by quarter (SAR)"
    datasource: default
    sql: |
      SELECT quarter, SUM(intake_sar) AS [Orders won], SUM(revenue_sar) AS [Revenue]
      FROM (SELECT substr(month, 1, 4) || ' Q' || ((CAST(substr(month, 6, 2) AS INTEGER) + 2) / 3) AS quarter,
                   intake_sar, COALESCE(revenue_sar, 0) AS revenue_sar,
                   substr(month, 1, 4) || '-' || printf('%02d', ((CAST(substr(month, 6, 2) AS INTEGER) + 2) / 3) * 3) AS quarter_end
            FROM v_business_month WHERE month >= '2025-01')
      -- whole quarters only: a quarter's orders are never set against part of its revenue
      WHERE quarter_end < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
      GROUP BY quarter
      ORDER BY quarter

  - key: fd_revenue_ytd
    name: "FAB · Revenue this year against plan, cumulative (SAR)"
    datasource: default
    sql: |
      SELECT month, SUM(plan_sar) OVER (ORDER BY month) AS [Plan],
             CASE WHEN month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
                  THEN SUM(COALESCE(revenue_sar, 0)) OVER (ORDER BY month) END AS [Revenue]
      FROM v_business_month
      WHERE substr(month, 1, 4) = (SELECT substr(value, 1, 4) FROM data_info WHERE key = 'data_date')
      ORDER BY month

  - key: fd_revenue_client
    name: "FAB · Revenue by client, last 12 months (SAR)"
    datasource: default
    sql: |
      SELECT p.client, ROUND(SUM(r.revenue_sar)) AS revenue_sar, COUNT(DISTINCT p.project_no) AS projects
      FROM revenue_monthly r JOIN projects p ON p.project_no = r.project_no
      WHERE r.month >= substr(date((SELECT value FROM data_info WHERE key = 'data_date'), 'start of month', '-12 months'), 1, 7)
        AND r.month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
      GROUP BY p.client
      ORDER BY revenue_sar DESC, client

  # Margin fade: what each running project was bid at, and what it will make at its cost
  # performance so far (cost at completion = budget / CPI).
  - key: fd_project_margin
    name: "FAB · Running projects: margin at bid against forecast (%)"
    datasource: default
    sql: |
      SELECT project_no, client || ' · ' || product_type AS project_name, bid_margin_pct, forecast_margin_pct,
             ROUND(bid_margin_pct - 5, 1) AS act_below_pct, ROUND(bid_margin_pct - forecast_margin_pct, 1) AS fade_pts
      FROM (SELECT project_no, client, product_type,
                   ROUND(100.0 * (contract_value_sar - budget_cost_sar) / contract_value_sar, 1) AS bid_margin_pct,
                   ROUND(100.0 * (contract_value_sar - budget_cost_sar / cpi) / contract_value_sar, 1) AS forecast_margin_pct
            FROM projects WHERE status IN ('Active', 'On hold'))
      ORDER BY fade_pts DESC, project_no

  - key: fd_cash_monthly
    name: "FAB · Cash in, cash out and the balance by month (SAR)"
    datasource: default
    sql: |
      SELECT month, cash_in_sar AS [Cash in], project_spend_sar + overhead_sar AS [Cash out],
             closing_cash_sar
      FROM cash_monthly
      WHERE month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
      ORDER BY month

  - key: fd_finance_now
    name: "FAB · Receivables, overdue, disputed, retention held and unbilled work now (SAR)"
    datasource: default
    sql: |
      SELECT ROUND(SUM(CASE WHEN paid_on IS NULL THEN amount_sar END)) AS receivables_sar,
             ROUND(SUM(CASE WHEN overdue_now = 1 THEN amount_sar END)) AS overdue_sar,
             SUM(overdue_now) AS overdue_invoices,
             ROUND(SUM(CASE WHEN status = 'Disputed' THEN amount_sar END)) AS disputed_sar,
             ROUND(SUM(CASE WHEN invoice_type = 'Progress' THEN retention_sar ELSE 0 END)
                   - SUM(CASE WHEN invoice_type = 'Retention release' THEN gross_sar ELSE 0 END)) AS retention_held_sar,
             (SELECT ROUND(SUM(revenue_sar)) FROM revenue_monthly)
               - ROUND(SUM(CASE WHEN invoice_type = 'Progress' THEN gross_sar ELSE 0 END)) AS unbilled_sar
      FROM v_invoices

  - key: fd_ar_aging
    name: "FAB · Unpaid invoices by age (SAR)"
    datasource: default
    sql: |
      SELECT age_band, band_order, COUNT(*) AS invoices, ROUND(SUM(amount_sar)) AS amount_sar
      FROM v_invoices WHERE paid_on IS NULL
      GROUP BY age_band, band_order
      ORDER BY band_order

  - key: fd_overdue_client
    name: "FAB · Overdue invoices by client (SAR)"
    datasource: default
    sql: |
      SELECT client, ROUND(SUM(amount_sar)) AS overdue_sar, COUNT(*) AS invoices,
             CAST(ROUND(AVG(days_overdue)) AS INTEGER) AS avg_days_overdue
      FROM v_invoices WHERE overdue_now = 1
      GROUP BY client
      ORDER BY overdue_sar DESC, client

  - key: fd_pay_days_matrix
    name: "FAB · Days paid after the due date, by client and quarter invoiced"
    datasource: default
    sql: |
      SELECT client, issued_quarter, CAST(ROUND(AVG(days_late_paid)) AS INTEGER) AS days_late, COUNT(*) AS invoices
      FROM v_invoices
      WHERE invoice_type = 'Progress' AND paid_on IS NOT NULL AND issued_on >= '2025-07-01'
      GROUP BY client, issued_quarter
      ORDER BY issued_quarter, client

  - key: fd_project_billing
    name: "FAB · Projects: earned, billed, unbilled, retention held and unpaid (SAR)"
    datasource: default
    sql: |
      SELECT project_no, project, client, status, earned_sar, billed_sar, unbilled_sar, retention_held_sar,
             unpaid_sar, disputed_sar, unbilled_sar + unpaid_sar AS waiting_sar
      FROM (SELECT p.project_no, p.project_no || ' · ' || p.client AS project, p.client, p.status,
                   ROUND(e.earned) AS earned_sar, ROUND(COALESCE(b.billed, 0)) AS billed_sar,
                   ROUND(e.earned - COALESCE(b.billed, 0)) AS unbilled_sar,
                   ROUND(COALESCE(b.retained, 0) - COALESCE(b.released, 0)) AS retention_held_sar,
                   ROUND(COALESCE(b.unpaid, 0)) AS unpaid_sar, ROUND(COALESCE(b.disputed, 0)) AS disputed_sar
            FROM projects p
            JOIN (SELECT project_no, SUM(revenue_sar) AS earned FROM revenue_monthly GROUP BY project_no) e
              ON e.project_no = p.project_no
            LEFT JOIN (SELECT project_no,
                              SUM(CASE WHEN invoice_type = 'Progress' THEN gross_sar END) AS billed,
                              SUM(CASE WHEN invoice_type = 'Progress' THEN retention_sar END) AS retained,
                              SUM(CASE WHEN invoice_type = 'Retention release' THEN gross_sar END) AS released,
                              SUM(CASE WHEN paid_on IS NULL THEN amount_sar END) AS unpaid,
                              SUM(CASE WHEN status = 'Disputed' THEN amount_sar END) AS disputed
                       FROM invoices GROUP BY project_no) b ON b.project_no = p.project_no)
      ORDER BY waiting_sar DESC, project_no

  # ================================================================ SALES
  - key: fd_sales_now
    name: "FAB · Open tenders, weighted pipeline, price gap and client satisfaction"
    datasource: default
    sql: |
      SELECT ROUND(SUM(CASE WHEN outcome = 'Open' THEN value_sar END)) AS pipeline_sar,
             ROUND(SUM(weighted_sar)) AS weighted_sar,
             SUM(CASE WHEN outcome = 'Open' THEN 1 ELSE 0 END) AS open_tenders,
             ROUND(AVG(CASE WHEN lost_last_12m = 1 AND loss_reason = 'Price' THEN price_gap_pct END), 1) AS price_gap_pct,
             SUM(CASE WHEN submitted_on > date((SELECT value FROM data_info WHERE key = 'data_date'), '-12 months') THEN 1 ELSE 0 END) AS bids_12m,
             (SELECT ROUND(AVG(overall), 1) FROM client_feedback) AS client_score,
             (SELECT ROUND(100.0 * AVG(would_recommend)) FROM client_feedback) AS recommend_pct
      FROM v_tenders

  - key: fd_tender_funnel
    name: "FAB · Tenders decided in the last 12 months: received, bid, shortlisted, won"
    datasource: default
    sql: |
      SELECT stage_order, stage, tenders FROM (
        SELECT 1 AS stage_order, 'Tenders received' AS stage, COUNT(*) AS tenders FROM v_tenders WHERE decided_last_12m = 1
        UNION ALL SELECT 2, 'Bid', COUNT(*) FROM v_tenders WHERE decided_last_12m = 1 AND stage_reached >= 2
        UNION ALL SELECT 3, 'Shortlisted', COUNT(*) FROM v_tenders WHERE decided_last_12m = 1 AND stage_reached >= 3
        UNION ALL SELECT 4, 'Won', COUNT(*) FROM v_tenders WHERE decided_last_12m = 1 AND status = 'Won')
      ORDER BY stage_order

  - key: fd_win_rate_margin
    name: "FAB · Win rate by the margin we priced, bids decided in the last 24 months"
    datasource: default
    sql: |
      SELECT margin_band, margin_band_order, COUNT(*) AS bids, SUM(CASE WHEN status = 'Won' THEN 1 ELSE 0 END) AS won,
             ROUND(100.0 * SUM(CASE WHEN status = 'Won' THEN 1 ELSE 0 END) / COUNT(*), 1) AS win_rate_pct
      FROM v_tenders WHERE decided_bid_24m = 1
      GROUP BY margin_band, margin_band_order
      ORDER BY margin_band_order

  - key: fd_win_rate_product
    name: "FAB · Win rate by product, bids decided in the last 24 months"
    datasource: default
    sql: |
      SELECT product_type, COUNT(*) AS bids, SUM(CASE WHEN status = 'Won' THEN 1 ELSE 0 END) AS won,
             ROUND(100.0 * SUM(CASE WHEN status = 'Won' THEN 1 ELSE 0 END) / COUNT(*), 1) AS win_rate_pct
      FROM v_tenders WHERE decided_bid_24m = 1
      GROUP BY product_type
      ORDER BY win_rate_pct DESC, product_type

  - key: fd_loss_reasons
    name: "FAB · Why we lost, last 12 months"
    datasource: default
    sql: |
      SELECT loss_reason, COUNT(*) AS tenders, ROUND(SUM(value_sar)) AS value_sar
      FROM v_tenders WHERE lost_last_12m = 1
      GROUP BY loss_reason
      ORDER BY tenders DESC, loss_reason

  - key: fd_lost_to
    name: "FAB · Who won what we lost, last 12 months (SAR)"
    datasource: default
    sql: |
      SELECT competitor, ROUND(SUM(value_sar)) AS value_sar, COUNT(*) AS tenders
      FROM v_tenders WHERE lost_last_12m = 1
      GROUP BY competitor
      ORDER BY value_sar DESC, competitor

  - key: fd_pipeline_stage
    name: "FAB · Open tenders by stage (SAR)"
    datasource: default
    sql: |
      SELECT status, CASE status WHEN 'In preparation' THEN 1 WHEN 'Submitted' THEN 2 ELSE 3 END AS stage_order,
             COUNT(*) AS tenders, ROUND(SUM(value_sar)) AS value_sar, ROUND(SUM(weighted_sar)) AS weighted_sar
      FROM v_tenders WHERE outcome = 'Open'
      GROUP BY status
      ORDER BY stage_order

  - key: fd_client_feedback
    name: "FAB · What clients said at handover (score out of 10)"
    datasource: default
    sql: |
      SELECT f.project_no, f.project_no || ' · ' || f.client AS project, f.overall, f.delivery, f.quality,
             f.communication, CASE WHEN f.would_recommend = 1 THEN 'would recommend us' ELSE 'would not recommend us yet' END AS recommend
      FROM client_feedback f
      ORDER BY overall, project_no

  - key: fd_pipeline_open
    name: "FAB · Open tenders"
    datasource: default
    sql: |
      SELECT tender_no, client, title, status, value_sar, win_probability_pct, weighted_sar, margin_pct,
             submitted_on, received_on, estimator
      FROM v_tenders WHERE outcome = 'Open'
      ORDER BY value_sar DESC, tender_no

  # ================================================================ MATERIALS AND STOCK
  - key: fd_stock_month
    name: "FAB · Stock value, what was used, and stock turns by month (SAR)"
    datasource: default
    sql: |
      SELECT month, stock_sar, used_sar,
             ROUND(SUM(used_sar) OVER w / AVG(stock_sar) OVER w, 1) AS turns_12m,
             stock_sar AS [Stock value], used_sar AS [Used]
      FROM (SELECT month, SUM(closing_value_sar) AS stock_sar, SUM(issued_value_sar) AS used_sar
            FROM stock_monthly
            WHERE month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
            GROUP BY month)
      WINDOW w AS (ORDER BY month ROWS 11 PRECEDING)
      ORDER BY month

  - key: fd_stock_status
    name: "FAB · Stock items by status now (SAR)"
    datasource: default
    sql: |
      SELECT stock_status, status_order, COUNT(*) AS items, ROUND(SUM(value_sar)) AS value_sar
      FROM v_stock_now
      GROUP BY stock_status, status_order
      ORDER BY status_order

  - key: fd_stock_tied_up
    name: "FAB · Money tied up in stock that does not move (SAR)"
    datasource: default
    sql: |
      SELECT description, sku, stock_status, value_sar, days_since_issue, weeks_of_cover, reserved_for
      FROM v_stock_now WHERE tied_up = 1
      ORDER BY value_sar DESC, sku

  - key: fd_stockouts_month
    name: "FAB · Stock-outs started by month"
    datasource: default
    sql: |
      SELECT c.month, (SELECT COUNT(*) FROM stockouts s WHERE substr(s.started_on, 1, 7) = c.month) AS stockouts,
             (SELECT COALESCE(SUM(days), 0) FROM stockouts s WHERE substr(s.started_on, 1, 7) = c.month) AS days_short
      FROM calendar_months c
      WHERE c.month >= '2025-01' AND c.month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
      ORDER BY month

  - key: fd_stockouts_supplier
    name: "FAB · Days out of stock by supplier, last 12 months"
    datasource: default
    sql: |
      SELECT i.main_supplier AS supplier, SUM(s.days) AS days_short, COUNT(*) AS stockouts
      FROM stockouts s JOIN stock_items i ON i.sku = s.sku
      WHERE julianday(s.started_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365
      GROUP BY i.main_supplier
      ORDER BY days_short DESC, supplier

  - key: fd_stockout_list
    name: "FAB · Stock-outs"
    datasource: default
    sql: |
      SELECT s.stockout_no, s.sku, i.description, i.category, i.main_supplier AS supplier, s.started_on,
             s.ended_on, s.days, s.short_qty, i.uom,
             CASE WHEN s.ended_on IS NULL THEN 'Still out' ELSE 'Back in stock' END AS state,
             CASE WHEN julianday(s.started_on) > julianday((SELECT value FROM data_info WHERE key = 'data_date')) - 365 THEN 1 ELSE 0 END AS started_last_12m
      FROM stockouts s JOIN stock_items i ON i.sku = s.sku
      ORDER BY started_on DESC, stockout_no

  - key: fd_plate_yield
    name: "FAB · Plate yield by month (% of plate cut that became parts)"
    datasource: default
    sql: |
      SELECT month, plate_cut_t, scrap_t, offcut_reused_t, yield_pct
      FROM plate_yield_monthly
      WHERE month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
      ORDER BY month

  - key: fd_stock_category
    name: "FAB · Stock value by category now (SAR)"
    datasource: default
    sql: |
      SELECT category, ROUND(SUM(value_sar)) AS value_sar, COUNT(*) AS items
      FROM v_stock_now GROUP BY category
      ORDER BY value_sar DESC, category

  # ================================================================ MAINTENANCE AND EQUIPMENT
  - key: fd_maint_month
    name: "FAB · Maintenance by month: planned maintenance on time, breakdowns, cost"
    datasource: default
    sql: |
      SELECT month, pm_due, pm_on_time, pm_on_time_pct, pm_on_time_3m, breakdowns, downtime_hours, planned_share_pct,
             preventive_cost_sar AS [Planned maintenance], breakdown_cost_sar AS [Breakdown repairs],
             inspection_cost_sar AS [Inspections]
      FROM v_maintenance_month
      ORDER BY month

  - key: fd_maint_now
    name: "FAB · Maintenance now: open breakdowns, overdue work, certificates due"
    datasource: default
    sql: |
      SELECT (SELECT COUNT(*) FROM maintenance_orders WHERE wo_type = 'Breakdown' AND status = 'Open') AS open_breakdowns,
             (SELECT COUNT(*) FROM maintenance_orders WHERE status = 'Overdue') AS overdue_orders,
             (SELECT COUNT(*) FROM assets WHERE certificate IS NOT NULL
                 AND julianday(certificate_expires_on) - julianday((SELECT value FROM data_info WHERE key = 'data_date')) <= 30) AS certificates_due,
             (SELECT COUNT(*) FROM assets WHERE certificate IS NOT NULL
                 AND certificate_expires_on < (SELECT value FROM data_info WHERE key = 'data_date')) AS certificates_expired

  - key: fd_certificates
    name: "FAB · Equipment certificates: lifting, pressure and calibration"
    datasource: default
    sql: |
      SELECT asset_id, asset_id || ' · ' || asset AS asset, certificate,
             CASE certificate WHEN 'Lifting inspection (12 months)' THEN 'Lifting' WHEN 'Pressure receiver (24 months)' THEN 'Pressure'
                  ELSE 'Calibration' END AS kind,
             last_certified_on, certificate_expires_on, days_left,
             CASE WHEN days_left < 0 THEN 'Expired' WHEN days_left <= 30 THEN 'Due within 30 days'
                  WHEN days_left <= 90 THEN 'Due within 90 days' ELSE 'Valid' END AS state
      FROM (SELECT a.*, CAST(julianday(a.certificate_expires_on) - julianday((SELECT value FROM data_info WHERE key = 'data_date')) AS INTEGER) AS days_left
            FROM assets a WHERE a.certificate IS NOT NULL)
      ORDER BY days_left, asset_id

  - key: fd_downtime_asset
    name: "FAB · Breakdown downtime by machine, last 12 months (hours)"
    datasource: default
    sql: |
      SELECT asset, asset_id, ROUND(SUM(downtime_hours), 1) AS downtime_hours, COUNT(*) AS breakdowns
      FROM v_maintenance WHERE wo_type = 'Breakdown' AND raised_last_12m = 1
      GROUP BY asset, asset_id
      ORDER BY downtime_hours DESC, asset_id

  - key: fd_failure_modes
    name: "FAB · Breakdown downtime by cause, last 12 months (hours)"
    datasource: default
    sql: |
      SELECT failure_mode, ROUND(SUM(downtime_hours), 1) AS downtime_hours, COUNT(*) AS breakdowns
      FROM v_maintenance WHERE wo_type = 'Breakdown' AND raised_last_12m = 1
      GROUP BY failure_mode
      ORDER BY downtime_hours DESC, failure_mode

  # OEE (availability x performance x quality) of the key machines: the last 3 closed
  # months against the 3 before.
  - key: fd_oee
    name: "FAB · Key machines: overall equipment effectiveness (OEE), last 3 months"
    datasource: default
    sql: |
      SELECT * FROM (
      SELECT a.asset_id || ' · ' || a.asset AS asset, cur.oee_pct AS oee_pct, prev.oee_pct AS previous_oee_pct,
             cur.availability_pct, 75 AS target, 60 AS floor, 'vs the 3 months before' AS compared_with
      FROM assets a
      JOIN (SELECT asset_id,
                   ROUND(100.0 * (SUM(planned_hours) - SUM(downtime_hours)) / SUM(planned_hours), 1) AS availability_pct,
                   ROUND(100.0 * (SUM(planned_hours) - SUM(downtime_hours)) / SUM(planned_hours)
                         * AVG(performance_pct) / 100 * AVG(quality_pct) / 100, 1) AS oee_pct
            FROM asset_monthly
            WHERE month >= substr(date((SELECT value FROM data_info WHERE key = 'data_date'), 'start of month', '-3 months'), 1, 7)
              AND month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
            GROUP BY asset_id) cur ON cur.asset_id = a.asset_id
      LEFT JOIN (SELECT asset_id,
                        ROUND(100.0 * (SUM(planned_hours) - SUM(downtime_hours)) / SUM(planned_hours)
                              * AVG(performance_pct) / 100 * AVG(quality_pct) / 100, 1) AS oee_pct
                 FROM asset_monthly
                 WHERE month >= substr(date((SELECT value FROM data_info WHERE key = 'data_date'), 'start of month', '-6 months'), 1, 7)
                   AND month < substr(date((SELECT value FROM data_info WHERE key = 'data_date'), 'start of month', '-3 months'), 1, 7)
                 GROUP BY asset_id) prev ON prev.asset_id = a.asset_id)
      ORDER BY oee_pct, asset

  - key: fd_reliability
    name: "FAB · Machines: breakdowns, time between failures and time to repair, last 12 months"
    datasource: default
    sql: |
      SELECT a.asset_id || ' · ' || a.asset AS asset, a.criticality, a.installed_year,
             COUNT(o.wo_no) AS breakdowns, ROUND(COALESCE(SUM(o.downtime_hours), 0), 1) AS downtime_hours,
             CASE WHEN COUNT(o.wo_no) > 0 THEN ROUND(365.0 / COUNT(o.wo_no), 1) END AS mtbf_days,
             CASE WHEN COUNT(o.wo_no) > 0 THEN ROUND(SUM(o.downtime_hours) / COUNT(o.wo_no), 1) END AS mttr_hours,
             ROUND(COALESCE(SUM(o.cost_sar), 0)) AS repair_cost_sar
      FROM assets a
      LEFT JOIN v_maintenance o ON o.asset_id = a.asset_id AND o.wo_type = 'Breakdown' AND o.raised_last_12m = 1
      GROUP BY a.asset_id, a.asset, a.criticality, a.installed_year
      ORDER BY downtime_hours DESC, asset

  # ================================================================ WORKFORCE AND COMPETENCE
  - key: fd_labour_month
    name: "FAB · Shop workforce by month: headcount, overtime, absence, attrition"
    datasource: default
    sql: |
      SELECT month, headcount, overtime_pct, welder_overtime_pct, absence_pct, leavers, attrition_12m_pct,
             welder_overtime_pct AS [Welders], overtime_pct AS [All trades],
             own_staff AS [Own staff], agency AS [Agency]
      FROM v_labour_month
      ORDER BY month

  - key: fd_headcount_trade
    name: "FAB · Headcount by trade, last month: own staff and agency"
    datasource: default
    sql: |
      SELECT trade, SUM(CASE WHEN employment = 'Own staff' THEN headcount ELSE 0 END) AS [Own staff],
             SUM(CASE WHEN employment = 'Agency' THEN headcount ELSE 0 END) AS [Agency], SUM(headcount) AS total
      FROM labour_monthly
      WHERE month = (SELECT MAX(month) FROM labour_monthly WHERE month < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date'))
      GROUP BY trade
      ORDER BY total DESC, trade

  - key: fd_qualification_expiry
    name: "FAB · Qualifications and certificates by when they lapse"
    datasource: default
    sql: |
      SELECT expiry_band, band_order, COUNT(*) AS records
      FROM v_certificates WHERE kind = 'Qualification'
      GROUP BY expiry_band, band_order
      ORDER BY band_order

  - key: fd_training_compliance
    name: "FAB · Mandatory training up to date, by course (%)"
    datasource: default
    sql: |
      SELECT name AS course, COUNT(*) AS people, SUM(up_to_date) AS up_to_date,
             ROUND(100.0 * SUM(up_to_date) / COUNT(*), 1) AS compliance_pct, 95 AS target, 85 AS floor
      FROM v_certificates WHERE kind = 'Training'
      GROUP BY name
      ORDER BY compliance_pct, course

  - key: fd_training_employment
    name: "FAB · Mandatory training up to date: own staff and agency (%)"
    datasource: default
    sql: |
      SELECT employment, COUNT(*) AS records, COUNT(*) - SUM(up_to_date) AS not_up_to_date,
             ROUND(100.0 * SUM(up_to_date) / COUNT(*), 1) AS compliance_pct
      FROM v_certificates WHERE kind = 'Training'
      GROUP BY employment
      ORDER BY compliance_pct, employment

  - key: fd_people_now
    name: "FAB · People now: training up to date, qualifications due, welds on a lapsed qualification"
    datasource: default
    sql: |
      SELECT (SELECT ROUND(100.0 * SUM(up_to_date) / COUNT(*), 1) FROM v_certificates WHERE kind = 'Training') AS training_pct,
             (SELECT COUNT(*) FROM v_certificates WHERE kind = 'Qualification' AND expiry_band IN ('Lapsed', 'Within 30 days')) AS qualifications_due,
             (SELECT COUNT(*) FROM welds w JOIN qualifications q ON q.person_id = w.welder AND q.process = w.process
               WHERE w.welded_on > q.expires_on) AS welds_on_lapsed

  - key: fd_productivity
    name: "FAB · Hours earned per hour worked by month (shop operations finished)"
    datasource: default
    sql: |
      SELECT substr(actual_finish, 1, 7) AS month, ROUND(SUM(planned_hours)) AS earned_hours,
             ROUND(SUM(actual_hours)) AS worked_hours, ROUND(SUM(planned_hours) / SUM(actual_hours), 2) AS productivity
      FROM operations
      WHERE status = 'Done' AND actual_hours > 0
        AND substr(actual_finish, 1, 7) < (SELECT substr(value, 1, 7) FROM data_info WHERE key = 'data_date')
      GROUP BY substr(actual_finish, 1, 7)
      HAVING SUM(actual_hours) >= 500
      ORDER BY month

  # ================================================================ BUSINESS REGISTERS
  - key: fd_reg_tenders
    name: "FAB · Tender register"
    datasource: default
    sql: |
      SELECT tender_no, title, client, client_sector, product_type, estimator, status, outcome, received_on, submitted_on,
             decided_on, value_sar, margin_pct, margin_band, win_probability_pct, weighted_sar, loss_reason, price_gap_pct,
             competitor, project_no, planned_start, lost_last_12m, decided_bid_24m
      FROM v_tenders
      ORDER BY received_on DESC, tender_no

  - key: fd_reg_invoices
    name: "FAB · Invoice register"
    datasource: default
    sql: |
      SELECT invoice_no, project_no, client, invoice_type, period, status, age_band, issued_on, due_on, paid_on,
             terms_days, gross_sar, retention_sar, advance_recovery_sar, amount_sar, days_late_paid, days_overdue,
             issued_quarter, overdue_now, CASE WHEN paid_on IS NULL THEN 1 ELSE 0 END AS unpaid
      FROM v_invoices
      ORDER BY issued_on DESC, invoice_no

  - key: fd_reg_stock
    name: "FAB · Stock register"
    datasource: default
    sql: |
      SELECT sku, description, category, stock_status, uom, on_hand_qty, unit_cost_sar, value_sar, safety_stock,
             reorder_point, weekly_use_now, weeks_of_cover, last_issued_on, days_since_issue, last_received_on,
             main_supplier, lead_days, reserved_for, tied_up
      FROM v_stock_now
      ORDER BY value_sar DESC, sku

  - key: fd_reg_maintenance
    name: "FAB · Maintenance work orders"
    datasource: default
    sql: |
      SELECT wo_no, asset_id, asset, asset_class, work_center, criticality, wo_type, status, raised_on, due_on,
             completed_on, days_late, downtime_hours, cost_sar, failure_mode, raised_last_12m, raised_last_3_months
      FROM v_maintenance
      ORDER BY raised_on DESC, wo_no

  - key: fd_reg_certificates
    name: "FAB · Qualifications and training"
    datasource: default
    sql: |
      SELECT record_id, person_id, trade, employment, kind, name, process, done_on, expires_on, days_left,
             expiry_band, band_order, up_to_date
      FROM v_certificates
      ORDER BY band_order, expires_on, person_id, name

dashboards:
  # ======================================================================== BUSINESS OVERVIEW
  # The managing director's page: is the order book refilling, are we on plan and on
  # margin, and is the cash coming in?
  - key: fab_business
    name: "Business Overview"
    nav_group: "Fabrication demo"
    position: 195
    description: "Demonstration data. Are we winning enough work, earning on it, and getting paid?"
    widgets:
      - {title: "The business this month", type: text, config: {content: "Is the order book refilling, are we on plan, and is the cash coming in? Each card is the last closed month against the one before."}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Order book", type: kpi, dataset: fd_business_month, config: {value_field: months_of_work, trend_field: months_of_work, value_from: last, unit: months, direction: higher_better, label: "Order book, months of work", delta_label: "vs month before", thresholds: [{op: lt, value: 6, color: red, label: "Under 6 months"}, {op: lt, value: 9, color: amber, label: "Under the 9-month target"}, {op: gte, value: 9, color: green, label: "On target"}], caption: "Work won and not yet earned, at the last three months' rate of revenue."}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Revenue against plan", type: kpi, dataset: fd_business_month, config: {value_field: revenue_vs_plan_pct, trend_field: revenue_vs_plan_pct, value_from: last, unit: "%", direction: higher_better, label: "Revenue this year, % of plan", delta_label: "vs month before", thresholds: [{op: lt, value: 92, color: red, label: "More than 8% short"}, {op: lt, value: 100, color: amber, label: "Below plan"}, {op: gte, value: 100, color: green, label: "On plan"}], caption: "Revenue earned so far this year against the plan for the same months."}, layout: {x: 3, y: 2, w: 3, h: 5}}
      - {title: "Gross margin", type: kpi, dataset: fd_business_month, config: {value_field: margin_12m_pct, trend_field: margin_12m_pct, value_from: last, unit: "%", direction: higher_better, label: "Gross margin, 12 months", delta_label: "vs month before", thresholds: [{op: lt, value: 18, color: red, label: "Below 18%"}, {op: lt, value: 22, color: amber, label: "Below the 22% plan"}, {op: gte, value: 22, color: green, label: "On plan"}], caption: "Revenue less the cost of the work, before overheads."}, layout: {x: 6, y: 2, w: 3, h: 5}}
      - {title: "Days sales outstanding", type: kpi, dataset: fd_business_month, config: {value_field: dso_days, trend_field: dso_days, value_from: last, unit: d, direction: lower_better, label: "Days sales outstanding", delta_label: "vs month before", thresholds: [{op: gt, value: 75, color: red, label: "Over 75 days"}, {op: gt, value: 60, color: amber, label: "Over the 60-day target"}, {op: lte, value: 60, color: green, label: "Within target"}], caption: "Unpaid invoices, in days of revenue."}, layout: {x: 9, y: 2, w: 3, h: 5}}
      - {title: "Orders won against revenue", type: kpi, dataset: fd_business_month, config: {value_field: book_to_bill, trend_field: book_to_bill, value_from: last, unit: ratio, direction: higher_better, label: "Orders won against revenue (12 months)", delta_label: "vs month before", thresholds: [{op: lt, value: 0.8, color: red, label: "Book shrinking fast"}, {op: lt, value: 1, color: amber, label: "Book shrinking"}, {op: gte, value: 1, color: green, label: "Book growing"}], caption: "Below 1.0 the order book shrinks."}, layout: {x: 0, y: 7, w: 3, h: 5}}
      - {title: "Win rate", type: kpi, dataset: fd_business_month, config: {value_field: win_rate_12m, trend_field: win_rate_12m, value_from: last, unit: "%", direction: higher_better, label: "Tenders won, 12 months", delta_label: "vs month before", thresholds: [{op: lt, value: 18, color: red, label: "Below 18%"}, {op: lt, value: 25, color: amber, label: "Below the 25% target"}, {op: gte, value: 25, color: green, label: "On target"}], caption: "Won as a share of the bids decided (won or lost)."}, layout: {x: 3, y: 7, w: 3, h: 5}}
      - {title: "Overdue invoices", type: kpi, dataset: fd_finance_now, config: {value_field: overdue_sar, rollup: sum, unit: SAR, direction: lower_better, label: "Invoices past their due date", caption: "Disputed invoices included.", drill: {dataset: fd_reg_invoices, filters: [{column: overdue_now, value: 1}], title: "Overdue invoices", label: "See them"}}, layout: {x: 6, y: 7, w: 3, h: 5}}
      - {title: "Cash", type: kpi, dataset: fd_business_month, config: {value_field: cash_sar, trend_field: cash_sar, value_from: last, unit: SAR, direction: higher_better, label: "Cash at month end", delta_label: "vs month before"}, layout: {x: 9, y: 7, w: 3, h: 5}}
      - {title: "Business scorecard", type: bullet, dataset: fd_business_scorecard, config: {category_field: measure, value_field: value, target_field: target, floor_field: floor, unit_field: unit, direction_field: direction, previous_field: previous, compared_field: compared_with, caption: "The last closed month against the targets in the business plan. Grey is short of target, darker grey needs action."}, layout: {x: 0, y: 12, w: 12, h: 10}}

      - {title: "Winning work", type: text, config: {content: "Are we winning work as fast as we earn it? When we are not, the order book empties and the shop runs out of work some months later."}, layout: {x: 0, y: 22, w: 12, h: 2}}
      - {title: "Orders won and revenue by quarter", type: bar, dataset: fd_intake_quarterly, config: {category_field: quarter, value_fields: ["Orders won", "Revenue"], unit: SAR, rollup: none, tones: {"Revenue": neutral}, caption: "Whole quarters. Revenue is the work earned; orders won refill the book."}, layout: {x: 0, y: 24, w: 7, h: 10}}
      - {title: "Order book, months of work", type: line, dataset: fd_business_month, config: {category_field: month, category_format: month, value_field: months_of_work, unit: months, rollup: none, reference: {value: 9, label: "Target 9 months"}, caption: "Work won and not yet earned, at the current rate of revenue."}, layout: {x: 7, y: 24, w: 5, h: 10}}

      - {title: "Earning and margin", type: text, config: {content: "Are we on the year's plan, where does the revenue come from, and are projects keeping the margin they were bid at?"}, layout: {x: 0, y: 34, w: 12, h: 2}}
      - {title: "Revenue this year against plan", type: line, dataset: fd_revenue_ytd, config: {category_field: month, category_format: month, value_fields: ["Plan", "Revenue"], unit: SAR, rollup: none, tones: {"Plan": neutral}, caption: "Cumulative, closed months."}, layout: {x: 0, y: 36, w: 6, h: 10}}
      - {title: "Where the revenue comes from", type: pareto, dataset: fd_revenue_client, config: {category_field: client, value_field: revenue_sar, unit: SAR, items: clients, what: "the revenue", caption: "Revenue earned in the last 12 months, by client. A spread book is safer: no single client can stop the shop."}, layout: {x: 6, y: 36, w: 6, h: 10}}
      - {title: "Margin at bid against forecast", type: bullet, dataset: fd_project_margin, config: {category_field: project_no, name_field: project_name, value_field: forecast_margin_pct, target_field: bid_margin_pct, floor_field: act_below_pct, unit: "%", direction: higher_better, value_label: "Forecast", target_label: "bid", words: {miss: "{gap} below the bid", met: "at or above the bid"}, caption: "Running projects. Bar: the margin each will make at its cost performance so far. Tick: the margin it was bid at."}, layout: {x: 0, y: 46, w: 7, h: 14}}
      - {title: "Cash at month end", type: line, dataset: fd_cash_monthly, config: {category_field: month, category_format: month, value_field: closing_cash_sar, unit: SAR, rollup: none, caption: "Lowest in April 2026, when receivables peaked."}, layout: {x: 7, y: 46, w: 5, h: 14}}

  # ======================================================================== PLANT OVERVIEW
  - key: fab_overview
    name: "Plant Overview"
    nav_group: "Fabrication demo"
    position: 200
    description: "Demonstration data. Is the plant delivering on time, at quality, on cost and safely?"
    widgets:
      - {title: "This month at a glance", type: text, config: {content: "Delivery, quality, supply, load and safety: each card compares the last full month with the one before."}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "On-time delivery", type: kpi, dataset: fd_delivery_monthly, config: {value_field: on_time_pct, trend_field: on_time_pct, value_from: last, unit: "%", direction: higher_better, label: "Shipments on time (3 months)", delta_label: "vs month before", thresholds: [{op: lt, value: 80, color: red, label: "Below 80%"}, {op: lt, value: 90, color: amber, label: "Below 90% target"}, {op: gte, value: 90, color: green, label: "On target"}], caption: "Shipped within 3 days of the planned date."}, layout: {x: 0, y: 2, w: 4, h: 5}}
      - {title: "Weld repair rate", type: kpi, dataset: fd_weld_monthly, config: {value_field: repair_pct, trend_field: repair_pct, value_from: last, unit: "%", direction: lower_better, label: "Weld repair rate", delta_label: "vs month before", thresholds: [{op: gt, value: 2.5, color: red, label: "Above 2.5% target"}, {op: lte, value: 2.5, color: green, label: "Within target"}], caption: "Welds rejected at NDT."}, layout: {x: 4, y: 2, w: 4, h: 5}}
      - {title: "Open NCRs", type: kpi, dataset: fd_ncr_open, config: {value_field: open_ncrs, rollup: sum, direction: lower_better, label: "Open non-conformances", drill: {dataset: fd_reg_ncrs, filters: [{column: status, value: Open}], title: "Open NCRs", label: "See them"}}, layout: {x: 8, y: 2, w: 4, h: 5}}
      - {title: "Supplier on-time", type: kpi, dataset: fd_supplier_monthly, config: {value_field: on_time_pct, trend_field: on_time_pct, value_from: last, unit: "%", direction: higher_better, label: "Supplier lines on time (3 months)", delta_label: "vs month before", thresholds: [{op: lt, value: 75, color: red, label: "Below 75%"}, {op: lt, value: 85, color: amber, label: "Below 85% target"}, {op: gte, value: 85, color: green, label: "On target"}], caption: "Purchase-order lines received by the promised date."}, layout: {x: 0, y: 7, w: 4, h: 5}}
      - {title: "Welding bay load", type: kpi, dataset: fd_welding_load, config: {value_field: load_pct, trend_field: load_pct, value_from: last, unit: "%", label: "Welding bay load, 4 weeks ahead", delta_label: "vs week before", thresholds: [{op: gt, value: 100, color: red, label: "Over capacity"}, {op: gt, value: 85, color: amber, label: "Near capacity"}, {op: lte, value: 85, color: green, label: "Within target"}], caption: "The plant's constraint: planned hours against hours available."}, layout: {x: 4, y: 7, w: 4, h: 5}}
      - {title: "Recordable injury rate", type: kpi, dataset: fd_hse_monthly, config: {value_field: trir_12m, trend_field: trir_12m, value_from: last, unit: ratio, direction: lower_better, label: "Recordable injury rate (TRIR, 12 months)", delta_label: "vs month before", thresholds: [{op: gt, value: 3, color: red, label: "Above 3.0"}, {op: gt, value: 2, color: amber, label: "Above 2.0 target"}, {op: lte, value: 2, color: green, label: "Within target"}], caption: "Recordable injuries per 200,000 hours worked."}, layout: {x: 8, y: 7, w: 4, h: 5}}

      - {title: "Cost and schedule", type: text, config: {content: "Are we earning what we spend, and are projects on time?"}, layout: {x: 0, y: 12, w: 12, h: 2}}
      - {title: "Planned value, earned value and actual cost", type: line, dataset: fd_evm_portfolio, config: {category_field: week_start, value_fields: ["Planned value", "Earned value", "Actual cost"], unit: SAR, rollup: none, tones: {"Planned value": neutral, "Actual cost": act}, caption: "The projects still running, cumulative. Earned below planned: behind schedule; cost above earned: over budget."}, layout: {x: 0, y: 14, w: 7, h: 10}}
      - {title: "Project risk quadrant", type: scatter, dataset: fd_projects_active, config: {x_field: spi, y_field: cpi, label_field: project, size_field: contract_value_sar, x_label: "Schedule (SPI): ahead to the right", y_label: "Cost (CPI): under budget is up", reference_x: 1, reference_y: 1, quadrant_tones: true, drill: {dataset: fd_reg_ncrs, field: project_no, title: "NCRs"}, caption: "Each bubble is a running project, sized by contract value. Bottom-left is over budget and late."}, layout: {x: 7, y: 14, w: 5, h: 10}}

      - {title: "Shop and supply", type: text, config: {content: "Where is the shop loaded, and what keeps failing?"}, layout: {x: 0, y: 24, w: 12, h: 2}}
      - {title: "Work-centre load, % of capacity", type: heatmap, dataset: fd_wc_load, config: {category_field: week, category_order_field: week_start, series_field: work_center, value_field: load_pct, caption: "Last 12 weeks and the next 8 (planned). Over 100 means more work than hours.", empty: "No load recorded."}, layout: {x: 0, y: 26, w: 12, h: 10}}
      - {title: "What the NCRs are about", type: pareto, dataset: fd_ncr_pareto, config: {category_field: category, value_field: ncrs, items: categories, what: "the NCRs", caption: "Raised in the last 12 months. The blue bars are the few that make most of them.", drill: {dataset: fd_reg_ncrs, field: category, filters: [{column: raised_last_12m, value: 1}], title: "NCRs raised in the last 12 months"}}, layout: {x: 0, y: 36, w: 6, h: 10}}
      - {title: "Suppliers delivering late most often", type: bar_list, dataset: fd_supplier_late, config: {category_field: supplier, value_field: late_pct, unit: "%", detail_field: avg_days_late, detail_format: "late by {value} days on average", limit: 6, caption: "Share of lines received after the promised date, last 12 months.", drill: {dataset: fd_reg_pos, field: supplier, filters: [{column: late_last_12m, value: 1}], title: "Lines received late, last 12 months"}}, layout: {x: 6, y: 36, w: 6, h: 10}}

  # ======================================================================== PLANT SCORECARD
  # One page for the monthly review: every measure against its target, each project
  # against budget and plan, and the few causes behind most of the losses.
  - key: fab_scorecard
    name: "Plant Scorecard"
    nav_group: "Fabrication demo"
    position: 205
    description: "Demonstration data. Where is the plant short of its targets, which projects are over budget or late, and what causes most of the losses?"
    widgets:
      - {title: "Against target", type: text, config: {content: "Where is the plant short of the targets management set, and by how much?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Plant scorecard", type: bullet, dataset: fd_scorecard, config: {category_field: measure, value_field: value, target_field: target, floor_field: floor, unit_field: unit, direction_field: direction, previous_field: previous, compared_field: compared_with, caption: "The latest full month (weekly measures: the latest week) against target. Grey is short of target, darker grey needs action; the tick is the target."}, layout: {x: 0, y: 2, w: 12, h: 14}}
      - {title: "Projects against budget and plan", type: text, config: {content: "Is each running project earning what it spends, and keeping to plan? Darker grey: more than 10% over budget or behind plan."}, layout: {x: 0, y: 16, w: 12, h: 2}}
      - {title: "Spent against the value of the work done", type: bullet, dataset: fd_project_cost, config: {category_field: project_no, name_field: project_name, value_field: spent_pct, target_field: earned_pct, floor_field: act_above_pct, unit: "%", direction: lower_better, gap: relative, value_label: "Spent", target_label: "earned", words: {miss: "{gap} overspent", met: "not overspent"}, reference: {value: 100, label: "Budget"}, caption: "% of each budget. Bar: spent. Tick: value of the work done.", drill: {dataset: fd_reg_operations, field: project_no, title: "Shop operations", columns: [{field: item_no, label: Item}, {field: operation, label: Operation}, {field: work_center, label: "Work centre"}, {field: status, label: Status}, {field: planned_finish, label: "Planned finish"}, {field: planned_hours, label: "Planned h"}, {field: actual_hours, label: "Actual h"}, {field: days_late, label: "Days late"}]}}, layout: {x: 0, y: 18, w: 6, h: 12}}
      - {title: "Work done against plan", type: bullet, dataset: fd_project_schedule, config: {category_field: project_no, name_field: project_name, value_field: earned_pct, target_field: planned_pct, floor_field: act_below_pct, unit: "%", direction: higher_better, value_label: "Done", target_label: "planned", words: {miss: "{gap} behind plan", met: "on or ahead of plan"}, reference: {value: 100, label: "Complete"}, caption: "% of each budget. Bar: work done. Tick: planned by now.", drill: {dataset: fd_reg_operations, field: project_no, title: "Shop operations", columns: [{field: item_no, label: Item}, {field: operation, label: Operation}, {field: work_center, label: "Work centre"}, {field: status, label: Status}, {field: planned_finish, label: "Planned finish"}, {field: planned_hours, label: "Planned h"}, {field: actual_hours, label: "Actual h"}, {field: days_late, label: "Days late"}]}}, layout: {x: 6, y: 18, w: 6, h: 12}}
      - {title: "Where the losses concentrate", type: text, config: {content: "Which few causes make most of the cost of poor quality, and most of the injuries?"}, layout: {x: 0, y: 30, w: 12, h: 2}}
      - {title: "Cost of poor quality by root cause", type: pareto, dataset: fd_ncr_root_cause, config: {category_field: root_cause, value_field: cost_sar, unit: SAR, items: "root causes", what: "the cost of poor quality", caption: "Rework, scrap and re-inspection of the NCRs raised in the last 12 months.", drill: {dataset: fd_reg_ncrs, field: root_cause, filters: [{column: raised_last_12m, value: 1}], title: "NCRs raised in the last 12 months"}}, layout: {x: 0, y: 32, w: 6, h: 10}}
      - {title: "Incidents by type, last 12 months", type: pareto, dataset: fd_incidents_by_type, config: {category_field: incident_type, value_field: incidents, items: types, what: "the incidents", caption: "Every incident, near misses included."}, layout: {x: 6, y: 32, w: 6, h: 10}}

  # ======================================================================== SALES AND ORDER BOOK
  - key: fab_sales
    name: "Sales & Order Book"
    nav_group: "Fabrication demo"
    position: 207
    description: "Demonstration data. What is in the pipeline, why do we win and lose, and what do clients say?"
    widgets:
      - {title: "Pipeline", type: text, config: {content: "What are we bidding for, and how likely is it to come in?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Open pipeline", type: kpi, dataset: fd_sales_now, config: {value_field: pipeline_sar, rollup: sum, unit: SAR, label: "Tenders open: in preparation, submitted or in negotiation", drill: {dataset: fd_reg_tenders, filters: [{column: outcome, value: Open}], title: "Open tenders", label: "See them"}}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Weighted pipeline", type: kpi, dataset: fd_sales_now, config: {value_field: weighted_sar, rollup: sum, unit: SAR, label: "Submitted tenders at their chance of winning", caption: "Value times the estimator's chance of winning."}, layout: {x: 3, y: 2, w: 3, h: 5}}
      - {title: "Win rate", type: kpi, dataset: fd_business_month, config: {value_field: win_rate_12m, trend_field: win_rate_12m, value_from: last, unit: "%", direction: higher_better, label: "Tenders won, 12 months", delta_label: "vs month before", thresholds: [{op: lt, value: 18, color: red, label: "Below 18%"}, {op: lt, value: 25, color: amber, label: "Below the 25% target"}, {op: gte, value: 25, color: green, label: "On target"}]}, layout: {x: 6, y: 2, w: 3, h: 5}}
      - {title: "Price gap", type: kpi, dataset: fd_sales_now, config: {value_field: price_gap_pct, rollup: sum, unit: "%", direction: lower_better, label: "Above the winner, when we lost on price", caption: "Average of the last 12 months' price losses, where the client told us."}, layout: {x: 9, y: 2, w: 3, h: 5}}
      - {title: "From tender to order", type: funnel, dataset: fd_tender_funnel, config: {category_field: stage, value_field: tenders, caption: "Tenders decided in the last 12 months."}, layout: {x: 0, y: 7, w: 4, h: 9}}
      - {title: "Open tenders by stage", type: bar_list, dataset: fd_pipeline_stage, config: {category_field: status, value_field: value_sar, unit: SAR, sort: false, detail_field: tenders, detail_format: "{value} tenders", drill: {dataset: fd_reg_tenders, field: status, title: "Open tenders"}}, layout: {x: 4, y: 7, w: 4, h: 9}}
      - {title: "What clients said at handover", type: bar_list, dataset: fd_client_feedback, config: {category_field: project, value_field: overall, sort: false, detail_field: recommend, detail_format: "{value}", limit: 13, caption: "Score out of 10 from the handover survey, lowest first."}, layout: {x: 8, y: 7, w: 4, h: 9}}

      - {title: "Why we win and lose", type: text, config: {content: "Where do we lose, to whom, and does our pricing cost us work?"}, layout: {x: 0, y: 16, w: 12, h: 2}}
      - {title: "Win rate by the margin we priced", type: bar_list, dataset: fd_win_rate_margin, config: {category_field: margin_band, value_field: win_rate_pct, unit: "%", sort: false, detail_field: bids, detail_format: "of {value} bids", caption: "Bids decided in the last 24 months. Priced above 24%, we rarely win.", drill: {dataset: fd_reg_tenders, field: margin_band, filters: [{column: decided_bid_24m, value: 1}], title: "Bids decided in the last 24 months"}}, layout: {x: 0, y: 18, w: 3, h: 10}}
      - {title: "Why we lost", type: pareto, dataset: fd_loss_reasons, config: {category_field: loss_reason, value_field: tenders, items: reasons, what: "the tenders we lost", caption: "Lost in the last 12 months, by the reason the client gave.", drill: {dataset: fd_reg_tenders, field: loss_reason, filters: [{column: lost_last_12m, value: 1}], title: "Tenders lost in the last 12 months"}}, layout: {x: 3, y: 18, w: 5, h: 10}}
      - {title: "Who won what we lost", type: bar_list, dataset: fd_lost_to, config: {category_field: competitor, value_field: value_sar, unit: SAR, detail_field: tenders, detail_format: "{value} tenders", caption: "Last 12 months, by tender value.", drill: {dataset: fd_reg_tenders, field: competitor, filters: [{column: lost_last_12m, value: 1}], title: "Tenders lost in the last 12 months"}}, layout: {x: 8, y: 18, w: 4, h: 10}}
      - {title: "Win rate by product", type: bar_list, dataset: fd_win_rate_product, config: {category_field: product_type, value_field: win_rate_pct, unit: "%", detail_field: bids, detail_format: "of {value} bids", caption: "Bids decided in the last 24 months.", drill: {dataset: fd_reg_tenders, field: product_type, filters: [{column: decided_bid_24m, value: 1}], title: "Bids decided in the last 24 months"}}, layout: {x: 0, y: 28, w: 5, h: 9}}
      - {title: "Orders won and revenue by quarter", type: bar, dataset: fd_intake_quarterly, config: {category_field: quarter, value_fields: ["Orders won", "Revenue"], unit: SAR, rollup: none, tones: {"Revenue": neutral}, caption: "Whole quarters. Orders won below revenue empties the order book."}, layout: {x: 5, y: 28, w: 7, h: 9}}
      - {title: "Open tenders", type: table, dataset: fd_pipeline_open, config: {page_size: 10, columns: [{field: tender_no, label: Tender, format: raw}, {field: client, label: Client}, {field: title, label: Scope}, {field: status, label: Stage}, {field: value_sar, label: "Value (SAR)"}, {field: win_probability_pct, label: "Chance %"}, {field: weighted_sar, label: "Weighted (SAR)"}, {field: margin_pct, label: "Margin %"}, {field: submitted_on, label: Submitted}, {field: estimator, label: Estimator}]}, layout: {x: 0, y: 37, w: 12, h: 9}}

  # ======================================================================== FINANCE AND CASH
  - key: fab_finance
    name: "Finance & Cash"
    nav_group: "Fabrication demo"
    position: 208
    description: "Demonstration data. Who owes us money, how late do they pay, and is the cash coming in?"
    widgets:
      - {title: "Getting paid", type: text, config: {content: "How much do clients owe us, how much of it is late, and who is holding it?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Receivables", type: kpi, dataset: fd_finance_now, config: {value_field: receivables_sar, rollup: sum, unit: SAR, label: "Invoiced and not yet paid", drill: {dataset: fd_reg_invoices, filters: [{column: unpaid, value: 1}], title: "Unpaid invoices", label: "See them"}}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Overdue", type: kpi, dataset: fd_finance_now, config: {value_field: overdue_sar, rollup: sum, unit: SAR, direction: lower_better, label: "Past the due date", caption: "Disputed invoices included.", drill: {dataset: fd_reg_invoices, filters: [{column: overdue_now, value: 1}], title: "Overdue invoices", label: "See them"}}, layout: {x: 3, y: 2, w: 3, h: 5}}
      - {title: "Disputed", type: kpi, dataset: fd_finance_now, config: {value_field: disputed_sar, rollup: sum, unit: SAR, direction: lower_better, label: "Held back by a dispute over the progress claimed", drill: {dataset: fd_reg_invoices, filters: [{column: status, value: Disputed}], title: "Disputed invoices", label: "See them"}}, layout: {x: 6, y: 2, w: 3, h: 5}}
      - {title: "Days sales outstanding", type: kpi, dataset: fd_business_month, config: {value_field: dso_days, trend_field: dso_days, value_from: last, unit: d, direction: lower_better, label: "Days sales outstanding", delta_label: "vs month before", thresholds: [{op: gt, value: 75, color: red, label: "Over 75 days"}, {op: gt, value: 60, color: amber, label: "Over the 60-day target"}, {op: lte, value: 60, color: green, label: "Within target"}]}, layout: {x: 9, y: 2, w: 3, h: 5}}
      - {title: "Unpaid invoices by age", type: bar_list, dataset: fd_ar_aging, config: {category_field: age_band, value_field: amount_sar, unit: SAR, sort: false, detail_field: invoices, detail_format: "{value} invoices", tones: {"Not due yet": good, "1-30 days overdue": watch, "31-60 days overdue": serious, "61-90 days overdue": act, "over 90 days overdue": act, "Disputed": act}, drill: {dataset: fd_reg_invoices, field: age_band, title: "Unpaid invoices"}}, layout: {x: 0, y: 7, w: 5, h: 9}}
      - {title: "Who holds the overdue money", type: pareto, dataset: fd_overdue_client, config: {category_field: client, value_field: overdue_sar, unit: SAR, items: clients, what: "the overdue money", caption: "Invoices past their due date now, disputed ones included.", drill: {dataset: fd_reg_invoices, field: client, filters: [{column: overdue_now, value: 1}], title: "Overdue invoices"}}, layout: {x: 5, y: 7, w: 7, h: 9}}
      - {title: "How late each client pays", type: heatmap, dataset: fd_pay_days_matrix, config: {category_field: issued_quarter, category_order_field: issued_quarter, series_field: client, value_field: days_late, caption: "Average days paid after the due date, by the quarter invoiced (progress invoices). Client G pays later every quarter.", drill: {dataset: fd_reg_invoices, field: issued_quarter, field2: client, filters: [{column: invoice_type, value: Progress}, {column: status, value: Paid}], title: "Progress invoices paid"}}, layout: {x: 0, y: 16, w: 7, h: 10}}
      - {title: "Days sales outstanding by month", type: line, dataset: fd_business_month, config: {category_field: month, category_format: month, value_field: dso_days, unit: d, rollup: none, reference: {value: 60, label: "Target 60 days"}}, layout: {x: 7, y: 16, w: 5, h: 10}}

      - {title: "Cash", type: text, config: {content: "Is the cash coming in faster than it goes out, and what is still waiting to be billed or released?"}, layout: {x: 0, y: 26, w: 12, h: 2}}
      - {title: "Cash", type: kpi, dataset: fd_business_month, config: {value_field: cash_sar, trend_field: cash_sar, value_from: last, unit: SAR, direction: higher_better, label: "Cash at month end", delta_label: "vs month before"}, layout: {x: 0, y: 28, w: 3, h: 5}}
      - {title: "Retention held", type: kpi, dataset: fd_finance_now, config: {value_field: retention_held_sar, rollup: sum, unit: SAR, label: "Retention clients hold until the warranty ends", caption: "5% of each progress invoice."}, layout: {x: 3, y: 28, w: 3, h: 5}}
      - {title: "Not yet billed", type: kpi, dataset: fd_finance_now, config: {value_field: unbilled_sar, rollup: sum, unit: SAR, label: "Work earned and not yet invoiced", caption: "Last month's invoices go out in the first days of the month."}, layout: {x: 6, y: 28, w: 3, h: 5}}
      - {title: "Gross margin", type: kpi, dataset: fd_business_month, config: {value_field: margin_12m_pct, trend_field: margin_12m_pct, value_from: last, unit: "%", direction: higher_better, label: "Gross margin, 12 months", delta_label: "vs month before", thresholds: [{op: lt, value: 18, color: red, label: "Below 18%"}, {op: lt, value: 22, color: amber, label: "Below the 22% plan"}, {op: gte, value: 22, color: green, label: "On plan"}]}, layout: {x: 9, y: 28, w: 3, h: 5}}
      - {title: "Cash in and cash out by month", type: bar, dataset: fd_cash_monthly, config: {category_field: month, category_format: month, value_fields: ["Cash in", "Cash out"], unit: SAR, rollup: none, tones: {"Cash out": neutral}, caption: "In: invoices paid. Out: the cost of the work (materials paid a month later) and the overheads."}, layout: {x: 0, y: 33, w: 7, h: 10}}
      - {title: "Cash at month end", type: line, dataset: fd_cash_monthly, config: {category_field: month, category_format: month, value_field: closing_cash_sar, unit: SAR, rollup: none}, layout: {x: 7, y: 33, w: 5, h: 10}}
      - {title: "Revenue and plan by month", type: bar, dataset: fd_business_month, config: {category_field: month, category_format: month, value_fields: ["Revenue", "Plan"], unit: SAR, rollup: none, tones: {"Plan": neutral}, caption: "Revenue is each project's earned value at its contract price."}, layout: {x: 0, y: 43, w: 12, h: 9}}
      - {title: "Money waiting on each project", type: table, dataset: fd_project_billing, config: {page_size: 10, columns: [{field: project, label: Project}, {field: status, label: Status}, {field: earned_sar, label: "Earned (SAR)"}, {field: billed_sar, label: "Billed (SAR)"}, {field: unbilled_sar, label: "Not yet billed (SAR)"}, {field: unpaid_sar, label: "Unpaid (SAR)"}, {field: disputed_sar, label: "Disputed (SAR)"}, {field: retention_held_sar, label: "Retention held (SAR)"}], row_rules: [{column: disputed_sar, op: gt, value: 0, bg_color: "#fdecec"}]}, layout: {x: 0, y: 52, w: 12, h: 10}}

  # ======================================================================== SHOP FLOOR
  - key: fab_shop
    name: "Shop Floor"
    nav_group: "Fabrication demo"
    position: 210
    description: "Demonstration data. Where is the work, where is it stuck, and is the shop keeping to plan?"
    widgets:
      - {title: "Flow", type: text, config: {content: "Where is the work waiting, and are we finishing what we planned?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Items waiting at each operation", type: bar_list, dataset: fd_wip, config: {category_field: operation, value_field: items, sort: false, detail_field: avg_days, detail_format: "{value} days there on average", limit: 9, caption: "Work in progress along the route; a long bar is a queue.", drill: {dataset: fd_reg_operations, field: operation, filters: [{column: waiting, value: 1}], title: "Items waiting here"}}, layout: {x: 0, y: 2, w: 5, h: 10}}
      - {title: "Items finished per week, against plan", type: bar, dataset: fd_throughput_weekly, config: {category_field: week_start, value_fields: ["Planned", "Finished"], rollup: none, tones: {"Planned": neutral}, caption: "Items through final inspection, last 26 weeks."}, layout: {x: 5, y: 2, w: 7, h: 10}}
      - {title: "Capacity", type: text, config: {content: "Which work centres are overloaded, now and in the coming weeks?"}, layout: {x: 0, y: 12, w: 12, h: 2}}
      - {title: "Work-centre load, % of capacity", type: heatmap, dataset: fd_wc_load, config: {category_field: week, category_order_field: week_start, series_field: work_center, value_field: load_pct, caption: "Last 12 weeks and the next 8 (planned). Over 100 means more work than hours."}, layout: {x: 0, y: 14, w: 12, h: 10}}
      - {title: "Welding bay load by week", type: line, dataset: fd_welding_load, config: {category_field: week_start, value_field: load_pct, unit: "%", rollup: none, reference: {value: 100, label: "Capacity"}, caption: "The constraint, week by week, four weeks ahead."}, layout: {x: 0, y: 24, w: 6, h: 9}}
      - {title: "Operations running late now", type: bar_list, dataset: fd_late_ops_by_wc, config: {category_field: work_center, value_field: late_operations, detail_field: avg_days_late, detail_format: "late by {value} days on average", limit: 9, drill: {dataset: fd_reg_operations, field: work_center, filters: [{column: late_now, value: 1}], title: "Operations running late now"}}, layout: {x: 6, y: 24, w: 6, h: 9}}
      - {title: "Planned against actual hours, last 90 days", type: bar, dataset: fd_hours_by_wc, config: {category_field: work_center, value_fields: ["Planned hours", "Actual hours"], unit: h, rollup: none, orientation: horizontal, tones: {"Planned hours": neutral}, caption: "Actual above planned means the work took longer than estimated."}, layout: {x: 0, y: 33, w: 12, h: 9}}

  # ======================================================================== QUALITY
  - key: fab_quality
    name: "Quality"
    nav_group: "Fabrication demo"
    position: 220
    description: "Demonstration data. Are we welding right first time, and what do the non-conformances tell us?"
    widgets:
      - {title: "Welding", type: text, config: {content: "Is the weld repair rate within target, and where are repairs coming from?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Weld repair rate", type: kpi, dataset: fd_weld_monthly, config: {value_field: repair_pct, trend_field: repair_pct, value_from: last, unit: "%", direction: lower_better, label: "Weld repair rate, last full month", delta_label: "vs month before", thresholds: [{op: gt, value: 2.5, color: red, label: "Above 2.5% target"}, {op: lte, value: 2.5, color: green, label: "Within target"}]}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Open NCRs", type: kpi, dataset: fd_ncr_open, config: {value_field: open_ncrs, rollup: sum, direction: lower_better, label: "Open non-conformances", drill: {dataset: fd_reg_ncrs, filters: [{column: status, value: Open}], title: "Open NCRs", label: "See them"}}, layout: {x: 0, y: 7, w: 3, h: 5}}
      - {title: "Weld repair rate by month", type: line, dataset: fd_weld_monthly, config: {category_field: month, category_format: month, value_field: repair_pct, unit: "%", rollup: none, reference: {value: 2.5, label: "Target 2.5%"}, caption: "The quality push from April 2026 shows."}, layout: {x: 3, y: 2, w: 9, h: 10}}
      - {title: "Repair rate by process, last 6 months", type: bar_list, dataset: fd_weld_by_process, config: {category_field: process, value_field: repair_pct, unit: "%", detail_field: welds, detail_format: "of {value} welds", drill: {dataset: fd_reg_welds, field: process, filters: [{column: result, value: Rejected}, {column: welded_last_6m, value: 1}], title: "Rejected welds, last 6 months"}}, layout: {x: 0, y: 12, w: 4, h: 8}}
      - {title: "Welders with the highest repair rate", type: bar_list, dataset: fd_welders, config: {category_field: welder, value_field: repair_pct, unit: "%", detail_field: welds, detail_format: "of {value} welds", limit: 8, caption: "Last 6 months, welders with 150 welds or more: candidates for coaching.", drill: {dataset: fd_reg_welds, field: welder, filters: [{column: result, value: Rejected}, {column: welded_last_6m, value: 1}], title: "Rejected welds, last 6 months"}}, layout: {x: 4, y: 12, w: 8, h: 8}}
      - {title: "Non-conformances", type: text, config: {content: "What goes wrong, why, and how long do open NCRs stay open?"}, layout: {x: 0, y: 20, w: 12, h: 2}}
      - {title: "NCRs by category", type: pareto, dataset: fd_ncr_pareto, config: {category_field: category, value_field: ncrs, items: categories, what: "the NCRs", caption: "Raised in the last 12 months.", drill: {dataset: fd_reg_ncrs, field: category, filters: [{column: raised_last_12m, value: 1}], title: "NCRs raised in the last 12 months"}}, layout: {x: 0, y: 22, w: 6, h: 10}}
      - {title: "Cost of poor quality by root cause", type: pareto, dataset: fd_ncr_root_cause, config: {category_field: root_cause, value_field: cost_sar, unit: SAR, items: "root causes", what: "the cost of poor quality", caption: "Rework, scrap and re-inspection of the NCRs raised in the last 12 months.", drill: {dataset: fd_reg_ncrs, field: root_cause, filters: [{column: raised_last_12m, value: 1}], title: "NCRs raised in the last 12 months"}}, layout: {x: 6, y: 22, w: 6, h: 10}}
      - {title: "Open NCRs by severity and age", type: heatmap, dataset: fd_ncr_open_matrix, config: {category_field: age_band, category_order_field: band_order, series_field: severity, value_field: ncrs, caption: "Critical and old is where to start.", drill: {dataset: fd_reg_ncrs, field: age_band, field2: severity, title: "Open NCRs"}}, layout: {x: 0, y: 32, w: 4, h: 9}}
      - {title: "NCRs raised and closed by month", type: bar, dataset: fd_ncr_monthly, config: {category_field: month, category_format: month, value_fields: ["Raised", "Closed"], rollup: none, tones: {"Raised": serious, "Closed": good}, caption: "More raised than closed means the backlog is growing."}, layout: {x: 4, y: 32, w: 8, h: 9}}
      - {title: "Cost of poor quality by month", type: bar, dataset: fd_ncr_monthly, config: {category_field: month, category_format: month, value_field: cost_sar, unit: SAR, rollup: none, caption: "Rework, scrap and re-inspection cost of the NCRs raised each month."}, layout: {x: 0, y: 41, w: 12, h: 8}}

  # ======================================================================== SUPPLY CHAIN
  - key: fab_supply
    name: "Supply Chain"
    nav_group: "Fabrication demo"
    position: 230
    description: "Demonstration data. Are suppliers delivering on time, and what is overdue now?"
    widgets:
      - {title: "Delivery", type: text, config: {content: "Who delivers late, and which materials are most at risk?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Supplier on-time", type: kpi, dataset: fd_supplier_monthly, config: {value_field: on_time_pct, trend_field: on_time_pct, value_from: last, unit: "%", direction: higher_better, label: "Lines on time (3 months)", delta_label: "vs month before", thresholds: [{op: lt, value: 75, color: red, label: "Below 75%"}, {op: lt, value: 85, color: amber, label: "Below 85% target"}, {op: gte, value: 85, color: green, label: "On target"}]}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Overdue lines", type: kpi, dataset: fd_po_overdue, config: {value_field: overdue_lines, rollup: sum, direction: lower_better, label: "Purchase-order lines overdue", drill: {dataset: fd_reg_pos, filters: [{column: status, value: Overdue}], title: "Overdue lines", label: "See them"}}, layout: {x: 0, y: 7, w: 3, h: 5}}
      - {title: "Supplier on-time delivery by month", type: line, dataset: fd_supplier_monthly, config: {category_field: month, category_format: month, value_field: on_time_pct, unit: "%", rollup: none, reference: {value: 85, label: "Target 85%"}, caption: "Rolling 3 months."}, layout: {x: 3, y: 2, w: 9, h: 10}}
      - {title: "Suppliers delivering late most often", type: bar_list, dataset: fd_supplier_late, config: {category_field: supplier, value_field: late_pct, unit: "%", detail_field: avg_days_late, detail_format: "late by {value} days on average", limit: 8, drill: {dataset: fd_reg_pos, field: supplier, filters: [{column: late_last_12m, value: 1}], title: "Lines received late, last 12 months"}}, layout: {x: 0, y: 12, w: 6, h: 10}}
      - {title: "Lines by category and lateness", type: heatmap, dataset: fd_po_late_matrix, config: {category_field: lateness, category_order_field: band_order, series_field: category, value_field: lines, caption: "Received and overdue lines; the right-hand columns are the problem.", drill: {dataset: fd_reg_pos, field: lateness, field2: category, title: "Purchase-order lines"}}, layout: {x: 6, y: 12, w: 6, h: 10}}
      - {title: "Who the money goes to", type: pareto, dataset: fd_spend_supplier, config: {category_field: supplier, value_field: value_sar, unit: SAR, items: suppliers, what: "the spend", limit: 10, caption: "Ordered in the last 12 months. The blue bars are the strategic suppliers: where price and delivery agreements pay most.", drill: {dataset: fd_reg_pos, field: supplier, filters: [{column: ordered_last_12m, value: 1}], title: "Lines ordered in the last 12 months"}}, layout: {x: 0, y: 22, w: 8, h: 10}}
      - {title: "Spend by category", type: bar_list, dataset: fd_spend_category, config: {category_field: category, value_field: value_sar, unit: SAR, detail_field: lines, detail_format: "{value} lines", limit: 7, caption: "Last 12 months.", drill: {dataset: fd_reg_pos, field: category, filters: [{column: ordered_last_12m, value: 1}], title: "Lines ordered in the last 12 months"}}, layout: {x: 8, y: 22, w: 4, h: 10}}

  # ======================================================================== MATERIALS AND STOCK
  - key: fab_stock
    name: "Materials & Stock"
    nav_group: "Fabrication demo"
    position: 235
    description: "Demonstration data. What stock do we hold, what does it tie up, and why do we run out?"
    widgets:
      - {title: "Stock", type: text, config: {content: "What do we hold, how fast does it turn, and how much money sits in stock that does not move?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Stock value", type: kpi, dataset: fd_stock_month, config: {value_field: stock_sar, trend_field: stock_sar, value_from: last, unit: SAR, label: "Stock held at month end", delta_label: "vs month before"}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Stock turns", type: kpi, dataset: fd_stock_month, config: {value_field: turns_12m, trend_field: turns_12m, value_from: last, direction: higher_better, label: "Stock turns, 12 months", delta_label: "vs month before", thresholds: [{op: lt, value: 4, color: red, label: "Below 4"}, {op: lt, value: 6, color: amber, label: "Below the target of 6"}, {op: gte, value: 6, color: green, label: "On target"}], caption: "What we used in a year, divided by the stock we held on average."}, layout: {x: 3, y: 2, w: 3, h: 5}}
      - {title: "Stock-outs", type: kpi, dataset: fd_stockouts_supplier, config: {value_field: stockouts, rollup: sum, direction: lower_better, label: "Stock-outs, last 12 months", drill: {dataset: fd_stockout_list, filters: [{column: started_last_12m, value: 1}], title: "Stock-outs, last 12 months", label: "See them"}}, layout: {x: 6, y: 2, w: 3, h: 5}}
      - {title: "Tied up", type: kpi, dataset: fd_stock_tied_up, config: {value_field: value_sar, rollup: sum, unit: SAR, direction: lower_better, label: "In stock that does not move", caption: "No issue in 90 days, or more than 26 weeks of use.", drill: {dataset: fd_reg_stock, filters: [{column: tied_up, value: 1}], title: "Stock that does not move", label: "See it"}}, layout: {x: 9, y: 2, w: 3, h: 5}}
      - {title: "Stock items by status", type: bar_list, dataset: fd_stock_status, config: {category_field: stock_status, value_field: value_sar, unit: SAR, sort: false, detail_field: items, detail_format: "{value} items", tones: {"Out of stock": act, "Below safety stock": serious, "No movement 90+ days": watch, "Excess (over 26 weeks)": watch, "In range": good}, drill: {dataset: fd_reg_stock, field: stock_status, title: "Stock items"}}, layout: {x: 0, y: 7, w: 5, h: 8}}
      - {title: "Money tied up in stock that does not move", type: bar_list, dataset: fd_stock_tied_up, config: {category_field: description, value_field: value_sar, unit: SAR, detail_field: stock_status, detail_format: "{value}", caption: "The duplex plate was bought for F-2621, on hold since June. Use it elsewhere or sell it back.", drill: {dataset: fd_reg_stock, field: description, filters: [{column: tied_up, value: 1}], title: "Stock that does not move"}}, layout: {x: 5, y: 7, w: 7, h: 8}}
      - {title: "Running out", type: text, config: {content: "When do we run out of material, and which suppliers cause it?"}, layout: {x: 0, y: 15, w: 12, h: 2}}
      - {title: "Stock-outs started by month", type: bar, dataset: fd_stockouts_month, config: {category_field: month, category_format: month, value_field: stockouts, rollup: none, caption: "An item with nothing left to issue for at least a day."}, layout: {x: 0, y: 17, w: 7, h: 9}}
      - {title: "Days out of stock by supplier", type: pareto, dataset: fd_stockouts_supplier, config: {category_field: supplier, value_field: days_short, items: suppliers, what: "the days out of stock", caption: "Last 12 months, by the item's main supplier: the two suppliers late on purchase orders are the ones we run out on.", drill: {dataset: fd_stockout_list, field: supplier, filters: [{column: started_last_12m, value: 1}], title: "Stock-outs, last 12 months"}}, layout: {x: 7, y: 17, w: 5, h: 9}}
      - {title: "Use and yield", type: text, config: {content: "Does stock follow the work, and how much of the plate we cut becomes parts?"}, layout: {x: 0, y: 26, w: 12, h: 2}}
      - {title: "Stock held against stock used", type: line, dataset: fd_stock_month, config: {category_field: month, category_format: month, value_fields: ["Stock value", "Used"], unit: SAR, rollup: none, tones: {"Used": neutral}, caption: "Stock at month end and what the shop used in the month."}, layout: {x: 0, y: 28, w: 7, h: 9}}
      - {title: "Stock by category", type: bar_list, dataset: fd_stock_category, config: {category_field: category, value_field: value_sar, unit: SAR, detail_field: items, detail_format: "{value} items", drill: {dataset: fd_reg_stock, field: category, title: "Stock items"}}, layout: {x: 7, y: 28, w: 5, h: 9}}
      - {title: "Plate yield by month", type: line, dataset: fd_plate_yield, config: {category_field: month, category_format: month, value_field: yield_pct, unit: "%", rollup: none, reference: {value: 82, label: "Target 82%"}, caption: "Share of the plate cut that became parts. Nesting software from September 2025 lifted it by about 8 points."}, layout: {x: 0, y: 37, w: 12, h: 8}}

  # ======================================================================== PROJECT CONTROLS
  - key: fab_controls
    name: "Project Controls"
    nav_group: "Fabrication demo"
    position: 240
    description: "Demonstration data. Which projects are over budget or late, and what is changing their scope?"
    widgets:
      - {title: "Earned value", type: text, config: {content: "Are we earning the value we spend, and on schedule?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Project risk quadrant", type: scatter, dataset: fd_projects_active, config: {x_field: spi, y_field: cpi, label_field: project, size_field: contract_value_sar, x_label: "Schedule (SPI): ahead to the right", y_label: "Cost (CPI): under budget is up", reference_x: 1, reference_y: 1, quadrant_tones: true, drill: {dataset: fd_reg_ncrs, field: project_no, title: "NCRs"}, caption: "Each bubble is a running project, sized by contract value. Bottom-left is over budget and late."}, layout: {x: 0, y: 2, w: 6, h: 11}}
      - {title: "Active projects: CPI and SPI by week", type: line, dataset: fd_portfolio_index, config: {category_field: week_start, value_fields: ["CPI", "SPI"], unit: ratio, rollup: none, reference: {value: 1, label: "On plan"}, y_scale: true, caption: "Below 1.0: over budget (CPI) or behind schedule (SPI)."}, layout: {x: 6, y: 2, w: 6, h: 11}}
      - {title: "Each project against budget and plan", type: text, config: {content: "Is each running project earning what it spends, and keeping to plan? Darker grey: more than 10% over budget or behind plan."}, layout: {x: 0, y: 13, w: 12, h: 2}}
      - {title: "Spent against the value of the work done", type: bullet, dataset: fd_project_cost, config: {category_field: project_no, name_field: project_name, value_field: spent_pct, target_field: earned_pct, floor_field: act_above_pct, unit: "%", direction: lower_better, gap: relative, value_label: "Spent", target_label: "earned", words: {miss: "{gap} overspent", met: "not overspent"}, reference: {value: 100, label: "Budget"}, caption: "% of each budget. Bar: spent. Tick: value of the work done.", drill: {dataset: fd_reg_operations, field: project_no, title: "Shop operations", columns: [{field: item_no, label: Item}, {field: operation, label: Operation}, {field: work_center, label: "Work centre"}, {field: status, label: Status}, {field: planned_finish, label: "Planned finish"}, {field: planned_hours, label: "Planned h"}, {field: actual_hours, label: "Actual h"}, {field: days_late, label: "Days late"}]}}, layout: {x: 0, y: 15, w: 6, h: 12}}
      - {title: "Work done against plan", type: bullet, dataset: fd_project_schedule, config: {category_field: project_no, name_field: project_name, value_field: earned_pct, target_field: planned_pct, floor_field: act_below_pct, unit: "%", direction: higher_better, value_label: "Done", target_label: "planned", words: {miss: "{gap} behind plan", met: "on or ahead of plan"}, reference: {value: 100, label: "Complete"}, caption: "% of each budget. Bar: work done. Tick: planned by now.", drill: {dataset: fd_reg_operations, field: project_no, title: "Shop operations", columns: [{field: item_no, label: Item}, {field: operation, label: Operation}, {field: work_center, label: "Work centre"}, {field: status, label: Status}, {field: planned_finish, label: "Planned finish"}, {field: planned_hours, label: "Planned h"}, {field: actual_hours, label: "Actual h"}, {field: days_late, label: "Days late"}]}}, layout: {x: 6, y: 15, w: 6, h: 12}}
      - {title: "Projects", type: table, dataset: fd_projects, config: {page_size: 10, columns: [{field: project_no, label: Project}, {field: client, label: Client}, {field: product_type, label: Product}, {field: status, label: Status}, {field: pct_complete, label: "% complete"}, {field: cpi, label: CPI, format: ratio}, {field: spi, label: SPI, format: ratio}, {field: slip_days, label: "Days late (forecast)"}, {field: open_ncrs, label: "Open NCRs"}, {field: change_orders, label: "Change orders"}], row_rules: [{column: cpi, op: lt, value: 0.9, bg_color: "#fdecec"}]}, layout: {x: 0, y: 27, w: 12, h: 10}}
      - {title: "Change", type: text, config: {content: "What is changing the scope, and what is waiting for a decision?"}, layout: {x: 0, y: 37, w: 12, h: 2}}
      - {title: "Change orders waiting", type: kpi, dataset: fd_co_pending, config: {value_field: pending, rollup: sum, direction: lower_better, label: "Change orders waiting for a decision"}, layout: {x: 0, y: 39, w: 4, h: 5}}
      - {title: "Change orders by reason", type: bar_list, dataset: fd_co_by_reason, config: {category_field: reason, value_field: approved_sar, unit: SAR, detail_field: change_orders, detail_format: "{value} change orders", caption: "Approved value by reason."}, layout: {x: 4, y: 39, w: 8, h: 7}}
      - {title: "Planned value, earned value and actual cost", type: line, dataset: fd_evm_portfolio, config: {category_field: week_start, value_fields: ["Planned value", "Earned value", "Actual cost"], unit: SAR, rollup: none, tones: {"Planned value": neutral, "Actual cost": act}, caption: "The projects still running, cumulative."}, layout: {x: 0, y: 46, w: 12, h: 10}}

  # ======================================================================== MAINTENANCE AND EQUIPMENT
  - key: fab_maintenance
    name: "Maintenance & Equipment"
    nav_group: "Fabrication demo"
    position: 245
    description: "Demonstration data. Is planned maintenance done on time, what breaks down, and is the equipment certified?"
    widgets:
      - {title: "Equipment health", type: text, config: {content: "Is planned maintenance done on time, what keeps breaking, and is every lifting and pressure certificate in date?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Planned maintenance on time", type: kpi, dataset: fd_maint_month, config: {value_field: pm_on_time_3m, trend_field: pm_on_time_3m, value_from: last, unit: "%", direction: higher_better, label: "Planned maintenance done within a week of due (3 months)", delta_label: "vs month before", thresholds: [{op: lt, value: 80, color: red, label: "Below 80%"}, {op: lt, value: 90, color: amber, label: "Below the 90% target"}, {op: gte, value: 90, color: green, label: "On target"}]}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Breakdowns", type: kpi, dataset: fd_maint_month, config: {value_field: breakdowns, trend_field: breakdowns, value_from: last, direction: lower_better, label: "Breakdowns last month", delta_label: "vs month before"}, layout: {x: 3, y: 2, w: 3, h: 5}}
      - {title: "Open breakdowns", type: kpi, dataset: fd_maint_now, config: {value_field: open_breakdowns, rollup: sum, direction: lower_better, label: "Machines waiting for repair now", drill: {dataset: fd_reg_maintenance, filters: [{column: wo_type, value: Breakdown}, {column: status, value: Open}], title: "Open breakdowns", label: "See them"}}, layout: {x: 6, y: 2, w: 3, h: 5}}
      - {title: "Certificates", type: kpi, dataset: fd_maint_now, config: {value_field: certificates_due, rollup: sum, direction: lower_better, label: "Certificates expired or due within 30 days", thresholds: [{op: gt, value: 0, color: red, label: "Act now"}, {op: lte, value: 0, color: green, label: "All in date"}], caption: "Lifting equipment may not be used on an expired certificate."}, layout: {x: 9, y: 2, w: 3, h: 5}}
      - {title: "Equipment certificates", type: table, dataset: fd_certificates, config: {page_size: 12, columns: [{field: asset, label: Equipment}, {field: kind, label: Certificate}, {field: state, label: State}, {field: days_left, label: "Days left", format: raw}], row_rules: [{column: days_left, op: lt, value: 0, bg_color: "#fdecec"}, {column: days_left, op: lte, value: 30, bg_color: "#fdf3e1"}]}, layout: {x: 0, y: 7, w: 7, h: 10}}
      - {title: "Breakdown downtime by machine", type: pareto, dataset: fd_downtime_asset, config: {category_field: asset_id, name_field: asset, value_field: downtime_hours, unit: h, items: machines, what: "the breakdown downtime", limit: 8, caption: "Last 12 months. The 2004 plate rolls (FRM-02) are past economic repair.", drill: {dataset: fd_reg_maintenance, field: asset_id, filters: [{column: wo_type, value: Breakdown}, {column: raised_last_12m, value: 1}], title: "Breakdowns, last 12 months"}}, layout: {x: 7, y: 7, w: 5, h: 10}}
      - {title: "Planned against unplanned", type: text, config: {content: "When planned maintenance slips, do breakdowns follow? Summer 2026 says they do."}, layout: {x: 0, y: 17, w: 12, h: 2}}
      - {title: "Planned maintenance on time by month", type: line, dataset: fd_maint_month, config: {category_field: month, category_format: month, value_field: pm_on_time_pct, unit: "%", rollup: none, reference: {value: 90, label: "Target 90%"}, caption: "Done within a week of the due date, by the month it was due."}, layout: {x: 0, y: 19, w: 6, h: 9}}
      - {title: "Breakdowns by month", type: bar, dataset: fd_maint_month, config: {category_field: month, category_format: month, value_field: breakdowns, rollup: none}, layout: {x: 6, y: 19, w: 6, h: 9}}
      - {title: "Key machines: effectiveness (OEE)", type: bullet, dataset: fd_oee, config: {category_field: asset, value_field: oee_pct, target_field: target, floor_field: floor, unit: "%", direction: higher_better, previous_field: previous_oee_pct, compared_field: compared_with, value_label: "OEE", target_label: "target", caption: "Last 3 months: availability x speed x quality. Bar: OEE. Tick: the 75% target.", drill: {dataset: fd_reg_maintenance, field: asset, filters: [{column: wo_type, value: Breakdown}, {column: raised_last_3_months, value: 1}], title: "Breakdowns, last 3 months"}}, layout: {x: 0, y: 28, w: 6, h: 10}}
      - {title: "Why machines stop", type: pareto, dataset: fd_failure_modes, config: {category_field: failure_mode, value_field: downtime_hours, unit: h, items: causes, what: "the breakdown downtime", limit: 6, caption: "Last 12 months.", drill: {dataset: fd_reg_maintenance, field: failure_mode, filters: [{column: wo_type, value: Breakdown}, {column: raised_last_12m, value: 1}], title: "Breakdowns, last 12 months"}}, layout: {x: 6, y: 28, w: 6, h: 10}}
      - {title: "Maintenance cost by month", type: bar, dataset: fd_maint_month, config: {category_field: month, category_format: month, value_fields: ["Planned maintenance", "Breakdown repairs", "Inspections"], unit: SAR, rollup: none, stacked: true, caption: "Breakdown repairs cost several times what planned maintenance does."}, layout: {x: 0, y: 38, w: 12, h: 8}}
      - {title: "Machine reliability", type: table, dataset: fd_reliability, config: {page_size: 12, columns: [{field: asset, label: Machine}, {field: installed_year, label: Installed, format: raw}, {field: breakdowns, label: Breakdowns}, {field: downtime_hours, label: "Downtime (h)"}, {field: mtbf_days, label: "Days between failures"}, {field: mttr_hours, label: "Hours to repair"}, {field: repair_cost_sar, label: "Repair cost (SAR)"}]}, layout: {x: 0, y: 46, w: 12, h: 10}}

  # ======================================================================== SAFETY
  - key: fab_safety
    name: "Safety"
    nav_group: "Fabrication demo"
    position: 250
    description: "Demonstration data. Is the plant getting safer, and what kinds of incident happen?"
    widgets:
      - {title: "Safety performance", type: text, config: {content: "Are injuries falling as the hours rise?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Days since a lost-time injury", type: kpi, dataset: fd_days_since_lti, config: {value_field: days_since, rollup: sum, unit: d, direction: higher_better, label: "Days since the last lost-time injury"}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Recordable injury rate", type: kpi, dataset: fd_hse_monthly, config: {value_field: trir_12m, trend_field: trir_12m, value_from: last, unit: ratio, direction: lower_better, label: "TRIR, 12 months", delta_label: "vs month before", thresholds: [{op: gt, value: 3, color: red, label: "Above 3.0"}, {op: gt, value: 2, color: amber, label: "Above 2.0 target"}, {op: lte, value: 2, color: green, label: "Within target"}], caption: "Recordable injuries per 200,000 hours."}, layout: {x: 0, y: 7, w: 3, h: 5}}
      - {title: "Recordable and lost-time injury rates", type: line, dataset: fd_hse_monthly, config: {category_field: month, category_format: month, value_fields: ["Recordable injury rate", "Lost-time injury rate"], unit: ratio, rollup: none, caption: "Rolling 12 months, per 200,000 hours worked."}, layout: {x: 3, y: 2, w: 9, h: 10}}
      - {title: "Incidents by severity, last 12 months", type: bar_list, dataset: fd_incident_pyramid, config: {category_field: classification, value_field: incidents, sort: false, tones: {"Near miss": info, "First aid": watch, "Recordable": serious, "Lost time": act}, caption: "Many near misses reported is good: they are warnings caught early."}, layout: {x: 0, y: 12, w: 6, h: 9}}
      - {title: "Incidents by type, last 12 months", type: pareto, dataset: fd_incidents_by_type, config: {category_field: incident_type, value_field: incidents, items: types, what: "the incidents", caption: "Every incident, near misses included."}, layout: {x: 6, y: 12, w: 6, h: 9}}
      - {title: "Hours worked by month", type: bar, dataset: fd_hse_monthly, config: {category_field: month, category_format: month, value_field: man_hours, unit: h, rollup: none}, layout: {x: 0, y: 21, w: 12, h: 8}}

  # ======================================================================== WORKFORCE AND COMPETENCE
  - key: fab_people
    name: "Workforce & Competence"
    nav_group: "Fabrication demo"
    position: 255
    description: "Demonstration data. Do we have the people, are their hours sustainable, and are they qualified and trained?"
    widgets:
      - {title: "People", type: text, config: {content: "Do we have the people we need, and are their hours sustainable?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Shop headcount", type: kpi, dataset: fd_labour_month, config: {value_field: headcount, trend_field: headcount, value_from: last, label: "People in the shop trades at month end", delta_label: "vs month before", caption: "Own staff and agency staff."}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "Welders' overtime", type: kpi, dataset: fd_labour_month, config: {value_field: welder_overtime_pct, trend_field: welder_overtime_pct, value_from: last, unit: "%", direction: lower_better, label: "Welders' overtime, % of normal hours", delta_label: "vs month before", thresholds: [{op: gt, value: 20, color: red, label: "Over 20%"}, {op: gt, value: 10, color: amber, label: "Over the 10% limit"}, {op: lte, value: 10, color: green, label: "Within the limit"}], caption: "Rises when the welding bay is overloaded."}, layout: {x: 3, y: 2, w: 3, h: 5}}
      - {title: "Training up to date", type: kpi, dataset: fd_people_now, config: {value_field: training_pct, rollup: sum, unit: "%", direction: higher_better, label: "Mandatory training in date", thresholds: [{op: lt, value: 85, color: red, label: "Below 85%"}, {op: lt, value: 95, color: amber, label: "Below the 95% target"}, {op: gte, value: 95, color: green, label: "On target"}], drill: {dataset: fd_reg_certificates, filters: [{column: kind, value: Training}, {column: up_to_date, value: 0}], title: "Training not up to date", label: "Who needs it"}}, layout: {x: 6, y: 2, w: 3, h: 5}}
      - {title: "Welds on a lapsed qualification", type: kpi, dataset: fd_people_now, config: {value_field: welds_on_lapsed, rollup: sum, direction: lower_better, label: "Welds made after the welder's qualification lapsed", thresholds: [{op: gt, value: 0, color: red, label: "Review with QC"}, {op: lte, value: 0, color: green, label: "None"}], caption: "Each needs a QC review: the code allows welding only on a current qualification.", drill: {dataset: fd_reg_welds, filters: [{column: on_lapsed_qualification, value: 1}], title: "Welds on a lapsed qualification", label: "See them"}}, layout: {x: 9, y: 2, w: 3, h: 5}}
      - {title: "Headcount by trade", type: bar, dataset: fd_headcount_trade, config: {category_field: trade, value_fields: ["Own staff", "Agency"], rollup: none, orientation: horizontal, stacked: true, tones: {"Agency": neutral}, caption: "Last month."}, layout: {x: 0, y: 7, w: 6, h: 9}}
      - {title: "Overtime by month", type: line, dataset: fd_labour_month, config: {category_field: month, category_format: month, value_fields: ["Welders", "All trades"], unit: "%", rollup: none, reference: {value: 10, label: "Limit 10%"}, caption: "Overtime as a share of normal hours. The welders' peak follows the welding bay's load."}, layout: {x: 6, y: 7, w: 6, h: 9}}
      - {title: "Competence", type: text, config: {content: "Which qualifications lapse soon, and which mandatory training is out of date?"}, layout: {x: 0, y: 16, w: 12, h: 2}}
      - {title: "Qualifications by when they lapse", type: bar_list, dataset: fd_qualification_expiry, config: {category_field: expiry_band, value_field: records, sort: false, tones: {"Lapsed": act, "Within 30 days": serious, "31-90 days": watch, "Later": good}, caption: "Welder qualifications, NDT and inspector certificates, rigger and crane-operator cards.", drill: {dataset: fd_reg_certificates, field: expiry_band, filters: [{column: kind, value: Qualification}], title: "Qualifications"}}, layout: {x: 0, y: 18, w: 4, h: 10}}
      - {title: "Mandatory training by course", type: bullet, dataset: fd_training_compliance, config: {category_field: course, value_field: compliance_pct, target_field: target, floor_field: floor, unit: "%", direction: higher_better, value_label: "In date", target_label: "target", caption: "Share of the people who need each course whose training is in date. Click a course for who needs it.", drill: {dataset: fd_reg_certificates, field: name, filters: [{column: kind, value: Training}, {column: up_to_date, value: 0}], title: "Training not up to date"}}, layout: {x: 4, y: 18, w: 8, h: 10}}
      - {title: "Training: own staff and agency", type: bar_list, dataset: fd_training_employment, config: {category_field: employment, value_field: compliance_pct, unit: "%", detail_field: not_up_to_date, detail_format: "{value} not in date", caption: "The yearly H2S course run for agency staff in October 2025 has lapsed.", drill: {dataset: fd_reg_certificates, field: employment, filters: [{column: kind, value: Training}, {column: up_to_date, value: 0}], title: "Training not up to date"}}, layout: {x: 0, y: 28, w: 4, h: 8}}
      - {title: "Absence by month", type: line, dataset: fd_labour_month, config: {category_field: month, category_format: month, value_field: absence_pct, unit: "%", rollup: none, caption: "Days absent as a share of working days. Higher in the summer and in Ramadan."}, layout: {x: 4, y: 28, w: 4, h: 8}}
      - {title: "Hours earned per hour worked", type: line, dataset: fd_productivity, config: {category_field: month, category_format: month, value_field: productivity, unit: ratio, rollup: none, reference: {value: 1, label: "As estimated"}, y_scale: true, caption: "Estimated hours of the operations finished, per hour booked to them."}, layout: {x: 8, y: 28, w: 4, h: 8}}
      - {title: "Own staff and agency by month", type: bar, dataset: fd_labour_month, config: {category_field: month, category_format: month, value_fields: ["Own staff", "Agency"], rollup: none, stacked: true, tones: {"Agency": neutral}, caption: "Agency staff covered the 2026 peak and left in October."}, layout: {x: 0, y: 36, w: 12, h: 8}}

  # ======================================================================== REGISTERS
  - key: fab_reg_ncrs
    name: "NCR register"

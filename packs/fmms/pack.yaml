# PMSv2 Management Reporting pack (Release 1).
# Every dataset is a thin SELECT over the certified rpt.* views on the nightly restored copy;
# all data traps (Riyadh dates, revisions, P6 latest-draft label, exclusions, currency) live in
# those views (fmms-deploy/reporting), never here. Money is NOT in this pack: see
# pack-restricted.yaml (rpt_fin.*, restricted DataSource, private visibility).
#
#   manage.py seed_domain_pack --pack packs/fmms/pack.yaml --refresh
pack: fmms
version: 1
datasources:
  default: "PMSv2 Reporting"
visibility: org          # every signed-in user of the reporting deployment (the cleared audience)
share_with_group: ""

datasets:
  # ---------------------------------------------------------------- freshness (every board)
  - key: data_freshness
    name: "PMSv2 · Data as of"
    description: "Backup time of the restored copy every number on the boards comes from (Riyadh)."
    datasource: default
    refresh: daily
    sql: |
      SELECT data_as_of_label, freshness_status, hours_since_backup, snapshot_date
      FROM rpt.v_data_as_of

  - key: mgt_kpi_summary
    name: "MGT · Weekly KPI summary"
    description: "Every Release-1 KPI on one page with readiness and caveats (the weekly management pack)."
    datasource: default
    refresh: daily
    sql: |
      SELECT kpi_id, kpi_name, value_text AS value, unit, readiness, boards, caveat
      FROM rpt.exec_summary
      ORDER BY sort_order

  # ---------------------------------------------------------------- KPI tiles (rpt.exec_summary)
  - key: kpi_eng01
    name: "KPI · ENG-01 Engineering progress %"
    description: "Document-control credit progress across the portfolio (601 close = 50%, 602 close = 100%)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-01'"
  - key: kpi_eng06
    name: "KPI · ENG-06 AFC drawing coverage %"
    description: "Drawings approved for construction / all drawings."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-06'"
  - key: kpi_eng07
    name: "KPI · ENG-07 Overdue documents"
    description: "Not-done documents past their target date (business dates)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-07'"
  - key: kpi_eng11
    name: "KPI · ENG-11 Client submissions responded %"
    description: "External transmittal items with a client response."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-11'"
  - key: kpi_eng12
    name: "KPI · ENG-12 Client turnaround (median days)"
    description: "Issued date to client return date, median days."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-12'"
  - key: kpi_eng13
    name: "KPI · ENG-13 Documents with client"
    description: "Documents currently awaiting the client."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-13'"
  - key: kpi_eng25
    name: "KPI · ENG-25 External transmittals issued"
    description: "External transmittals issued (all history)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-25'"
  - key: kpi_eng30
    name: "KPI · ENG-30 Superseded revisions"
    description: "Document revisions superseded by a later revision."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-30'"
  - key: kpi_mto01
    name: "KPI · MTO-01 BOM take-off coverage % (PCS)"
    description: "BOM quantity covered by MTO take-off, PCS lines only (never summed across units)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'MTO-01'"
  - key: kpi_com01
    name: "KPI · COM-01 RFQs received"
    description: "RFQs received (includes test RFQs until the exclusion list is confirmed)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'COM-01'"
  - key: kpi_com09
    name: "KPI · COM-09 Bids awarded"
    description: "RFQs awarded (won or PO received)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'COM-09'"
  - key: kpi_com11
    name: "KPI · COM-11 Open RFQs"
    description: "RFQs still open in the bid flow."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'COM-11'"
  - key: kpi_com16
    name: "KPI · COM-16 Pending BD approvals"
    description: "RFQs waiting on a BD approval step (no deadlines are configured yet)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'COM-16'"
  - key: kpi_com_test_rfqs
    name: "KPI · RFQs flagged as test (pending confirmation)"
    description: "Test-titled or placeholder-client RFQs proposed for exclusion (DEC-16)."
    datasource: default
    refresh: daily
    sql: "SELECT COUNT(*) AS value FROM rpt.com_rfq_register WHERE is_demo_or_test = 1"
  - key: kpi_prj01
    name: "KPI · PRJ-01 Active projects"
    description: "Active projects (53 are migrated shells without dates or value)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'PRJ-01'"
  - key: kpi_prj05
    name: "KPI · PRJ-05 Gates passed %"
    description: "Gate instances passed / all gate instances."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'PRJ-05'"
  - key: kpi_prj11
    name: "KPI · PRJ-11 Projects KPI-ready %"
    description: "Projects with a contract value and a planned end date."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'PRJ-11'"
  - key: kpi_pln01
    name: "KPI · PLN-01 P6 projects without an approved revision"
    description: "Schedules reported on the latest draft (labelled) because no revision is approved."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'PLN-01'"
  - key: kpi_pln12
    name: "KPI · PLN-12 P6 labour hours consumed % (latest draft)"
    description: "Actual labour hours / budget labour hours on the latest P6 draft."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'PLN-12'"
  - key: kpi_pro11
    name: "KPI · PRO-11 Productivity factor (P6 basis)"
    description: "Earned labour hours / actual labour hours on the latest P6 draft (PF basis is DEC-20)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'PRO-11'"
  - key: kpi_prc03
    name: "KPI · PRC-03 Pending approval steps"
    description: "Approval steps currently waiting for action."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'PRC-03'"
  - key: kpi_prc05
    name: "KPI · PRC-05 Pending at the top bottleneck role"
    description: "Pending steps held by the role with the most pending steps (roles, never people)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'PRC-05'"
  - key: kpi_adp01
    name: "KPI · ADP-01 Active users this month"
    description: "Distinct users with activity this month (telemetry and audit)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ADP-01'"
  - key: kpi_adp04
    name: "KPI · ADP-04 Audited export events (PMSv2)"
    description: "Export events audited in PMSv2."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ADP-04'"
  - key: kpi_eng31
    name: "KPI · ENG-31 Revisions from the migration replay %"
    description: "Share of DMS revisions entered by the 10-12 Nov 2026 migration (disclosure)."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'ENG-31'"
  - key: kpi_dqlive
    name: "KPI · Modules live (holding data)"
    description: "PMSv2 modules whose key tables hold data."
    datasource: default
    refresh: daily
    sql: "SELECT value, unit, caveat FROM rpt.exec_summary WHERE kpi_id = 'DQ-LIVE'"

  # ---------------------------------------------------------------- engineering & document control
  - key: eng_progress_by_project
    name: "ENG · Engineering progress by project"
    description: "Credit-based progress % and document count per project (top 15 by documents)."
    datasource: default
    refresh: daily
    sql: |
      SELECT TOP 15 r.project_number, MAX(p.project_name) AS project_name,
             CAST(100.0 * SUM(r.credit) / NULLIF(COUNT(*), 0) AS decimal(5,1)) AS progress_pct,
             COUNT(*) AS documents
      FROM rpt.eng_document_register r
      LEFT JOIN rpt.dim_project p ON p.project_key = r.project_key
      WHERE r.is_excluded = 0
      GROUP BY r.project_number
      ORDER BY COUNT(*) DESC
  - key: eng_pipeline
    name: "ENG · Document pipeline (where documents are)"
    description: "Documents by pipeline state."
    datasource: default
    refresh: daily
    sql: |
      SELECT pipeline_state_label AS pipeline_state, COUNT(*) AS documents
      FROM rpt.eng_document_register
      WHERE is_excluded = 0
      GROUP BY pipeline_state_label
  - key: eng_overdue_aging
    name: "ENG · Overdue documents by age"
    description: "Overdue documents in ageing bins (target date, Riyadh business date)."
    datasource: default
    refresh: daily
    sql: |
      SELECT overdue_bin_label AS overdue_age, MIN(bin_order) AS bin_order, SUM(documents) AS documents
      FROM rpt.eng_overdue_aging
      WHERE is_excluded = 0 AND overdue_bin <> 'not_overdue'
      GROUP BY overdue_bin_label
      ORDER BY MIN(bin_order)
  - key: eng_transmittals_monthly
    name: "ENG · Transmittals issued per month"
    description: "Issued (non-draft) transmittals by month and type since January 2025."
    datasource: default
    refresh: daily
    sql: |
      SELECT issued_month,
             SUM(CASE WHEN transmittal_type = 'external' THEN 1 ELSE 0 END) AS [External (client)],
             SUM(CASE WHEN transmittal_type = 'internal' THEN 1 ELSE 0 END) AS [Internal],
             SUM(CASE WHEN transmittal_type = 'vendor'   THEN 1 ELSE 0 END) AS [Vendor],
             SUM(CASE WHEN transmittal_type NOT IN ('external', 'internal', 'vendor') THEN 1 ELSE 0 END) AS [Other]
      FROM rpt.eng_transmittal_register
      WHERE is_draft = 0 AND is_excluded = 0 AND issued_month >= '2025-01-01'
      GROUP BY issued_month
      ORDER BY issued_month
  - key: eng_turnaround_monthly
    name: "ENG · Client turnaround by return month"
    description: "Median and average days from issue to client return, by return month since January 2025."
    datasource: default
    refresh: daily
    sql: |
      SELECT DISTINCT return_month,
             CAST(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY turnaround_days)
                  OVER (PARTITION BY return_month) AS decimal(6,1)) AS median_days,
             COUNT(*) OVER (PARTITION BY return_month) AS responses
      FROM rpt.eng_transmittal_response
      WHERE is_responded = 1 AND turnaround_days IS NOT NULL AND is_excluded = 0
        AND return_month >= '2025-01-01'
      ORDER BY return_month
  - key: eng_sdrl_601
    name: "ENG · SDRL submission status (NMR 601)"
    description: "Documents requiring stage 601 by submission bucket."
    datasource: default
    refresh: daily
    sql: |
      SELECT bucket_label AS submission_status, COUNT(*) AS documents
      FROM rpt.eng_sdrl_status
      WHERE nmr_stage = '601' AND is_excluded = 0
      GROUP BY bucket_label
  - key: eng_with_client_by_project
    name: "ENG · Documents with client by project"
    description: "Documents awaiting the client and their median age, per project."
    datasource: default
    refresh: daily
    sql: |
      SELECT DISTINCT TOP 15 r.project_number, p.project_name,
             COUNT(*) OVER (PARTITION BY r.project_number) AS documents_with_client,
             CAST(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY r.with_client_age_days)
                  OVER (PARTITION BY r.project_number) AS decimal(6,1)) AS median_age_days
      FROM rpt.eng_document_register r
      LEFT JOIN rpt.dim_project p ON p.project_key = r.project_key
      WHERE r.pipeline_state_label = 'With client' AND r.is_excluded = 0
      ORDER BY documents_with_client DESC
  - key: eng_overdue_register
    name: "ENG · Overdue document register"
    description: "Every overdue document with stage and days overdue (export for the full list)."
    datasource: default
    refresh: daily
    sql: |
      SELECT r.project_number, p.project_name, r.document_number, r.doc_type_label AS document_type,
             r.pipeline_state_label AS pipeline_state, r.active_status_label AS current_status,
             r.active_revision_label AS revision, r.target_date, r.days_overdue, r.overdue_bin,
             b.overdue_bin_label AS overdue_age
      FROM rpt.eng_document_register r
      LEFT JOIN rpt.dim_project p ON p.project_key = r.project_key
      LEFT JOIN (SELECT DISTINCT overdue_bin, overdue_bin_label FROM rpt.eng_overdue_aging) b
             ON b.overdue_bin = r.overdue_bin
      WHERE r.is_overdue = 1 AND r.is_excluded = 0
      ORDER BY days_overdue DESC, project_number, document_number
  - key: eng_bom_coverage_units
    name: "ENG · BOM take-off coverage by unit"
    description: "BOM quantity and MTO-covered quantity per unit (never summed across units)."
    datasource: default
    refresh: daily
    sql: |
      SELECT bom_unit, COUNT(*) AS bom_lines, SUM(bom_qty) AS bom_qty,
             SUM(covered_qty_parity) AS covered_qty,
             CAST(100.0 * SUM(covered_qty_parity) / NULLIF(SUM(bom_qty), 0) AS decimal(5,1)) AS coverage_pct
      FROM rpt.eng_bom_coverage
      WHERE is_excluded = 0
      GROUP BY bom_unit
      ORDER BY COUNT(*) DESC

  # ---------------------------------------------------------------- commercial & bids (no money)
  - key: com_rfqs_monthly
    name: "COM · RFQs received per month"
    description: "RFQs received by month (Riyadh)."
    datasource: default
    refresh: daily
    sql: |
      SELECT c.month_start AS received_month, COUNT(r.rfq_key) AS rfqs
      FROM (SELECT DISTINCT month_start FROM rpt.dim_calendar
            WHERE month_start >= (SELECT MIN(received_month) FROM rpt.com_rfq_register WHERE is_excluded = 0)
              AND month_start <= (SELECT month_start_riyadh FROM rpt.v_clock)) c
      LEFT JOIN rpt.com_rfq_register r ON r.received_month = c.month_start AND r.is_excluded = 0
      GROUP BY c.month_start
      ORDER BY c.month_start
  - key: com_funnel
    name: "COM · Bid funnel by position"
    description: "RFQs by business position in the bid funnel."
    datasource: default
    refresh: daily
    sql: |
      SELECT funnel_position_label AS funnel_position, COUNT(*) AS rfqs
      FROM rpt.com_rfq_register
      WHERE is_excluded = 0
      GROUP BY funnel_position_label
  - key: com_outcomes
    name: "COM · Bid inquiry outcomes"
    description: "Received, quoted, awarded, converted, declined, cancelled and lost."
    datasource: default
    refresh: daily
    sql: |
      SELECT v.outcome, v.rfqs
      FROM (SELECT COUNT(*) AS received, SUM(CAST(is_quoted AS int)) AS quoted,
                   SUM(CAST(is_awarded AS int)) AS awarded, SUM(CAST(is_converted AS int)) AS converted,
                   SUM(CAST(is_declined AS int)) AS declined, SUM(CAST(is_cancelled AS int)) AS cancelled,
                   SUM(CAST(is_lost AS int)) AS lost
            FROM rpt.com_rfq_register WHERE is_excluded = 0) s
      CROSS APPLY (VALUES (1, 'Received', s.received), (2, 'Quoted', s.quoted), (3, 'Awarded', s.awarded),
                          (4, 'Converted to project', s.converted), (5, 'Declined', s.declined),
                          (6, 'Cancelled', s.cancelled), (7, 'Lost', s.lost)) AS v(sort_order, outcome, rfqs)
      ORDER BY v.sort_order
  - key: com_open_ageing
    name: "COM · Open RFQs by stage and age"
    description: "Open RFQs per current stage with the median days in that stage."
    datasource: default
    refresh: daily
    sql: |
      SELECT DISTINCT open_stage_label AS stage,
             COUNT(*) OVER (PARTITION BY open_stage_label) AS open_rfqs,
             CAST(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY open_stage_age_days)
                  OVER (PARTITION BY open_stage_label) AS decimal(6,1)) AS median_days_in_stage
      FROM rpt.com_rfq_register
      WHERE is_open_live = 1 AND is_excluded = 0
  - key: com_rfq_register
    name: "COM · RFQ summary register"
    description: "BRD §10.4 RFQ Summary: one row per RFQ (no values; values are restricted)."
    datasource: default
    refresh: daily
    sql: |
      SELECT rfq_number, bid_number, client_code,
             UPPER(LEFT(fabrication_category, 1)) + REPLACE(SUBSTRING(fabrication_category, 2, 200), '_', ' ') AS fabrication_category,
             UPPER(LEFT(rfq_type, 1)) + REPLACE(SUBSTRING(rfq_type, 2, 200), '_', ' ') AS rfq_type,
             funnel_position_label AS funnel_position, current_stage_label AS current_stage,
             received_on, bid_deadline_riyadh, submission_date, probability_pct,
             open_stage_label AS open_stage, open_stage_age_days, opco,
             CASE WHEN is_demo_or_test = 1 THEN 'Proposed exclusion' ELSE '' END AS data_flag,
             CAST(is_open_live AS int) AS is_open
      FROM rpt.com_rfq_register
      WHERE is_excluded = 0
      ORDER BY received_on DESC, rfq_number
  - key: com_pending_approvals
    name: "COM · Pending BD approval steps"
    description: "Pending RFQ approval steps by step and role, with median age."
    datasource: default
    refresh: daily
    sql: |
      SELECT step_name,
             CASE
                     WHEN approver_role IS NULL THEN 'Not assigned'
                     WHEN approver_role = 'planner' THEN 'Planner'
                     WHEN approver_role = 'bd' THEN 'Business development'
                     WHEN approver_role = 'bd_coordinator' THEN 'BD coordinator'
                     WHEN approver_role = 'bd_manager' THEN 'BD manager'
                     WHEN approver_role = 'estimator' THEN 'Estimator'
                     WHEN approver_role = 'engineering_manager' THEN 'Engineering manager'
                     WHEN approver_role = 'project_manager' THEN 'Project manager'
                     WHEN approver_role = 'finance' THEN 'Finance'
                     WHEN approver_role = 'qc_manager' THEN 'QC manager'
                     WHEN approver_role = 'composite' THEN 'Several roles together'
                     WHEN approver_role = 'attr:record.estimation_engineer_id' THEN 'Assigned estimation engineer'
                     WHEN approver_role LIKE 'attr:record.%' THEN 'The person assigned on the record'
                     ELSE UPPER(LEFT(approver_role, 1)) + REPLACE(SUBSTRING(approver_role, 2, 200), '_', ' ')
                   END AS approver_role,
             pending_steps, median_age_days
      FROM (SELECT DISTINCT step_name, approver_role,
                   COUNT(*) OVER (PARTITION BY step_name, approver_role) AS pending_steps,
                   CAST(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY age_days)
                        OVER (PARTITION BY step_name, approver_role) AS decimal(6,1)) AS median_age_days
            FROM rpt.gov_approval_step
            WHERE is_pending = 1 AND module_code = 'commercial.rfq' AND is_excluded = 0) s
      ORDER BY pending_steps DESC, step_name

  # ---------------------------------------------------------------- projects & gates
  - key: prj_by_origin
    name: "PRJ · Projects by origin"
    description: "Active projects by origin (created in PMSv2, converted from RFQ, migrated)."
    datasource: default
    refresh: daily
    sql: |
      SELECT CASE origin WHEN 'converted_from_rfq' THEN 'Won through the bid process'
                         WHEN 'direct_or_migrated' THEN 'Created directly or migrated'
                         ELSE REPLACE(origin, '_', ' ') END AS origin,
             COUNT(*) AS projects
      FROM rpt.dim_project
      WHERE is_excluded = 0
      GROUP BY origin
  - key: prj_gates_by_status
    name: "PRJ · Gate instances by gate and status"
    description: "Stage-gate progression across projects."
    datasource: default
    refresh: daily
    sql: |
      SELECT CONCAT(gate_sequence, '. ', gate_name) AS gate,
             SUM(CASE WHEN is_passed = 1 THEN 1 ELSE 0 END) AS [Passed],
             SUM(CASE WHEN is_in_review = 1 THEN 1 ELSE 0 END) AS [In review],
             SUM(CASE WHEN is_blocked = 1 THEN 1 ELSE 0 END) AS [Blocked],
             SUM(CASE WHEN is_passed = 0 AND is_in_review = 0 AND is_blocked = 0 THEN 1 ELSE 0 END) AS [Pending]
      FROM rpt.prj_gate_status
      WHERE is_excluded = 0
      GROUP BY gate_sequence, gate_name
      ORDER BY gate_sequence
  - key: prj_master_completeness
    name: "PRJ · Project master-data completeness"
    description: "Per project: which reporting inputs exist (value, PM, schedule, WBS, gates, documents)."
    datasource: default
    refresh: daily
    sql: |
      SELECT project_number, project_name,
             CASE origin WHEN 'converted_from_rfq' THEN 'Won through the bid process'
                         WHEN 'direct_or_migrated' THEN 'Created directly or migrated'
                         ELSE REPLACE(origin, '_', ' ') END AS origin,
             status_label AS status, opco,
             CASE WHEN has_contract_value = 1 THEN 'yes' ELSE 'no' END AS contract_value,
             CASE WHEN planned_end_date IS NOT NULL THEN 'yes' ELSE 'no' END AS planned_end,
             CASE WHEN has_project_manager = 1 THEN 'yes' ELSE 'no' END AS project_manager,
             CASE WHEN has_p6_schedule = 1 THEN 'yes' ELSE 'no' END AS p6_schedule,
             CASE WHEN has_wbs = 1 THEN 'yes' ELSE 'no' END AS wbs,
             CASE WHEN has_gates = 1 THEN 'yes' ELSE 'no' END AS gates,
             document_count
      FROM rpt.dim_project
      WHERE is_excluded = 0
      ORDER BY document_count DESC
  - key: prj_wbs_status
    name: "PRJ · WBS nodes by approval status"
    description: "WBS structure approval status."
    datasource: default
    refresh: daily
    sql: |
      SELECT status_label AS wbs_status, COUNT(*) AS wbs_nodes
      FROM rpt.prj_wbs_summary
      WHERE is_excluded = 0
      GROUP BY status_label

  # ---------------------------------------------------------------- planning (P6 hours)
  - key: pln_schedule_status
    name: "PLN · P6 schedule status"
    description: "Which P6 revision each project is reported on, and why (latest draft is labelled)."
    datasource: default
    refresh: daily
    sql: |
      SELECT project_number,
             (SELECT p.project_name FROM rpt.dim_project p WHERE p.project_key = s.project_key) AS project_name,
             revision_basis_label AS reported_on, revision_number,
             UPPER(LEFT(revision_status, 1)) + REPLACE(SUBSTRING(revision_status, 2, 200), '_', ' ') AS revision_status,
             data_date, data_date_age_days, activity_count, status_reason,
             CASE WHEN is_p6_duplicate = 1 THEN 'duplicate of another schedule (excluded from totals)' ELSE '' END AS note
      FROM rpt.p6_schedule_status s
      ORDER BY project_number
  - key: pln_labour_scurve
    name: "PLN · Labour hours S-curve (planned vs earned, latest draft)"
    description: "Cumulative planned vs cumulative earned labour hours per week (P6, duplicates excluded)."
    datasource: default
    refresh: daily
    sql: |
      SELECT w.week_start,
             CAST(w.planned_cum AS decimal(12,0)) AS [Planned cumulative],
             CASE WHEN w.week_start <= MAX(CASE WHEN w.earned > 0 THEN w.week_start END) OVER ()
                  THEN CAST(SUM(w.earned) OVER (ORDER BY w.week_start ROWS UNBOUNDED PRECEDING) AS decimal(12,0))
             END AS [Earned cumulative]
      FROM (SELECT week_start, SUM(planned_hours_cum) AS planned_cum, SUM(earned_hours) AS earned
            FROM rpt.p6_hours_weekly
            WHERE resource_type = 'labor' AND is_p6_duplicate = 0 AND is_excluded = 0
            GROUP BY week_start) w
      ORDER BY w.week_start
  - key: pln_hours_by_type
    name: "PLN · P6 hours budget vs actual vs earned by resource type"
    description: "Budget, actual and earned hours per resource type on the reported revision."
    datasource: default
    refresh: daily
    sql: |
      SELECT CASE resource_type WHEN 'labor' THEN 'Labour' WHEN 'equipment' THEN 'Equipment'
                                WHEN 'material' THEN 'Material'
                                ELSE UPPER(LEFT(resource_type, 1)) + SUBSTRING(resource_type, 2, 200) END AS resource_type,
             CAST(SUM(budget_hours) AS decimal(12,0)) AS [Budget hours],
             CAST(SUM(actual_hours) AS decimal(12,0)) AS [Actual hours],
             CAST(SUM(earned_hours) AS decimal(12,0)) AS [Earned hours]
      FROM rpt.p6_resource_hours
      WHERE is_p6_duplicate = 0 AND is_excluded = 0 AND is_dummy_resource = 0
      GROUP BY resource_type
      ORDER BY resource_type
  - key: pln_activity_status
    name: "PLN · P6 activities by status"
    description: "Activities on the reported revision by status."
    datasource: default
    refresh: daily
    sql: |
      SELECT status_label AS activity_status, COUNT(*) AS activities
      FROM rpt.p6_activity_progress
      WHERE is_p6_duplicate = 0 AND is_excluded = 0
      GROUP BY status_label

  # ---------------------------------------------------------------- process & adoption
  - key: prc_pending_by_role
    name: "PRC · Pending approval steps by role"
    description: "Pending approval steps per approver role (roles, never people)."
    datasource: default
    refresh: daily
    sql: |
      SELECT CASE
               WHEN approver_role IS NULL THEN 'Not assigned'
               WHEN approver_role = 'planner' THEN 'Planner'
               WHEN approver_role = 'bd' THEN 'Business development'
               WHEN approver_role = 'bd_coordinator' THEN 'BD coordinator'
               WHEN approver_role = 'bd_manager' THEN 'BD manager'
               WHEN approver_role = 'estimator' THEN 'Estimator'
               WHEN approver_role = 'engineering_manager' THEN 'Engineering manager'
               WHEN approver_role = 'project_manager' THEN 'Project manager'
               WHEN approver_role = 'finance' THEN 'Finance'
               WHEN approver_role = 'qc_manager' THEN 'QC manager'
               WHEN approver_role = 'composite' THEN 'Several roles together'
               WHEN approver_role = 'attr:record.estimation_engineer_id' THEN 'Assigned estimation engineer'
               WHEN approver_role LIKE 'attr:record.%' THEN 'The person assigned on the record'
               ELSE UPPER(LEFT(approver_role, 1)) + REPLACE(SUBSTRING(approver_role, 2, 200), '_', ' ')
             END AS approver_role,
             COUNT(*) AS pending_steps
      FROM rpt.gov_approval_step
      WHERE is_pending = 1 AND is_excluded = 0
      GROUP BY approver_role
      ORDER BY COUNT(*) DESC
  - key: prc_pending_by_age
    name: "PRC · Pending approval steps by age"
    description: "Pending approval steps by waiting time."
    datasource: default
    refresh: daily
    sql: |
      SELECT CASE age_bin WHEN 'd0_2' THEN '0-2 days' WHEN 'd3_7' THEN '3-7 days'
                          WHEN 'd8_30' THEN '8-30 days' WHEN 'd30_plus' THEN 'over 30 days'
                          ELSE age_bin END AS waiting,
             MIN(CASE age_bin WHEN 'd0_2' THEN 1 WHEN 'd3_7' THEN 2 WHEN 'd8_30' THEN 3 ELSE 4 END) AS sort_order,
             COUNT(*) AS pending_steps
      FROM rpt.gov_approval_step
      WHERE is_pending = 1 AND is_excluded = 0
      GROUP BY age_bin
      ORDER BY MIN(CASE age_bin WHEN 'd0_2' THEN 1 WHEN 'd3_7' THEN 2 WHEN 'd8_30' THEN 3 ELSE 4 END)
  - key: prc_pending_by_module
    name: "PRC · Pending approval steps by module"
    description: "Where approvals are waiting (WBS, RFQ, MTO, ...)."
    datasource: default
    refresh: daily
    sql: |
      SELECT module_label AS module, COUNT(*) AS pending_steps
      FROM rpt.gov_approval_step
      WHERE is_pending = 1 AND is_excluded = 0
      GROUP BY module_label
  - key: adp_active_users_monthly
    name: "ADP · Active users per month"
    description: "Distinct active users per month (telemetry and audit)."
    datasource: default
    refresh: daily
    sql: |
      SELECT activity_month, active_users, users_logged_in
      FROM rpt.sys_active_users_monthly
      ORDER BY activity_month
  - key: adp_hours_by_module
    name: "ADP · Active hours by module (last 30 days)"
    description: "Where people spend their time in PMSv2."
    datasource: default
    refresh: daily
    sql: |
      SELECT UPPER(LEFT(module, 1)) + REPLACE(SUBSTRING(module, 2, 200), '_', ' ') AS module,
             CAST(SUM(active_hours) AS decimal(10,1)) AS active_hours
      FROM rpt.sys_activity_daily
      WHERE activity_date >= DATEADD(day, -30, (SELECT today_riyadh FROM rpt.v_clock))
      GROUP BY module
      ORDER BY SUM(active_hours) DESC

  # ---------------------------------------------------------------- data readiness (PMO)
  - key: dq_module_liveness
    name: "DQ · Module liveness"
    description: "Which PMSv2 modules hold data, since when, and how recently they were used."
    datasource: default
    refresh: daily
    sql: |
      SELECT module_name AS module, data_status_label AS data_status, key_table_rows,
             populated_tables, tables, first_business_date, last_business_date,
             days_since_last_entry, go_live_note
      FROM rpt.dq_module_liveness
      ORDER BY sort_order
  - key: dq_readiness_checks
    name: "DQ · Data readiness checks"
    description: "Portfolio-level data-quality checks with the affected share and the backlog item."
    datasource: default
    refresh: daily
    sql: |
      SELECT check_code, check_name, kpi_id, SUM(affected) AS affected, SUM(population) AS population,
             CAST(100.0 * SUM(affected) / NULLIF(SUM(population), 0) AS decimal(5,1)) AS affected_pct,
             MAX(backlog_ref) AS backlog_item
      FROM rpt.dq_data_readiness
      GROUP BY check_code, check_name, kpi_id
      ORDER BY check_code
  - key: dq_exclusion_candidates
    name: "DQ · Test and demonstration records proposed for exclusion"
    description: "Candidates awaiting confirmation (DEC-16); nothing is excluded until confirmed."
    datasource: default
    refresh: daily
    sql: |
      SELECT CASE entity_type WHEN 'rfq' THEN 'RFQ' WHEN 'nmr_import_batch' THEN 'NMR import batch'
                              ELSE UPPER(LEFT(entity_type, 1)) + REPLACE(SUBSTRING(entity_type, 2, 200), '_', ' ') END AS entity_type,
             reason_code, candidate_reason,
             CASE proposed_action WHEN 'exclude_from_p6_totals' THEN 'Exclude from P6 totals'
                                  ELSE UPPER(LEFT(proposed_action, 1)) + REPLACE(SUBSTRING(proposed_action, 2, 200), '_', ' ') END AS proposed_action,
             UPPER(LEFT(status, 1)) + REPLACE(SUBSTRING(status, 2, 200), '_', ' ') AS status,
             SUM(rows_affected) AS rows_affected, COUNT(*) AS candidates
      FROM rpt.dq_exclusion_candidate
      GROUP BY entity_type, reason_code, candidate_reason, proposed_action, status
      ORDER BY SUM(rows_affected) DESC
  - key: dq_load_info
    name: "DQ · Restore and load information"
    description: "Which backup the reporting copy came from, when it was restored and conditioned."
    datasource: default
    refresh: daily
    sql: |
      SELECT database_name, source_server, source_database,
             CASE backup_type WHEN 'D' THEN 'Full database' WHEN 'I' THEN 'Differential'
                              WHEN 'L' THEN 'Transaction log' ELSE backup_type END AS backup_type,
             is_copy_only,
             CASE WHEN has_backup_checksums = 1 THEN 'Yes' ELSE 'No' END AS has_backup_checksums,
             backup_finish_riyadh, snapshot_date, restored_at_utc,
             conditioned_at_utc, migration_count, layer_version,
             CASE freshness_status WHEN 'stale' THEN 'Refresh overdue' WHEN 'fresh' THEN 'Current'
                                   ELSE freshness_status END AS freshness_status
      FROM rpt.load_info

  # ------------------------------------------------------------------ management views
  - key: mgmt_bid_conversion
    name: "MGT · From enquiry to project (bid conversion)"
    description: "How many enquiries were quoted, won and became projects."
    datasource: default
    refresh: daily
    sql: |
      SELECT stage, rfqs FROM (
        SELECT 1 AS step, 'Enquiries received' AS stage, COUNT(*) AS rfqs
        FROM rpt.com_rfq_register WHERE is_excluded = 0
        UNION ALL SELECT 2, 'Quoted', SUM(CAST(is_quoted AS int))
        FROM rpt.com_rfq_register WHERE is_excluded = 0
        UNION ALL SELECT 3, 'Won', SUM(CAST(is_awarded AS int))
        FROM rpt.com_rfq_register WHERE is_excluded = 0
        UNION ALL SELECT 4, 'Became a project', SUM(CAST(is_converted AS int))
        FROM rpt.com_rfq_register WHERE is_excluded = 0
      ) f
      ORDER BY step

  - key: mgmt_overdue_by_project
    name: "MGT · Projects with the most overdue documents"
    description: "Overdue documents per project: where engineering delivery is slipping."
    datasource: default
    refresh: daily
    sql: |
      SELECT r.project_number, MAX(p.project_name) AS project_name,
             SUM(CAST(r.is_overdue AS int)) AS overdue_documents
      FROM rpt.eng_document_register r
      LEFT JOIN rpt.dim_project p ON p.project_key = r.project_key
      WHERE r.is_excluded = 0
      GROUP BY r.project_number
      HAVING SUM(CAST(r.is_overdue AS int)) > 0
      ORDER BY SUM(CAST(r.is_overdue AS int)) DESC

  - key: mgmt_labour_by_project
    name: "MGT · Labour hours spent against budget, by project (P6 latest draft)"
    description: "Labour hours booked against the budgeted hours per project, from the latest draft schedule."
    datasource: default
    refresh: daily
    sql: |
      SELECT h.project_number, MAX(p.project_name) AS project_name,
             CAST(SUM(h.actual_hours) AS decimal(14,0)) AS hours_spent,
             CAST(SUM(h.budget_hours) AS decimal(14,0)) AS hours_budget
      FROM rpt.p6_resource_hours h
      LEFT JOIN rpt.dim_project p ON p.project_key = h.project_key
      WHERE h.is_excluded = 0 AND h.is_p6_duplicate = 0 AND h.resource_type = 'labor'
      GROUP BY h.project_number
      ORDER BY h.project_number


  # ---- Lists behind the figures (opened by clicking a figure on a board) ----------
  # Each list counts exactly what the figure that opens it counts; the labels are the
  # ones the aggregates use, so a clicked category filters the list by equality.
  # ORDER BY names OUTPUT columns and ends on a unique key: the board pages these
  # lists in the database, which keeps a trailing ORDER BY only when it names output
  # columns, and pages of a non-unique order may repeat or skip rows.
  - key: eng_document_list
    name: "ENG · Document list (behind the pipeline and progress figures)"
    description: "Every reported document: project, stage, status, revision, target date."
    datasource: default
    refresh: daily
    sql: |
      SELECT r.project_number, p.project_name, r.document_number, r.doc_type_label AS document_type,
             r.pipeline_state_label AS pipeline_state, r.active_status_label AS current_status,
             r.active_revision_label AS revision, r.target_date,
             CASE WHEN r.is_overdue = 1 THEN r.days_overdue END AS days_overdue
      FROM rpt.eng_document_register r
      LEFT JOIN rpt.dim_project p ON p.project_key = r.project_key
      WHERE r.is_excluded = 0
      ORDER BY project_number, document_number

  - key: eng_with_client_register
    name: "ENG · Documents waiting for the client"
    description: "Documents issued to the client and awaiting a response, longest wait first."
    datasource: default
    refresh: daily
    sql: |
      SELECT r.project_number, p.project_name, r.document_number, r.doc_type_label AS document_type,
             r.active_revision_label AS revision, r.with_client_since,
             r.with_client_age_days AS days_with_client
      FROM rpt.eng_document_register r
      LEFT JOIN rpt.dim_project p ON p.project_key = r.project_key
      WHERE r.pipeline_state_label = 'With client' AND r.is_excluded = 0
      ORDER BY days_with_client DESC, project_number, document_number

  - key: prc_pending_list
    name: "PRC · Approval steps waiting (list)"
    description: "Every pending approval step: module, what it is for, the step, who it waits for, since when. Roles only, never people."
    datasource: default
    refresh: daily
    sql: |
      SELECT s.module_label AS module, s.module_code,
             COALESCE(s.rfq_number, p.project_number, '—') AS reference,
             p.project_name, s.step_name AS step,
             CASE
               WHEN s.approver_role IS NULL THEN 'Not assigned'
               WHEN s.approver_role = 'planner' THEN 'Planner'
               WHEN s.approver_role = 'bd' THEN 'Business development'
               WHEN s.approver_role = 'bd_coordinator' THEN 'BD coordinator'
               WHEN s.approver_role = 'bd_manager' THEN 'BD manager'
               WHEN s.approver_role = 'estimator' THEN 'Estimator'
               WHEN s.approver_role = 'engineering_manager' THEN 'Engineering manager'
               WHEN s.approver_role = 'project_manager' THEN 'Project manager'
               WHEN s.approver_role = 'finance' THEN 'Finance'
               WHEN s.approver_role = 'qc_manager' THEN 'QC manager'
               WHEN s.approver_role = 'composite' THEN 'Several roles together'
               WHEN s.approver_role = 'attr:record.estimation_engineer_id' THEN 'Assigned estimation engineer'
               WHEN s.approver_role LIKE 'attr:record.%' THEN 'The person assigned on the record'
               ELSE UPPER(LEFT(s.approver_role, 1)) + REPLACE(SUBSTRING(s.approver_role, 2, 200), '_', ' ')
             END AS approver_role,
             s.pending_on AS waiting_since, s.age_days AS days_waiting,
             CASE s.age_bin WHEN 'd0_2' THEN '0-2 days' WHEN 'd3_7' THEN '3-7 days'
                            WHEN 'd8_30' THEN '8-30 days' WHEN 'd30_plus' THEN 'over 30 days'
                            ELSE s.age_bin END AS waiting,
             s.step_key AS step_ref
      FROM rpt.gov_approval_step s
      LEFT JOIN rpt.dim_project p ON p.project_key = s.object_project_key
      WHERE s.is_pending = 1 AND s.is_excluded = 0
      ORDER BY days_waiting DESC, reference, step_ref

  - key: prj_project_list
    name: "PRJ · Project list"
    description: "Every reported project: number, name, status, origin, dates, documents."
    datasource: default
    refresh: daily
    sql: |
      SELECT project_number, project_name, status_label AS status, status AS status_code,
             CASE origin WHEN 'converted_from_rfq' THEN 'Won through the bid process'
                         WHEN 'direct_or_migrated' THEN 'Created directly or migrated'
                         ELSE REPLACE(origin, '_', ' ') END AS origin,
             opco, start_date, planned_end_date, document_count
      FROM rpt.dim_project
      WHERE is_excluded = 0
      ORDER BY project_number

dashboards:
  # ======================================================================== EXECUTIVE
  - key: executive
    name: "Executive Overview"
    description: "What management needs to know this week: engineering delivery, winning work, bottlenecks and hours, in plain numbers from the last nightly backup."
    filters: []
    widgets:
      # ---- 1. Engineering delivery ------------------------------------------------
      - {title: "Engineering delivery", type: text, config: {content: "Are we producing the documents our projects need, and getting them approved?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Engineering progress", type: kpi, dataset: kpi_eng01, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Engineering progress", caption: "Share of all document work completed, weighted by progress credit."}, layout: {x: 0, y: 2, w: 3, h: 4}}
      - {title: "Overdue documents", type: kpi, dataset: kpi_eng07, config: {drill: {dataset: eng_overdue_register, title: "Overdue documents", label: "See the documents", columns: &overdue_cols [{field: project_number, label: "Project"}, {field: project_name, label: "Project name"}, {field: document_number, label: "Document"}, {field: document_type, label: "Type"}, {field: pipeline_state, label: "Where it is"}, {field: target_date, label: "Target date"}, {field: days_overdue, label: "Days overdue"}]}, value_field: value, rollup: sum, direction: lower_better, label: "Overdue documents", caption: "Past their submission date and not yet done."}, layout: {x: 3, y: 2, w: 3, h: 4}}
      - {title: "Waiting for the client", type: kpi, dataset: kpi_eng13, config: {drill: {dataset: eng_with_client_register, title: "Documents waiting for the client", label: "See the documents", columns: &client_cols [{field: project_number, label: "Project"}, {field: project_name, label: "Project name"}, {field: document_number, label: "Document"}, {field: document_type, label: "Type"}, {field: revision, label: "Revision"}, {field: with_client_since, label: "With the client since"}, {field: days_with_client, label: "Days waiting"}]}, value_field: value, rollup: sum, direction: lower_better, label: "Documents waiting for the client", caption: "Issued to the client and awaiting their response."}, layout: {x: 6, y: 2, w: 3, h: 4}}
      - {title: "Client turnaround", type: kpi, dataset: eng_turnaround_monthly, config: {value_field: median_days, trend_field: median_days, value_from: last, rollup: avg, unit: d, direction: lower_better, delta_label: "vs previous month", label: "Client turnaround, latest month", caption: "Median days to return our documents."}, layout: {x: 9, y: 2, w: 3, h: 4}}
      - {title: "Projects with the most overdue documents", type: bar_list, dataset: mgmt_overdue_by_project, config: {name_field: project_name, drill: {dataset: eng_overdue_register, field: project_number, title: "Overdue documents", columns: *overdue_cols}, category_field: project_number, value_field: overdue_documents, limit: 6, caption: "Where delivery is slipping: start the conversation here."}, layout: {x: 0, y: 6, w: 6, h: 7}}
      - {title: "Engineering progress by project", type: progress, dataset: eng_progress_by_project, config: {name_field: project_name, drill: {dataset: eng_document_list, field: project_number, title: "Documents", columns: &docs_cols [{field: project_number, label: "Project"}, {field: project_name, label: "Project name"}, {field: document_number, label: "Document"}, {field: document_type, label: "Type"}, {field: pipeline_state, label: "Where it is"}, {field: revision, label: "Revision"}, {field: target_date, label: "Target date"}, {field: days_overdue, label: "Days overdue"}]}, category_field: project_number, value_field: progress_pct, target: 100, unit: "%", direction: higher_better, limit: 5, caption: "Largest projects by document count."}, layout: {x: 6, y: 6, w: 6, h: 7}}
      - {title: "How late the overdue documents are", type: bar_list, dataset: eng_overdue_aging, config: {drill: {dataset: eng_overdue_register, field: overdue_age, title: "Overdue documents", columns: *overdue_cols}, category_field: overdue_age, value_field: documents, sort: false, tones: {"1-7 days": neutral, "8-14 days": watch, "15-30 days": serious, "More than 30 days": act}, caption: "Older items need escalation, not reminders."}, layout: {x: 0, y: 13, w: 6, h: 6}}
      - {title: "Where the documents are now", type: bar_list, dataset: eng_pipeline, config: {drill: {dataset: eng_document_list, field: pipeline_state, title: "Documents", columns: *docs_cols}, category_field: pipeline_state, value_field: documents, limit: 5, caption: "Every document by the step it is waiting in."}, layout: {x: 6, y: 13, w: 6, h: 6}}

      # ---- 2. Winning work ---------------------------------------------------------
      - {title: "Winning work", type: text, config: {content: "Are enquiries coming in, and are we converting them into projects?"}, layout: {x: 0, y: 19, w: 12, h: 2}}
      - {title: "Open enquiries", type: kpi, dataset: kpi_com11, config: {drill: {dataset: com_rfq_register, filters: [{column: is_open, value: 1}], title: "Open enquiries", label: "See the enquiries", columns: &rfqs_cols [{field: rfq_number, label: "RFQ"}, {field: client_code, label: "Client"}, {field: fabrication_category, label: "Category"}, {field: open_stage, label: "Waiting at"}, {field: open_stage_age_days, label: "Days in stage"}, {field: received_on, label: "Received"}, {field: bid_deadline_riyadh, label: "Bid deadline"}]}, value_field: value, rollup: sum, label: "Enquiries open in the bid process", caption: "RFQs still being worked by business development."}, layout: {x: 0, y: 21, w: 3, h: 4}}
      - {title: "New enquiries", type: kpi, dataset: com_rfqs_monthly, config: {value_field: rfqs, trend_field: rfqs, value_from: last_complete, rollup: sum, direction: higher_better, delta_label: "vs the month before", label: "Enquiries received, last full month", caption: "The running month is left out until it ends."}, layout: {x: 3, y: 21, w: 3, h: 4}}
      - {title: "Bids won", type: kpi, dataset: kpi_com09, config: {value_field: value, rollup: sum, direction: higher_better, label: "Bids won", caption: "Awarded or purchase order received."}, layout: {x: 6, y: 21, w: 3, h: 4}}
      - {title: "Waiting for a decision", type: kpi, dataset: kpi_com16, config: {drill: {dataset: prc_pending_list, filters: [{column: module_code, value: commercial.rfq}], title: "Bids waiting for an approval", label: "See the approvals", columns: &approvals_cols [{field: module, label: "Module"}, {field: reference, label: "For"}, {field: project_name, label: "Project name"}, {field: step, label: "Step"}, {field: approver_role, label: "Waiting for"}, {field: waiting_since, label: "Since"}, {field: days_waiting, label: "Days waiting"}]}, value_field: value, rollup: sum, direction: lower_better, label: "Enquiries waiting for a BD approval", caption: "A bid cannot move until someone approves it."}, layout: {x: 9, y: 21, w: 3, h: 4}}
      - {title: "From enquiry to project", type: funnel, dataset: mgmt_bid_conversion, config: {category_field: stage, value_field: rfqs, caption: "Each step as a share of all enquiries received."}, layout: {x: 0, y: 25, w: 6, h: 6}}
      - {title: "Where open enquiries are waiting", type: bar_list, dataset: com_open_ageing, config: {drill: {dataset: com_rfq_register, field: open_stage, filters: [{column: is_open, value: 1}], title: "Open enquiries", columns: *rfqs_cols}, category_field: stage, value_field: open_rfqs, limit: 8, caption: "Open RFQs by the stage they sit in."}, layout: {x: 6, y: 25, w: 6, h: 6}}
      - {title: "Enquiries received per month", type: bar, dataset: com_rfqs_monthly, config: {category_field: received_month, category_format: month, value_field: rfqs, rollup: none, caption: "Is the pipeline filling up or drying out?"}, layout: {x: 0, y: 31, w: 12, h: 6}}

      # ---- 3. Bottlenecks ----------------------------------------------------------
      - {title: "Bottlenecks", type: text, config: {content: "Which approvals are holding work up, and for how long?"}, layout: {x: 0, y: 37, w: 12, h: 2}}
      - {title: "Approvals waiting", type: kpi, dataset: kpi_prc03, config: {drill: {dataset: prc_pending_list, title: "Approvals waiting", label: "See the approvals", columns: *approvals_cols}, value_field: value, rollup: sum, direction: lower_better, label: "Approval steps waiting for someone", caption: "Across every module: bids, MTOs, WBS, documents."}, layout: {x: 0, y: 39, w: 3, h: 6}}
      - {title: "Who the approvals are waiting for", type: bar_list, dataset: prc_pending_by_role, config: {drill: {dataset: prc_pending_list, field: approver_role, title: "Approvals waiting", columns: *approvals_cols}, category_field: approver_role, value_field: pending_steps, limit: 5, caption: "The roles with the longest queues."}, layout: {x: 3, y: 39, w: 5, h: 6}}
      - {title: "How long approvals have waited", type: bar_list, dataset: prc_pending_by_age, config: {drill: {dataset: prc_pending_list, field: waiting, title: "Approvals waiting", columns: *approvals_cols}, category_field: waiting, value_field: pending_steps, sort: false, tones: {"0-2 days": neutral, "3-7 days": neutral, "8-30 days": watch, "over 30 days": act}, caption: "Anything over 30 days is a stalled decision."}, layout: {x: 8, y: 39, w: 4, h: 6}}

      # ---- 4. Schedule and hours ---------------------------------------------------
      - {title: "Schedule and hours", type: text, config: {content: "Are we spending hours as planned? (P6 figures use the latest draft schedule: no revision is approved yet.)"}, layout: {x: 0, y: 45, w: 12, h: 2}}
      - {title: "Labour hours spent against budget", type: progress, dataset: mgmt_labour_by_project, config: {name_field: project_name, category_field: project_number, value_field: hours_spent, target_field: hours_budget, unit: h, direction: lower_better, caption: "Over 100% means the budget is spent."}, layout: {x: 0, y: 47, w: 6, h: 5}}
      - {title: "Labour productivity", type: kpi, dataset: kpi_pro11, config: {value_field: value, rollup: sum, unit: ratio, direction: higher_better, label: "Earned hours per hour spent", caption: "1.0 means on plan; below 1.0, hours run ahead of progress."}, layout: {x: 6, y: 47, w: 3, h: 5}}
      - {title: "Schedules not yet approved", type: kpi, dataset: kpi_pln01, config: {value_field: value, rollup: sum, direction: lower_better, label: "Projects reported on a draft schedule", caption: "Hours and progress here are only as good as the draft."}, layout: {x: 9, y: 47, w: 3, h: 5}}

      # ---- 5. Portfolio and adoption -----------------------------------------------
      - {title: "Portfolio and adoption", type: text, config: {content: "How big is the portfolio, and is the team using the system?"}, layout: {x: 0, y: 52, w: 12, h: 2}}
      - {title: "Active projects", type: kpi, dataset: kpi_prj01, config: {drill: {dataset: prj_project_list, filters: [{column: status_code, value: active}], title: "Active projects", label: "See the projects", columns: &projects_cols [{field: project_number, label: "Project"}, {field: project_name, label: "Project name"}, {field: status, label: "Status"}, {field: origin, label: "Origin"}, {field: opco, label: "Operating company"}, {field: start_date, label: "Start"}, {field: planned_end_date, label: "Planned end"}, {field: document_count, label: "Documents"}]}, value_field: value, rollup: sum, label: "Active projects", caption: "Projects with status active."}, layout: {x: 0, y: 54, w: 3, h: 4}}
      - {title: "Gates passed", type: kpi, dataset: kpi_prj05, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Project gates passed", caption: "Share of gates on active projects that are signed off."}, layout: {x: 3, y: 54, w: 3, h: 4}}
      - {title: "People using the system", type: kpi, dataset: adp_active_users_monthly, config: {value_field: active_users, trend_field: active_users, value_from: last, rollup: max, direction: higher_better, delta_label: "vs previous month", label: "Active users, latest month"}, layout: {x: 6, y: 54, w: 3, h: 4}}
      - {title: "Modules in use", type: kpi, dataset: kpi_dqlive, config: {value_field: value, rollup: sum, direction: higher_better, label: "PMSv2 modules holding data", caption: "Production, quality and dispatch figures appear once those modules are used."}, layout: {x: 9, y: 54, w: 3, h: 4}}

  # ======================================================================== ENGINEERING
  - key: engineering
    name: "Engineering & Document Control"
    description: "How far engineering has got, what is late, and how fast the client responds. Registers for follow-up at the end."
    filters: []
    widgets:
      # ---- 1. Delivery -------------------------------------------------------------
      - {title: "Delivery", type: text, config: {content: "How far has engineering got, and where are the documents now?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Engineering progress", type: kpi, dataset: kpi_eng01, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Engineering progress", caption: "Document work completed, weighted by progress credit. The official progress basis is still to be agreed."}, layout: {x: 0, y: 2, w: 3, h: 4}}
      - {title: "Drawings approved for construction", type: kpi, dataset: kpi_eng06, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Drawings approved for construction", caption: "Share of drawings the shop can build from."}, layout: {x: 3, y: 2, w: 3, h: 4}}
      - {title: "Material take-off coverage", type: kpi, dataset: kpi_mto01, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Bill of materials covered by take-off", caption: "Piece-count lines; other units are in the detail below."}, layout: {x: 6, y: 2, w: 3, h: 4}}
      - {title: "Revisions replaced", type: kpi, dataset: kpi_eng30, config: {value_field: value, rollup: sum, label: "Revisions replaced by a newer one", caption: "Normal while a design develops; a sharp rise means rework."}, layout: {x: 9, y: 2, w: 3, h: 4}}
      - {title: "Engineering progress by project", type: progress, dataset: eng_progress_by_project, config: {name_field: project_name, drill: {dataset: eng_document_list, field: project_number, title: "Documents", columns: *docs_cols}, category_field: project_number, value_field: progress_pct, target: 100, unit: "%", direction: higher_better, limit: 5, caption: "Largest projects by document count."}, layout: {x: 0, y: 6, w: 6, h: 7}}
      - {title: "Where the documents are now", type: bar_list, dataset: eng_pipeline, config: {drill: {dataset: eng_document_list, field: pipeline_state, title: "Documents", columns: *docs_cols}, category_field: pipeline_state, value_field: documents, limit: 8, caption: "Every document by the step it is waiting in."}, layout: {x: 6, y: 6, w: 6, h: 7}}

      # ---- 2. Late documents -------------------------------------------------------
      - {title: "Late documents", type: text, config: {content: "What is overdue, how late, and where? Target dates are still placeholders, so these counts overstate the backlog."}, layout: {x: 0, y: 13, w: 12, h: 2}}
      - {title: "Overdue documents", type: kpi, dataset: kpi_eng07, config: {drill: {dataset: eng_overdue_register, title: "Overdue documents", label: "See the documents", columns: *overdue_cols}, value_field: value, rollup: sum, direction: lower_better, label: "Overdue documents", caption: "Past their target date and not yet done."}, layout: {x: 0, y: 15, w: 4, h: 4}}
      - {title: "How late they are", type: bar_list, dataset: eng_overdue_aging, config: {drill: {dataset: eng_overdue_register, field: overdue_age, title: "Overdue documents", columns: *overdue_cols}, category_field: overdue_age, value_field: documents, sort: false, tones: {"1-7 days": neutral, "8-14 days": watch, "15-30 days": serious, "More than 30 days": act}, caption: "Older items need escalation, not reminders."}, layout: {x: 0, y: 19, w: 4, h: 5}}
      - {title: "Projects with the most overdue documents", type: bar_list, dataset: mgmt_overdue_by_project, config: {name_field: project_name, drill: {dataset: eng_overdue_register, field: project_number, title: "Overdue documents", columns: *overdue_cols}, category_field: project_number, value_field: overdue_documents, limit: 8, caption: "Where delivery is slipping."}, layout: {x: 4, y: 15, w: 8, h: 9}}

      # ---- 3. The client -----------------------------------------------------------
      - {title: "The client", type: text, config: {content: "Is the client responding, and how fast?"}, layout: {x: 0, y: 24, w: 12, h: 2}}
      - {title: "Client turnaround", type: kpi, dataset: eng_turnaround_monthly, config: {value_field: median_days, trend_field: median_days, value_from: last, rollup: avg, unit: d, direction: lower_better, delta_label: "vs previous month", label: "Client turnaround, latest month", caption: "Median days to return our documents."}, layout: {x: 0, y: 26, w: 3, h: 4}}
      - {title: "Submissions answered", type: kpi, dataset: kpi_eng11, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Client submissions answered", caption: "Share of our submissions the client has returned."}, layout: {x: 3, y: 26, w: 3, h: 4}}
      - {title: "Waiting for the client", type: kpi, dataset: kpi_eng13, config: {drill: {dataset: eng_with_client_register, title: "Documents waiting for the client", label: "See the documents", columns: *client_cols}, value_field: value, rollup: sum, direction: lower_better, label: "Documents waiting for the client", caption: "Issued and awaiting the client's response."}, layout: {x: 6, y: 26, w: 3, h: 4}}
      - {title: "Transmittals to the client", type: kpi, dataset: kpi_eng25, config: {value_field: value, rollup: sum, label: "Transmittals issued to the client", caption: "Formal issues to the client, all time."}, layout: {x: 9, y: 26, w: 3, h: 4}}
      - {title: "Client turnaround by month", type: line, dataset: eng_turnaround_monthly, config: {category_field: return_month, category_format: month, value_field: median_days, unit: d, rollup: none, caption: "Median days from our issue to the client's return. Lower is better."}, layout: {x: 0, y: 30, w: 7, h: 8}}
      - {title: "Documents waiting with the client, by project", type: bar_list, dataset: eng_with_client_by_project, config: {name_field: project_name, drill: {dataset: eng_with_client_register, field: project_number, title: "Documents waiting for the client", columns: *client_cols}, category_field: project_number, value_field: documents_with_client, detail_field: median_age_days, detail_format: "median {value} days waiting", limit: 6, caption: "Long waits are for the project manager to raise with the client."}, layout: {x: 7, y: 30, w: 5, h: 8}}

      # ---- 4. Output ---------------------------------------------------------------
      - {title: "Output", type: text, config: {content: "What engineering is issuing, month by month."}, layout: {x: 0, y: 38, w: 12, h: 2}}
      - {title: "Transmittals issued per month", type: bar, dataset: eng_transmittals_monthly, config: {category_field: issued_month, category_format: month, value_fields: [External (client), Internal, Vendor, Other], stacked: true, rollup: none, caption: "Every transmittal, by who it went to."}, layout: {x: 0, y: 40, w: 8, h: 7}}
      - {title: "Contract document list (NMR 601)", type: bar_list, dataset: eng_sdrl_601, config: {category_field: submission_status, value_field: documents, tones: {Approved: good, "With client": info, "Within company (correction)": watch, "Within company (MIS)": neutral, "With vendor": neutral}, caption: "Where each document on the contract's submission list stands."}, layout: {x: 8, y: 40, w: 4, h: 7}}

      # ---- 5. Detail ---------------------------------------------------------------
      - {title: "Detail", type: text, config: {content: "Registers for follow-up: sort by any column, export from the widget menu."}, layout: {x: 0, y: 47, w: 12, h: 2}}
      - {title: "Overdue document register", type: table, dataset: eng_overdue_register, config: {page_size: 12, columns: [{field: project_number, label: Project}, {field: project_name, label: "Project name"}, {field: document_number, label: Document}, {field: document_type, label: Type}, {field: pipeline_state, label: "Where it is"}, {field: current_status, label: Status}, {field: revision, label: Revision}, {field: target_date, label: "Target date"}, {field: days_overdue, label: "Days overdue"}]}, layout: {x: 0, y: 49, w: 12, h: 11}}
      - {title: "Material take-off coverage by unit", type: table, dataset: eng_bom_coverage_units, config: {columns: [{field: bom_unit, label: Unit}, {field: bom_lines, label: "BOM lines"}, {field: bom_qty, label: "BOM quantity"}, {field: covered_qty, label: "Covered by take-off"}, {field: coverage_pct, label: "Coverage %"}], caption: "Never add coverage across units."}, layout: {x: 0, y: 60, w: 12, h: 6}}

  # ======================================================================== COMMERCIAL
  - key: commercial
    name: "Commercial & Bids"
    description: "Is work coming in, where are bids waiting, and what happened to them? Values are on the restricted board."
    filters: []
    widgets:
      # ---- 1. Pipeline -------------------------------------------------------------
      - {title: "Pipeline", type: text, config: {content: "Is work coming in, and are we winning it?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Enquiries received", type: kpi, dataset: kpi_com01, config: {value_field: value, rollup: sum, label: "Enquiries received", caption: "All to date, including test entries awaiting exclusion."}, layout: {x: 0, y: 2, w: 3, h: 4}}
      - {title: "New enquiries", type: kpi, dataset: com_rfqs_monthly, config: {value_field: rfqs, trend_field: rfqs, value_from: last_complete, rollup: sum, direction: higher_better, delta_label: "vs the month before", label: "Enquiries received, last full month", caption: "The running month is left out until it ends."}, layout: {x: 3, y: 2, w: 3, h: 4}}
      - {title: "Bids won", type: kpi, dataset: kpi_com09, config: {value_field: value, rollup: sum, direction: higher_better, label: "Bids won", caption: "Awarded or purchase order received."}, layout: {x: 6, y: 2, w: 3, h: 4}}
      - {title: "Open enquiries", type: kpi, dataset: kpi_com11, config: {drill: {dataset: com_rfq_register, filters: [{column: is_open, value: 1}], title: "Open enquiries", label: "See the enquiries", columns: *rfqs_cols}, value_field: value, rollup: sum, label: "Enquiries open in the bid process", caption: "Still being worked by business development."}, layout: {x: 9, y: 2, w: 3, h: 4}}
      - {title: "From enquiry to project", type: funnel, dataset: mgmt_bid_conversion, config: {category_field: stage, value_field: rfqs, caption: "Each step as a share of all enquiries received."}, layout: {x: 0, y: 6, w: 5, h: 7}}
      - {title: "Enquiries received per month", type: bar, dataset: com_rfqs_monthly, config: {category_field: received_month, category_format: month, value_field: rfqs, rollup: none, caption: "Is the pipeline filling up or drying out?"}, layout: {x: 5, y: 6, w: 7, h: 7}}

      # ---- 2. Where bids are waiting -----------------------------------------------
      - {title: "Where bids are waiting", type: text, config: {content: "Which stage holds the open enquiries, and which approvals must come first?"}, layout: {x: 0, y: 13, w: 12, h: 2}}
      - {title: "Open enquiries by stage", type: bar_list, dataset: com_open_ageing, config: {drill: {dataset: com_rfq_register, field: open_stage, filters: [{column: is_open, value: 1}], title: "Open enquiries", columns: *rfqs_cols}, category_field: stage, value_field: open_rfqs, detail_field: median_days_in_stage, detail_format: "median {value} days in this stage", limit: 8, caption: "Where the open bids sit, and for how long."}, layout: {x: 0, y: 15, w: 6, h: 7}}
      - {title: "Approvals the bids are waiting for", type: bar_list, dataset: com_pending_approvals, config: {drill: {dataset: prc_pending_list, field: step, filters: [{column: module_code, value: commercial.rfq}], title: "Bids waiting for an approval", columns: *approvals_cols}, category_field: step_name, value_field: pending_steps, detail_field: approver_role, detail_format: "waiting for: {value}", limit: 6, caption: "No due dates are configured, so none counts as overdue yet."}, layout: {x: 6, y: 15, w: 6, h: 7}}

      # ---- 3. Outcomes -------------------------------------------------------------
      - {title: "Outcomes", type: text, config: {content: "What happened to the enquiries we received?"}, layout: {x: 0, y: 22, w: 12, h: 2}}
      - {title: "Bid outcomes", type: bar, dataset: com_outcomes, config: {category_field: outcome, value_field: rfqs, rollup: none, tones: {Awarded: good, "Converted to project": good, Declined: watch, Cancelled: neutral, Lost: act}, caption: "Lost bids are not recorded yet, so a win rate cannot be computed."}, layout: {x: 0, y: 24, w: 6, h: 8}}
      - {title: "Where every enquiry is today", type: bar_list, dataset: com_funnel, config: {category_field: funnel_position, value_field: rfqs, limit: 8, caption: "Each enquiry by its current step in the bid workflow."}, layout: {x: 6, y: 24, w: 6, h: 8}}

      # ---- 4. Detail ---------------------------------------------------------------
      - {title: "Detail", type: text, config: {content: "The enquiry register for follow-up: sort by any column, export from the widget menu."}, layout: {x: 0, y: 32, w: 12, h: 2}}
      - {title: "Test enquiries awaiting exclusion", type: kpi, dataset: kpi_com_test_rfqs, config: {value_field: value, rollup: sum, direction: lower_better, label: "Enquiries that look like tests", caption: "Counted above until the business confirms they can be excluded."}, layout: {x: 0, y: 34, w: 3, h: 4}}
      - {title: "Enquiry register", type: table, dataset: com_rfq_register, config: {page_size: 10, columns: [{field: rfq_number, label: RFQ}, {field: bid_number, label: Bid}, {field: client_code, label: Client}, {field: fabrication_category, label: Category}, {field: rfq_type, label: Type}, {field: funnel_position, label: "Where it is"}, {field: current_stage, label: Stage}, {field: received_on, label: Received}, {field: bid_deadline_riyadh, label: "Bid deadline"}, {field: submission_date, label: Submitted}, {field: probability_pct, label: "Win probability %"}, {field: open_stage_age_days, label: "Days in stage"}, {field: data_flag, label: "Data flag"}]}, layout: {x: 3, y: 34, w: 9, h: 10}}

  # ======================================================================== PROJECTS
  - key: projects
    name: "Projects & Gates"
    description: "How many projects are running, whether they move through their gates, and whether their set-up is complete."
    filters: []
    widgets:
      # ---- 1. Portfolio ------------------------------------------------------------
      - {title: "Portfolio", type: text, config: {content: "How many projects are running, and are they moving through their gates?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Active projects", type: kpi, dataset: kpi_prj01, config: {drill: {dataset: prj_project_list, filters: [{column: status_code, value: active}], title: "Active projects", label: "See the projects", columns: *projects_cols}, value_field: value, rollup: sum, label: "Active projects", caption: "Includes projects carried over from the previous system as shells."}, layout: {x: 0, y: 2, w: 4, h: 4}}
      - {title: "Gates passed", type: kpi, dataset: kpi_prj05, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Project gates passed", caption: "Only projects converted from a won bid have stage gates."}, layout: {x: 4, y: 2, w: 4, h: 4}}
      - {title: "Projects ready for reporting", type: kpi, dataset: kpi_prj11, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Projects ready for KPI reporting", caption: "Have a contract value and a planned end date; the others cannot be measured yet."}, layout: {x: 8, y: 2, w: 4, h: 4}}
      - {title: "Stage gates", type: bar, dataset: prj_gates_by_status, config: {category_field: gate, value_fields: [Passed, In review, Blocked, Pending], stacked: true, rollup: none, tones: {Passed: good, "In review": info, Blocked: act, Pending: neutral}, caption: "Each gate across the projects that have gates. Blocked needs a decision."}, layout: {x: 0, y: 6, w: 6, h: 7}}
      - {title: "Project origin", type: bar_list, dataset: prj_by_origin, config: {drill: {dataset: prj_project_list, field: origin, title: "Projects", columns: *projects_cols}, category_field: origin, value_field: projects, caption: "Active projects by how they entered the system."}, layout: {x: 6, y: 6, w: 3, h: 7}}
      - {title: "WBS approval", type: bar_list, dataset: prj_wbs_status, config: {category_field: wbs_status, value_field: wbs_nodes, tones: {Approved: good, Submitted: watch, Draft: neutral, Rejected: act}, caption: "Nodes waiting for approval hold up planning."}, layout: {x: 9, y: 6, w: 3, h: 7}}

      # ---- 2. Set-up ---------------------------------------------------------------
      - {title: "Set-up", type: text, config: {content: "Which projects are missing the master data that reporting depends on?"}, layout: {x: 0, y: 13, w: 12, h: 2}}
      - {title: "Project master-data completeness", type: table, dataset: prj_master_completeness, config: {page_size: 12, columns: [{field: project_number, label: Project}, {field: project_name, label: "Project name"}, {field: origin, label: Origin}, {field: status, label: Status}, {field: opco, label: "Operating company"}, {field: contract_value, label: "Contract value"}, {field: planned_end, label: "Planned end"}, {field: project_manager, label: "Project manager"}, {field: p6_schedule, label: "P6 schedule"}, {field: wbs, label: WBS}, {field: gates, label: Gates}, {field: document_count, label: Documents}]}, layout: {x: 0, y: 15, w: 12, h: 11}}

  # ======================================================================== PLANNING
  - key: planning
    name: "Planning (P6 hours)"
    description: "Are we earning the hours we spend? Reported on the latest draft schedule until a revision is approved."
    filters: []
    widgets:
      # ---- 1. Hours ----------------------------------------------------------------
      - {title: "Hours", type: text, config: {content: "Are we earning the hours we spend? All figures use the latest draft P6 schedule: no revision is approved yet."}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Hours spent against budget", type: kpi, dataset: kpi_pln12, config: {value_field: value, rollup: sum, unit: "%", label: "Labour hours spent against budget", caption: "Share of the budgeted labour hours already used."}, layout: {x: 0, y: 2, w: 4, h: 4}}
      - {title: "Labour productivity", type: kpi, dataset: kpi_pro11, config: {value_field: value, rollup: sum, unit: ratio, direction: higher_better, label: "Earned hours per hour spent", caption: "1.0 is on plan; below 1.0, hours run ahead of progress.", thresholds: [{op: lt, value: 0.9, color: red, label: "Behind plan"}, {op: lt, value: 0.95, color: amber, label: "Watch"}, {op: gte, value: 0.95, color: green, label: "On plan"}]}, layout: {x: 4, y: 2, w: 4, h: 4}}
      - {title: "Schedules not yet approved", type: kpi, dataset: kpi_pln01, config: {value_field: value, rollup: sum, direction: lower_better, label: "Projects reported on a draft schedule", caption: "Hours and progress are only as good as the draft.", thresholds: [{op: gt, value: 0, color: amber, label: "Draft only"}]}, layout: {x: 8, y: 2, w: 4, h: 4}}
      - {title: "Planned against earned hours", type: line, dataset: pln_labour_scurve, config: {category_field: week_start, value_fields: [Planned cumulative, Earned cumulative], unit: h, rollup: none, tones: {"Planned cumulative": neutral}, caption: "When earned hours fall below planned, the work is behind schedule."}, layout: {x: 0, y: 6, w: 8, h: 8}}
      - {title: "Activities by status", type: bar_list, dataset: pln_activity_status, config: {category_field: activity_status, value_field: activities, sort: false, tones: {Completed: good, "In Progress": info, "Not Started": neutral}, caption: "Activities in the latest draft schedule."}, layout: {x: 8, y: 6, w: 4, h: 4}}
      - {title: "Labour hours against budget, by project", type: progress, dataset: mgmt_labour_by_project, config: {name_field: project_name, category_field: project_number, value_field: hours_spent, target_field: hours_budget, unit: h, direction: lower_better, caption: "Over 100% means the budget is spent."}, layout: {x: 8, y: 10, w: 4, h: 4}}

      # ---- 2. Budget ---------------------------------------------------------------
      - {title: "Budget", type: text, config: {content: "Where are the hours going?"}, layout: {x: 0, y: 14, w: 12, h: 2}}
      - {title: "Hours by resource type", type: bar, dataset: pln_hours_by_type, config: {category_field: resource_type, value_fields: [Budget hours, Actual hours, Earned hours], unit: h, rollup: none, orientation: horizontal, tones: {"Budget hours": neutral}, caption: "Earned below actual means hours are not turning into progress."}, layout: {x: 0, y: 16, w: 12, h: 6}}

      # ---- 3. Detail ---------------------------------------------------------------
      - {title: "Detail", type: text, config: {content: "Which schedule revision each project is reported on, and why."}, layout: {x: 0, y: 22, w: 12, h: 2}}
      - {title: "Schedule status", type: table, dataset: pln_schedule_status, config: {columns: [{field: project_number, label: Project}, {field: project_name, label: "Project name"}, {field: reported_on, label: "Reported on"}, {field: revision_number, label: Revision}, {field: revision_status, label: "Revision status"}, {field: data_date, label: "Data date"}, {field: data_date_age_days, label: "Days since data date"}, {field: activity_count, label: Activities}, {field: status_reason, label: Reason}, {field: note, label: Note}]}, layout: {x: 0, y: 24, w: 12, h: 6}}

  # ======================================================================== PROCESS & ADOPTION
  - key: process
    name: "Process & Adoption"
    description: "Which decisions are waiting and for how long, and whether the team is using the system."
    filters: []
    widgets:
      # ---- 1. Approvals ------------------------------------------------------------
      - {title: "Approvals", type: text, config: {content: "Which decisions are waiting, who for, and for how long?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Approvals waiting", type: kpi, dataset: kpi_prc03, config: {drill: {dataset: prc_pending_list, title: "Approvals waiting", label: "See the approvals", columns: *approvals_cols}, value_field: value, rollup: sum, direction: lower_better, label: "Approval steps waiting for someone", caption: "Across bids, material take-offs, WBS and documents."}, layout: {x: 0, y: 2, w: 3, h: 5}}
      - {title: "At the busiest role", type: kpi, dataset: kpi_prc05, config: {value_field: value, rollup: sum, direction: lower_better, label: "Waiting at the busiest approver role", caption: "One role holds most of the queue."}, layout: {x: 3, y: 2, w: 3, h: 5}}
      - {title: "Approvals waiting, by module", type: bar_list, dataset: prc_pending_by_module, config: {drill: {dataset: prc_pending_list, field: module, title: "Approvals waiting", columns: *approvals_cols}, category_field: module, value_field: pending_steps, caption: "Which part of the business the queue belongs to."}, layout: {x: 6, y: 2, w: 6, h: 5}}
      - {title: "Who the approvals are waiting for", type: bar_list, dataset: prc_pending_by_role, config: {drill: {dataset: prc_pending_list, field: approver_role, title: "Approvals waiting", columns: *approvals_cols}, category_field: approver_role, value_field: pending_steps, limit: 8, caption: "Roles, never people."}, layout: {x: 0, y: 7, w: 6, h: 8}}
      - {title: "How long approvals have waited", type: bar_list, dataset: prc_pending_by_age, config: {drill: {dataset: prc_pending_list, field: waiting, title: "Approvals waiting", columns: *approvals_cols}, category_field: waiting, value_field: pending_steps, sort: false, tones: {"0-2 days": neutral, "3-7 days": neutral, "8-30 days": watch, "over 30 days": act}, caption: "Anything over 30 days is a stalled decision."}, layout: {x: 6, y: 7, w: 6, h: 8}}

      # ---- 2. Adoption -------------------------------------------------------------
      - {title: "Adoption", type: text, config: {content: "Is the team using the system?"}, layout: {x: 0, y: 15, w: 12, h: 2}}
      - {title: "People using the system", type: kpi, dataset: adp_active_users_monthly, config: {value_field: active_users, trend_field: active_users, value_from: last, rollup: max, direction: higher_better, delta_label: "vs previous month", label: "Active users, latest month"}, layout: {x: 0, y: 17, w: 3, h: 4}}
      - {title: "Hours of use", type: kpi, dataset: adp_hours_by_module, config: {value_field: active_hours, rollup: sum, unit: h, direction: higher_better, label: "Hours of active use, last 30 days", caption: "Time people actively spent in PMSv2."}, layout: {x: 3, y: 17, w: 3, h: 4}}
      - {title: "Modules in use", type: kpi, dataset: kpi_dqlive, config: {value_field: value, rollup: sum, direction: higher_better, label: "PMSv2 modules holding data", caption: "Production, quality and dispatch appear once those modules are used."}, layout: {x: 6, y: 17, w: 3, h: 4}}
      - {title: "Audited exports", type: kpi, dataset: kpi_adp04, config: {value_field: value, rollup: sum, label: "Exports recorded in the audit trail", caption: "Every download of PMSv2 data is logged."}, layout: {x: 9, y: 17, w: 3, h: 4}}
      - {title: "Active users per month", type: bar, dataset: adp_active_users_monthly, config: {category_field: activity_month, category_format: month, value_field: active_users, rollup: none, caption: "Is use growing as modules go live?"}, layout: {x: 0, y: 21, w: 6, h: 8}}
      - {title: "Where people spend their time", type: bar_list, dataset: adp_hours_by_module, config: {category_field: module, value_field: active_hours, unit: h, limit: 8, caption: "Active hours by module, last 30 days."}, layout: {x: 6, y: 21, w: 6, h: 8}}

  # ======================================================================== DATA READINESS (PMO)
  - key: data_readiness
    name: "Data Readiness"
    description: "PMO board: which modules hold data, what must be fixed before each KPI can be trusted, proposed exclusions and load provenance."
    filters: []
    widgets:
      - {title: "Readiness", type: text, config: {content: "Which modules hold data, and what must be fixed before each KPI can be trusted?"}, layout: {x: 0, y: 0, w: 12, h: 2}}
      - {title: "Modules holding data", type: kpi, dataset: kpi_dqlive, config: {value_field: value, rollup: sum, direction: higher_better, label: "PMSv2 modules holding data", caption: "A module counts once its key tables hold records."}, layout: {x: 0, y: 2, w: 3, h: 4}}
      - {title: "Projects ready for reporting", type: kpi, dataset: kpi_prj11, config: {value_field: value, rollup: sum, unit: "%", direction: higher_better, label: "Projects ready for KPI reporting", caption: "Contract value and planned end date both recorded."}, layout: {x: 3, y: 2, w: 3, h: 4}}
      - {title: "Document history from the migration", type: kpi, dataset: kpi_eng31, config: {value_field: value, rollup: sum, unit: "%", label: "Document revisions loaded by the migration", caption: "Stage dates before go-live are estimated, not recorded."}, layout: {x: 6, y: 2, w: 3, h: 4}}
      - {title: "Active users this month", type: kpi, dataset: kpi_adp01, config: {value_field: value, rollup: sum, direction: higher_better, label: "Users active this month", caption: "From usage telemetry and the audit trail."}, layout: {x: 9, y: 2, w: 3, h: 4}}
      - {title: "Module status", type: table, dataset: dq_module_liveness, config: {page_size: 20, columns: [{field: module, label: Module}, {field: data_status, label: Status}, {field: key_table_rows, label: Records}, {field: first_business_date, label: "First entry"}, {field: last_business_date, label: "Latest entry"}, {field: days_since_last_entry, label: "Days since last entry"}, {field: go_live_note, label: Note}], row_rules: [{column: data_status, op: contains, value: "Awaiting", bg_color: "var(--mg-watch-soft)"}]}, layout: {x: 0, y: 6, w: 12, h: 10}}
      - {title: "Data checks", type: table, dataset: dq_readiness_checks, config: {page_size: 10, columns: [{field: check_name, label: Check}, {field: kpi_id, label: KPI}, {field: affected, label: Affected}, {field: population, label: "Out of"}, {field: affected_pct, label: "Affected %"}, {field: backlog_item, label: "Backlog item"}], row_rules: [{column: affected_pct, op: gte, value: 50, bg_color: "var(--mg-act-soft)"}]}, layout: {x: 0, y: 16, w: 12, h: 10}}
      - {title: "Proposed exclusions (awaiting confirmation)", type: table, dataset: dq_exclusion_candidates, config: {columns: [{field: entity_type, label: "Record type"}, {field: candidate_reason, label: Reason}, {field: proposed_action, label: "Proposed action"}, {field: status, label: Status}, {field: candidates, label: Records}, {field: rows_affected, label: "Rows affected"}]}, layout: {x: 0, y: 26, w: 12, h: 6}}
      - {title: "Restore and load information", type: table, dataset: dq_load_info, config: {columns: [{field: backup_finish_riyadh, label: "Backup finished (Riyadh)"}, {field: snapshot_date, label: "Snapshot date"}, {field: backup_type, label: "Backup type"}, {field: has_backup_checksums, label: Checksums}, {field: restored_at_utc, label: "Restored (UTC)"}, {field: conditioned_at_utc, label: "Prepared (UTC)"}, {field: layer_version, label: "Reporting layer"}, {field: freshness_status, label: Freshness}]}, layout: {x: 0, y: 32, w: 12, h: 4}}

# ---- scheduled management pack ---------------------------------------------------------------
# Audited exports of the datasets above, sent by send_scheduled_reports (Riyadh, 06:00, calendar
# weeks and months): one email and one audit row per recipient, each file stamped "Data as of"
# with the backup time. Recipients are NOT in this file: pass seed_domain_pack --recipients or
# set them on the Reports page. Classified content (rpt_fin, pack-restricted.yaml) is never
# attached to an email: it is link-only (DEC-07), so that pack schedules no reports.
reports:
  # The Executive Overview itself, as a PDF, every week (created off: an administrator
  # adds the recipients on the Reports page or with seed_domain_pack --recipients).
  - {key: weekly_executive_board, name: "PMSv2 weekly · Executive Overview (PDF)", board: executive, schedule: weekly}
  - {key: weekly_kpi_summary,     name: "PMSv2 weekly · KPI summary",               dataset: mgt_kpi_summary,       schedule: weekly,  format: pdf}
  - {key: weekly_overdue_docs,    name: "PMSv2 weekly · Overdue document register", dataset: eng_overdue_register,  schedule: weekly,  format: xlsx}
  - {key: weekly_rfq_register,    name: "PMSv2 weekly · RFQ summary register",      dataset: com_rfq_register,      schedule: weekly,  format: xlsx}
  - {key: weekly_bd_approvals,    name: "PMSv2 weekly · Pending BD approvals",      dataset: com_pending_approvals, schedule: weekly,  format: pdf}
  - {key: monthly_data_readiness, name: "PMSv2 monthly · Data readiness checks",    dataset: dq_readiness_checks,   schedule: monthly, format: pdf}
  - {key: monthly_module_liveness, name: "PMSv2 monthly · Module liveness",         dataset: dq_module_liveness,    schedule: monthly, format: pdf}
